# Deploy the site to GitHub Pages.
#
# The legacy Jekyll builder could not handle this repo once /examplereports/
# landed — 255 static report pages, ~23MB — and failed six builds in a row with
# only "Page build failed" to go on. Nothing here needs Jekyll: the reports are
# self-contained HTML with their data inlined. This uploads the tree as-is.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
