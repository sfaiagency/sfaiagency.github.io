}, {"text": "My sophomore year I played Marcy in Snoopy!!!. No, it is not You\u2019re a Good Man, Charlie Brown, and yes, the three exclamation points are necessary. Marcy isn\u2019t necessarily in the show proper, but the director added several ensemble members and based us off actual Peanuts characters.", "imageUrl": null}, {"text": "Matti apparently has a thing about my face; at one point while I was netting a big rainbow for him on Lago Tres he spat Copenhagen all the way across it, and at another point down on La Panisa he buried the size #2 hook of his Great Pumpkin (a big orange articulated streamer fly) in it on his back c", "imageUrl": null}, {"text": "\u201cGrab your passport and pack your bags because the Peanuts gang is going on their first international jaunt in BON VOYAGE, CHARLIE BROWN (AND DON\u2019T COME BACK!!), arriving on DVD for the first time ever October 6, 2015 from Paramount Home Media Distribution.  Released theatrically in 1980, and celebr", "imageUrl": null}, {"text": "END_OF_DOCUMENT_TOKEN_TO_BE_REPLACED\n\nAnd Bring The Peanuts Gang Together! Play Now => https://itunes.apple.com/app/peanuts-snoopys-town-tale/id1013992870?mt=8\n\nGrub is featured on the App Store", "imageUrl": null}, {"text": "DOYLESTOWN, Pa. - Before the turkey and after the turkey, football and Thanksgiving just go together, like Lucy and Charlie Brown in the fall classic.\n\nIt was 67 years ago this week when folks opened up the paper and, for the first time, saw Lucy pull the football away just as Charlie Brown tried to", "imageUrl": null}, {"text": "Albert Uderzo, Neil Adams, and Jim Davis. You might not recognize any of these names but if you watch cartoons or read comics you are most likely familiar with their work. These guys are the illustrators behind some of the most famous comic book characters and most people will instantly recognize th", "imageUrl": null}, {"text": "Vroom, vroom: One intricate display sees a car created out of pumpkin carvings\n\nPlenty of people commented on the photos as well, including Todd French, who admitted: 'All of these make me ashamed of my basic jagged tooth Charlie Brown-esque pumpkins.'\n\nAnd the Twitter user 'Ghostly Bree asked: 'Whe", "imageUrl": null}, {"text": "No one loves to celebrate with food more than Garfield the cat, but he finds he doesn\u2019t get the chance when he learns that he must go on a diet . . . on Thanksgiving of all days. After you\u2019ve set the turkey day tradition with A Charlie Brown Thanksgiving, Garfield\u2019s Thanksgiving is the perfect follo", "imageUrl": null}, {"text": "Octet And Originals by Antonio Adolfo\n\nAll The Earth Will Mourn by Brian Eaton\n\nWin a copy of It's the Great Pumpkin, Charlie Brown on Pumpkin-Shaped Translucent Orange Vinyl!\n\nGet more of a good thing!\n\nOur weekly newsletter highlights our top stories, our special offers, and includes upcoming jazz", "imageUrl": null}, {"text": "\u201cI kind of miss the days when you saw The Grinch and Charlie Brown\u2019s Christmas once a year at Christmas, and cartoons only on Saturday morning.\u201d Me too\u2026", "imageUrl": null}, {"text": "Arachibutyrophobia is a proposed humorous name for the fear of peanut butter getting stuck to the top of your mouth, coined by Charles M. Schulz in a 1982 edition of his famed Peanuts comic strip. But why does peanut butter have such a tendency to get stuck in your palate when so many other foods do", "imageUrl": null}, {"text": "It\u2019s FINALLY here!!! The year 2020 is the year that lives like a decade, so it\u2019s felt like we\u2019d never make it to Halloween season. But now with it only 33 days until the Great Pumpkin, I can step out on my own home turf.\n\nYour humble Penguin is a horror freak. Out of all the genres within sci-fi, fa", "imageUrl": null}, {"text": "A broken pincer could make for a crabby crab\n\nI suspect we\u2019ve all experienced periods of Lucy Van Pelt style crabbiness over the past months, but this creature is \u2018crabby\u2019 all the time. It is, after all, a crab: a familiar sight in my part of the world.\nSince I usually encounter crabs in the water, ", "imageUrl": null}, {"text": "I miss Charlie Brown and the gang. The antics of the Peanuts\u2019 cartoon characters created joyful moments of laughter for many. When Charles Schulz died in 2000, the whole world grieved. Today the Sunday funny papers continue to carry reruns of the famous comic strip in Schulz\u2019s honor.\n\nPeanuts first ", "imageUrl": null}, {"text": "Apologies to those of you who received the \u201cYou\u2019re a Good Man, Charles Schulz\u201d blog two weeks in a row. I\u2019m still learning the WordPress way of doing things and temporarily posted this blog immediately rather than scheduling it for the next week. To quote Charlie Brown, \u201cGood grief!\u201d Bill", "imageUrl": null}, {"text": "Who living at The Garlands doesn\u2019t remember the beloved Peanuts Gang?\n\nCreated by Charles M. Schulz, the meek, anxious, and innocent Charlie Brown was not the smart kid or the popular one. He was just an average kid who entertained us every Sunday from 1952 to 2000 in the funny papers. As Charlie Br", "imageUrl": null}, {"text": "Der Bingle, Der Kringle, and that\u2019s Charlie Brown up there in the corner\n\nNow, I\u2019m not going to waste your time extolling the virtues of \u201cWhite Christmas\u201d or \u201cMiracle on 34th Street\u201d or even \u201cA Charlie Brown Christmas\u201d. (Notice that I do not mention \u201cIt\u2019s a Wonderful Life\u201d; I honestly do not think i", "imageUrl": null}, {"text": "Snoopy, the much-loved character of Charles M.Schulz\u2019s popular comic strip, Peanuts, made his debut in the 1950s and an original Snoopy drawing is now featured on the Smeg Fab10.\n\nThe artwork features Snoopy laying in his classic pose above his doghouse, flanked by his friend Woodstock\n\nIt is a limi", "imageUrl": null}, {"text": "Dollywood\u2019s Harvest Festival presented by Humana (Sept. 28- Nov. // Card generator, ported from the app's shareCard.js so a downloaded report
// produces the same three assets the web app does. Instagram has no web intent
// for posting on the artist's behalf, so the square and story cards ARE the
// Instagram path: download the image, paste the caption in the app.
const CARD_FONT = "'franklin-gothic-atf', Arial, Helvetica, sans-serif";
const CARD_BRAND = '#E15656';  // the pink sampled from logo.png, not --coral
const FORMATS = [
  {id:'square',label:'Instagram (square)',hint:'Square',width:1080,height:1080},
  {id:'wide',  label:'X / LinkedIn (wide)',hint:'Wide', width:1200,height:675},
  {id:'story', label:'Instagram Story',    hint:'Story',width:1080,height:1920}
];
// Layout parameters in "u" units — 1/1080 of the card width — so all three
// formats stay balanced instead of sharing fixed sizes that only suit one.
const LAYOUTS = {
  square:{chip:300,gapAfterChip:80,headlineFont:44,headlineLH:56,statFont:34,statLH:48,statGap:12,maxStats:3,chipRight:false},
  story: {chip:420,gapAfterChip:100,headlineFont:48,headlineLH:62,statFont:38,statLH:52,statGap:14,maxStats:3,chipRight:false},
  wide:  {chip:230,gapAfterChip:0,  headlineFont:34,headlineLH:44,statFont:25,statLH:34,statGap:10,maxStats:2,chipRight:true}
};
function wrapText(ctx,text,maxWidth){
  const words=String(text).split(' '); const lines=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxWidth&&line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line); return lines;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function renderCard(f,d){

  const chip=L.chip*u, chipX=L.chipRight?f.width-pad-chip:pad;

  ctx.font='800 100px '+CARD_FONT;
  const wordW=ctx.measureText('Croquis').width/100*brandFont;
  const logoSz=brandFont*1.32, brandGap=brandFont*0.28;
  const brandW=(d.logo?logoSz+brandGap:0)+wordW;
  const rowY=pad+Math.max(logoSz,labelFont)*0.55;

  ctx.fillStyle='#2D2D2D'; ctx.font='700 '+labelFont+'px '+CARD_FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('My Croquis Score',chipX+chip/2,rowY);

  const brandX=L.chipRight?pad:(f.width-pad-brandW);
  ctx.textAlign='left';
  if(d.logo) ctx.drawImage(d.logo,brandX,rowY-logoSz/2,logoSz,logoSz);
  ctx.fillStyle=CARD_BRAND; ctx.font='800 '+brandFont+'px '+CARD_FONT;
  ctx.fillText('Croquis',brandX+(d.logo?logoSz+brandGap:0),rowY);

  const chipY=rowY+labelFont*0.55+chip*0.04;
  ctx.fillStyle=d.color; roundRect(ctx,chipX,chipY,chip,chip,chip*0.14); ctx.fill();

  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  const textX=pad;
  const textW=L.chipRight?(chipX-pad-50*u):(f.width-pad*2);
  let ty=L.chipRight?rowY+logoSz/2+74*u:chipY+chip+L.gapAfterChip*u;
  ctx.fillStyle='#2D2D2D'; ctx.font='700 '+(L.headlineFont*u)+'px '+CARD_FONT;
  for(const line of wrapText(ctx,d.headline,textW)){ ctx.fillText(line,textX,ty); ty+=L.headlineLH*u; }

  ty+=24*u; ctx.font='400 '+(L.statFont*u)+'px '+CARD_FONT;
  for(const stat of d.stats.slice(0,L.maxStats)){
    ctx.fillStyle=CARD_BRAND; ctx.beginPath(); ctx.arc(textX+8*u,ty-10*u,7*u,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555555';
    for(const line of wrapText(ctx,stat,textW-40*u)){ ctx.fillText(line,textX+36*u,ty); ty+=L.statLH*u; }
    ty+=L.statGap*u;
  }

  ctx.fillStyle='#FAFAFA'; ctx.fillRect(0,f.height-footerH,f.width,footerH);
  ctx.fillStyle=CARD_BRAND; ctx.font='700 '+(30*u)+'px '+CARD_FONT;
  ctx.fillText(d.url,pad,f.height-42*u);
  return cv.toDataURL('image/png');
}

// Cards are drawn once the webfont is ready, so the canvas doesn't bake in the
// Arial fallback; document.fonts is absent in older browsers, hence the guard.
const cards = {};
let curFmt='square';
function drawAll(){
  for(const f of FORMATS){ try{ cards[f.id]=renderCard(f,cardData); }catch(e){} }
  showCard(curFmt);
}
function showCard(id){
  curFmt=id;
  const box=document.getElementById('cardPreview');
  const f=FORMATS.find(x=>x.id===id);
  box.innerHTML = cards[id] ? `<img src="${cards[id]}" alt="Share card preview (${f.label})">` : '';
  for(const b of document.querySelectorAll('#fmtRow .fmt')) b.classList.toggle('on', b.dataset.fmt===id);
}
function downloadCard(id){
  if(!cards[id]) return;
  const a=document.createElement('a');
  a.href=cards[id]; a.download='croquis-score-'+grade.g.replace('+','plus')+'-'+id+'.png';
  document.body.appendChild(a); a.click(); a.remove();
}

const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('fmtRow').addEventListener('click',e=>{
  const b=e.target.closest('.fmt'); if(b) showCard(b.dataset.fmt);
});
document.getElementById('dlCard').addEventListener('click',()=>downloadCard(curFmt));
// Instagram accepts no web share intent, so the button does the two things the
// artist would otherwise do by hand: save the square (or story) card and put
// the caption on the clipboard, ready to paste into the app.
document.getElementById('igBtn').addEventListener('click',async e=>{
  const id = curFmt==='story' ? 'story' : 'square';
  showCard(id); downloadCard(id);
  const btn=e.currentTarget;
  try{ await navigator.clipboard.writeText(shareText); btn.textContent='Saved — caption copied'; }
  catch{ btn.textContent='Image saved'; }
  setTimeout(()=>{ btn.innerHTML='<span class="ig">'+IG_ICON+'Instagram</span>'; },2600);
});
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
</script>
