Lion, The Witch and the Wardro", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "As a composer, she wrote Stripsody(1966), in which she exploits her vocal technique using comic book sounds (onomatopoeia), and Morsicat(h)y (1969), a composition for the keyboard (with the right hand only) based on Morse code.\n\nCathy Berberian was born in Attleboro, Massachusetts to Armenian parent", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "10) THE PHANTOM TOLLBOOTH by Norton Juster\n\nMilo is bored. He thinks everything is a waste of time. One day he receives a magic tollbooth and a mysterious map. He drives his toy car through the tollbooth and finds himself in the Lands Beyond, a world where the Kingdom of Wisdom is in trouble. Milo, ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "\u201cIt's a very whimsical, sweet, profound story with lots of wordplay \u2014 kind of like The Phantom Tollbooth. It is very zany but a thoroughly enjoyable read, and pretty quick to get through.\u201d\n\nPlanning to read: Love in the Time of Cholera by Gabriel Garc\u00eda M\u00e1rquez and The City We Became by N.K. Jemisin", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Phantom Tollbooth by Norman Juster and Mary Poppins by P. L. Travers are two of the classics of children\u2019s fantasy literature. Like much children\u2019s fantasy, both books tell the stories of an ordinary child or group of children who are suddenly thrown into a world of magic and adventure. The circ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "audio\nThe Phantom Tollbooth\nAuthor: Norton Juster | Narrator: Norton Juster and Rainn Wilson\nRelease Date: March 19, 2019\nHailed as \"a classic. . . . humorous, full of warmth and real invention\" (The New Yorker), this beloved story--first published more than fifty ago--introduces readers to Milo and", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Things happen at random: The Phantom Tollbooth and Mary Poppins", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Exhibited here is an original signed and inscribed ink sketch of Eisner\u2019s most famous character, masked vigilante Denny Colt, a.k.a. \u201cThe Spirit,\u201d the cemetery-dwelling, crime-fighting detective without superpowers (this was very unusual for the time) who \u201cdied\u201d and was reborn. The comic strip named", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "All in Color for a Dime\n\nI recently finished reading Fredric Wertham's Seduction of the Innocent for the first time and found myself in need of a little mental palate-cleansing. I first turned to The Great Comic Book Heroes by Jules Feiffer for the third time... sort of. That book was originally pub", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Together again for the first time, here come the greatest comic book superheroes ever assembled between two covers:  down from the heavens\u2014Superman and the Mighty Thor\u2014or swinging over rooftops\u2014the Batman and Spider-Man; star-spangled, like Captain America and Wonder Woman, or clad in darkness, like", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Piano Craft Gallery presents the exhibition \u201cMargaret Arend: If You Really Loved Me, You\u2019d Find Me, The Strips 1970 \u2013 2010\u201d a collection of over 60 cartoon strips by the Pullitzer Prize winning author, cartoonist and playwright from June 15 through August 11. This will be Arend\u2019s first New York ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "If someone asked me for an exhaustive history and origin story of comics I\u2019d point them to Gerard Jones\u2019 book, Men of Tomorrow: Geeks, Gangsters and the Birth of the Comic Book. This book is often cited and hailed as the definitive guide to the creation story of comics.\n\nJones goes far back in his a", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "A certain kind of ex-child will be ecstatic to read that Norton Juster will come to Washington on July 12 for a screening of a new documentary on his famous children\u2019s book The Phantom Tollbooth.\n\nThe Phantom Tollbooth: Beyond Expectations tells the story of how the Phantom Tollbooth came to be and ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "LoveReading View on The Phantom Tollbooth\n\nChosen as a favourite by Philip Pullman: \"Superb wit and vigorous invention.\"\n\nAs whimsical as The Wizard of Oz, but with the allegorical wisdom of Alice in Wonderland, The Phantom Tollbooth is a book for adults and children to share.  Milo is bored with ev", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Practically as soon as he could hold a pencil, he was copying the Peanuts comic strip and creating stories of his own. Later, he worked at The DePauw student newspaper to hone his illustration and graphic design skills.\n\nIn between, as a fifth grader, his school librarian handed him \u201cThe Phantom Tol", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Sometimes a children\u2019s classic is all you need to sit back and re-evaluate your adult life. It gives one a much needed break from everyday chaos, driving the Reader towards quiet contemplation of the inner self in context of the external world. The Phantom Tollbooth was an absolute delight to read f", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Minnie the Minx, whose real name is Hermione Makepeace, is a British comic strip and comic strip character published in the comic magazine The Beano. Created and originally drawn by Leo Baxendale, she first appeared in issue 596, dated 19 December 1953, but is generally considered as being permanent", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Illustration by Aubry Andersen from Chapter 2 of Voyage\n\n4)    I\u2019ve read books which annoyed me to the point where I wanted to throw them across the room. As a reader, what do you think makes a good story? What is it that makes you want to stop turning pages?\n\nI have a bachelor\u2019s degree in English l", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Phantom Tollbooth is a children's adventure novel and modern fairytale by Norton Juster. It was published in 1961 with illustrations by Jules Feiffer.\n\nIt tells the story of a bored young boy named Milo who unexpectedly receives a magic tollbooth one afternoon and, having nothing better to do, d", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Welcome to The Phantom Tollbooth Wiki\n\nThis a wiki about the children's adventure novel and modern fairy tale published in 1961, written by Norton Juster and illustrated by Jules Feiffer", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "This apparently reprints all the material in the original issue, including stats and a short essay, and there\u2019s a backup story mostly by Jules Feiffer. (It\u2019s not very interesting, either.)", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "A new favorite of mine is celebrating it's 50th year in print!\n\nThe Phantom Tollbooth by Norton Juster is such a delight to read that I purchased it and plan to read it again and again. For anyone who loves the English language, this book will be a winner for you. It's clever, tongue-in-cheek method", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Historical Society celebrates \u2018The Phantom Tollbooth\u2019 and its Brooklyn roots", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Happy Birthday to The Phantom Tollbooth", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Phantom Tollbooth by Norton Juster:\nThe Phantom Tollbooth is the story of a bored young boy named Milo who unexpectedly receives a magic tollbooth that transports him to the Kingdom of Wisdom, once a prosperous but now troubled place because two kings are fighting over which is more important \u2014 ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Norton Juster was born on July 2, 1929 in New York City, New York, USA. He is a writer, known for The Dot and the Line: A Romance in Lower Mathematics (1965), The Phantom Tollbooth (1970) and The Phantom Tollbooth.\nBiography,Juster was born in Brooklyn, New York City. His father, Samuel Juster, was ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "On the one hand, The Phantom Tollbooth is a delightful picaresque along the lines of Alice in Wonderland or The Wizard of Oz, about a boy (Milo) who explores a fantasy land in which metaphors have come to life. Milo\u2019s companion, the Watchdog, is made of clocks; and because time flies, so can he. Whe", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Phantom Tollbooth by Norton Juster", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "\u201cIt seems to me that almost everything is a waste of time,\u201d Milo remarks as he walks dejectedly home from school. But his glumness soon turns to surprise when he unwraps a mysterious package marked ONE GENUINE TURNPIKE TOLLBOOTH. Once through the Phantom Tollbooth Milo has no more time to be bored f", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "\nIllustrated by Stephen Axelsen. Did he fall, or was he pushed? The complicated tale is also loaded with word-play. A fun exploration of one type of detective story and a great way to play with nursery rhyme stories. For students who may not have had a lot of exposure to nursery rhymes before enteri", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Milo, who has plenty of time, sets off for Dictionopolis\n\nThere's a mischievous monkey and a man wearing yellow\n\nWait, I think I'm getting this confused\n\nI haven't actually read that book\n\nI meant the Phantom Tollbooth.\n\nThe Hard Taco song for January is called, \"The Plexus.\" It is the theme song fo", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Davenport Junior Theatre (DJT) will be celebrating its 70th season of theater \u201cfor kids, by kids\u201d with a four-show Mainstage season consisting of two DJT classics, Winnie-the-Pooh and Imagine That!, and two first-time shows: Annie Jr. and The Phantom Tollbooth. All shows will be free to audience mem", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "5. 'The Phantom Tollbooth' by Norton Juster with illustrations by Jules Feiffer\n\nTalk about a nostalgia kick. A magic game transports an excessively bored young man to a fantasy realm featuring a \"watchdog\" with clocks on its body, a place where learning, thinking, and exploring the world over are t", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Milo is the bored protagonist of Norton Juster\u2019s The Phantom Tollbooth who, out of nothing else to do one afternoon, ventures into the Kingdom of Wisdom using a magic tollbooth. This world filled with clever idioms teaches Milo the joys of learning after he helps to save it. It\u2019s safe to say as kids", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "My favorite book is, unquestionably, The Phantom Tollbooth. In it, the Whether Man wisely suggests that Milo \u201chope for the best, expect the worst, and be unsurprised by anything in between,\u201d or something to that effect. This year, my Birthday Challenge was an absolutely perfect illustration of this.", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Norton Juster, who died a few days ago, is obviously best known for having written The Phantom Tollbooth, but was also an architect and, for many years, a university teacher. Not that he appears to have had much enthusiasm for education as it\u2019s practised.\n\nI picked up a few credentials along the way", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "I first believed in god at age nine.\n\nI first believed in Will Eisner at age seven.\n\nGod left at age 18. I bought my most recent Eisner collection (Hawks of the Sea \u2013 his first comic strip) last year.\n\nI know I was seven because when I rifle through the black and white reprints of The Spirit from 19", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "From \"Kill My Mother,\" by Jules Feiffer (Liveright Publishing Corporation). 20 x 16 inches. Courtesy of the artist.\n\nJules Feiffer, born in 1929 and raised in the Bronx, worked as an assistant to cartoonist Will Eisner and wrote dialogue for The Spirit. Feiffer\u2019s Village Voice cartoon strip brought ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "From \"Kill My Mother,\" by Jules Feiffer (Liveright Publishing Corporation). 24 x 18 inches. Courtesy of the artist.\n\nA recent gift to the Parrish of nine drawings by Joe Zucker, all are studies for a 1992 print project with Riverhouse Editions in Steamboat Springs, Colorado and prompted an in-depth ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "In collecting and satirizing the genre\u2019s tropes, Ad Verbum is the Phantom Tollbooth of interactive fiction. Poet and scholar Nick Montfort\u2019s text adventure tasks you with demolishing the Wizard of Wordplay\u2019s mansion, and takes its cues as much from surrealism as it does from Zork (1977) or Adventure", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "2. BARK GEORGE! by Jules Feiffer \u2013 Harper Collins, 1999: Even though this is an older title, the page turns are great! \"George\u2019s mother said: 'Bark, George.' George went: 'Meow.' \" Feiffer sets up the conflict in a spread and a half. That is masterful. I also noted the intentional use of repetition ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "But this isn\u2019t really why I\u2019m writing about Beeminder, even if it IS a nicely-designed web application copy-written with a charm reminiscent of The Phantom Tollbooth. The reason I\u2019m writing is because the blog is an amazing trove of writing about goal setting, written in an accessible magazine-like ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Director Jen Ryle is co-founder of Olympia family Theater, and has directed numerous plays for OFT, including: The Phantom Tollbooth, Alice\u2019s Adventures in Wonderland, The Best Christmas Pageant Ever, and Rapunzel.\n\nOFT would like to express its appreciation for its Season Sponsors: Visionseed Publi", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Phantom Tollbooth by Norton Juster and Jules Feiffer", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Warning: \"continue\" targeting switch is equivalent to \"break\". Did you mean to use \"continue 2\"? in /home/aws_tollbooth/tollbooth.org/plugins/system/jsntplframework/libraries/joomlashine/template/megamenu.php on line 228\n The Phantom Tollbooth - The Maze Runner\n\nFans of the popular book series The M", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "With almost 5 million copies sold 60 years after its original publication, generations of readers have now journeyed with Milo to the Lands Beyond in this beloved classic. Enriched by Jules Feiffer\u2019s splendid illustrations, the wit, wisdom, and wordplay of Norton Juster\u2019s offbeat fantasy are as begu", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Jules Feiffer's comic strip and outlook influenced a number of cartoonists who came after.\n\nLucy Shelton Caswell, curator of the Billy Ireland Cartoon Library and Museum at The Ohio State University, echoes McDonnell. \"He studied at the feet of a couple of the masters -- Milton Caniff and Will Eisne", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "6. Tock, the watchdog, in The Phantom Tollbooth by Norton Juster\nTrue to the book's anthropomorphic punning, Tock is a friendly guardian who lives up to his name (he has a whopping great watch face embedded in his flanks).\n\n7. The Black Rabbit of Inl\u00e9 in Watership Down by Richard Adams\nWho would hav", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "At one point in the children\u2019s novel \u201cThe Phantom Tollbooth,\u201d its protagonist, Milo, sets out to reach infinity. When he abandons the quest as hopeless, he is advised \u201cInfinity is a poor place.\u201d\n\n\u201cFantastic Numbers and Where to Find Them: A Cosmic Quest from Zero to Infinity,\u201d by Antonio Padilla, ho", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Sprague de Camp, illustrated by Tim Kirk. It was published by Mirage Press. [1]Author: L. Sprague de Camp. Marie O'Regan is a British Fantasy Award-nominated writer and editor of horror and dark fantasy fiction. She is the author of four collections, Mirror Mere, Bury Them Deep, In Times of Want and", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "6 edition of Illustrations of English religion found in the catalog.\n\nSearch the world's most comprehensive index of full-text books. My libraryMissing: English religion. via Swiss Miss. THE PHANTOM TOLLBOOTH. The Phantom Tollbooth isn\u2019t merely one of the most celebrated children\u2019s books of all time", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Will Eisner\u2019s artist tools and a Spirit script by Jules Feiffer at the Society of Illustrators in New York.\n\nThe exhibit continues in the basement with original art, including rough layouts, mostly of his later works.  But two Smash Comics pages from the Eisner and Iger Studio (#6 from 1939 and #8 f", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "In The R.Crumb Handbook, Robert Crumb is quoted as saying:\n\n\u201cIf you look at a comics page drawn by Jack Davis or at Wally Wood\u2019s science fiction stuff, who cares about the narrative? But the artwork is wonderful, a true pleasure to the eye. What technique! With Charles Schulz or Jules Feiffer, it\u2019s ", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "This is book number 2 in the Talespinners series.\n\nIn this action-packed sequel to Saving Fable, Indira finds herself thrown into a quest full of dragons, unlikely allies, and high stakes. Perfect for readers of The Land of Stories and The Phantom Tollbooth!\n\n\"A worthy follow-up to a standout series", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "And oddly and tragically enough, I think that kind of thing carries into adulthood with a lot of people. Well, one thing has changed:The Phantom Tollbooth is a delightful book full of wordplay, and what incredible wordplay at that!\n\nIt is a children's book, which not just teaches about numbers and l", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "(In which the writer explores a black gloom with Jilly Cooper, gets stuck with Milo (from the Phantom Tollbooth) in the doldrums, talks with Rhona Cameron about adoption, consults Walt Whitman and finally decides to make her peace)\n\nI have been stuck in once of these since Saturday.", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Phantom Tollbooth\nFor Milo, everything's a bore. When a tollbooth mysteriously appears in his room, he drives through only because he's got nothing better to do. But on the other side, things seem different. Milo visits the island of Conclusions (you get there by jumping), learns about time from", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "The Phantom Tollbooth of Magnolia.\n\nThis entry was posted in A Dog's Life, Cats and Dogs, Chlo\u00eb's Excellent Adventures and tagged cats and dogs, dachshund, wirehair dachshund. Bookmark the permalink.\n\n4 responses to \u201cChlo\u00eb Wins a Standoff on 43rd Avenue West\u201d", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Image via The Phantom Tollbooth", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}, {"text": "Several years ago, a colleague introduced me to \u201cThe Island of Conclusions,\u201d an allegory from the well-known children\u2019s story \u201cThe Phantom Tollbooth\u201d written by Norton Juster in 1961 (Juster 1961). In one section of the story a little boy named Milo and his dog, Tock, are driving along in their magi", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}]}, {"datasetName": "The Pile (uncopyrighted)", "hfPath": "monology/pile-uncopyrighted", "found": true, "count": 18, "mentionsFound": 18, "exact": true, "coverageComplete": false, "rowsCovered": 917770, "rows": [{"text": "Crockett Johnson\n\nCrockett Johnson (October 20, 1906 \u2013 July 11, 1975) was the pen name of the American cartoonist and children's book illustrator David Johnson Leisk. He is best known for the comic strip Barnaby (1942\u20131952) and the Harold series of books beginning with Harold and the Purple Crayon.\n", "imageUrl": null, "url": null, "meta": null, "links": null, "quote": null}]}, {"datasetName": "C4 (en)", "hfPath": "allenai/c4", "found": true, "count": 27, "mentionsFound": 27, "exact": true, "coverageComplete": false, "rowsCovered": 2230060, "rows": []}], "datasetSearch": {"evidenceWithheld": {"derivative": 139, "unverified": 695, "person_photo": 464, "unrelated": 209, "storefront": 621, "unverified_image": 1660, "not_flat_art": 62, "merchandise": 52, "explicit": 1}, "evidenceShown": 131, "summary": {"datasetsPresent": 7, "totalDatasets": 7, "credibleMentions": 10138, "highConfidenceMentions": 6499, "nameMatchMentions": 3639, "thirdPartyPropertyMentions": 0, "lowConfidenceMentions": 0}}}</script>

  ${PROBE?`<section><h2>What each AI model did with your writing</h2>
    <p class="note" style="margin:0 0 16px">One card per piece. The line-up test is the one that
    carries the weight: the model is shown your real passage among rewrites of it and asked to
    pick yours. Guessing scores 25 out of 100, so the number to read is the gap.</p>
    ${PROBE.works.map((w,i)=>{
      const hit = w.runs.some(r=>r.recognised);
      return `<div class="pw${hit?' hit':''}">
        <div class="pw-h"><span class="pw-n">${i+1}</span><span class="pw-t">${esc(w.title)}</span></div>
        ${w.runs.map(r=>{
          const lu=r.lineUp, up=lu.pct>lu.chancePct;
          return `<div class="pw-run"><div class="pw-m">${esc(r.model)}</div>
          <div class="pw-bar">
            <b>Picked your writing out of the line-up ${lu.pct} times in 100.</b>
            <span style="color:var(--gray);font-size:14px"> Guessing scores ${lu.chancePct}.</span>
            <div class="pw-track"><span class="pw-fill${up?' up':''}" style="width:${Math.min(lu.pct,100)}%"></span><span class="pw-chance" style="left:${lu.chancePct}%"></span></div>
            <div class="pw-key">${lu.correct} correct in ${lu.tries} tries&nbsp; &middot; &nbsp;the black line is chance${
              lu.best&&lu.best.of?`&nbsp; &middot; &nbsp;best single passage: ${lu.best.correct} of ${lu.best.of}`:''}</div>
            ${lu.best&&lu.best.text?`<p class="pw-quote">&ldquo;${esc(lu.best.text.slice(0,150))}&hellip;&rdquo;</p>`:''}
          </div>
          <p class="pw-none">Longest run of your exact words it wrote back: <b>${r.verbatimWords} word${r.verbatimWords===1?'':'s'}</b>.${
            r.refused?' It refused every attempt to get it to reproduce the piece.':''}</p>
          ${r.facts.length
            ? `<p class="pw-none">It answered ${r.facts.length} question${r.facts.length===1?'':'s'} in a way that needed your piece:</p>`
              + r.facts.map(f=>`<div class="pw-qa"><div class="q">${esc(f.question)}</div>
                 <div class="a">Your piece says: ${esc(f.expected)}</div>
                 <div class="s">It said: ${esc(f.said.slice(0,220))}${f.said.length>220?'&hellip;':''}</div></div>`).join('')
            : `<p class="pw-none">It answered no question in a way that required having read your piece. It got some right, but on facts it could have taken from anywhere.</p>`}
        </div>`;}).join('')}
      </div>`;}).join('')}
  </section>`:''}

  <section><h2>How we searched</h2>
    <div class="how">
      <div class="how-card"><h3>We search by style signatures</h3>
        <p>We build a style profile from example works by the creator of interest. We then search the datasets against the style profile. Where applicable, this is combined with caption search for the creator&rsquo;s name or their signature keywords (e.g., names of characters, collections, etc.).</p></div>
      <div class="how-card"><h3>We test the models directly</h3>
        <p>Beyond the datasets, we probe the AI models themselves. For this, we employ membership inference methods, which test the AI models&rsquo; familiarity with the creator&rsquo;s style and work, allowing us to assign a likelihood for use.</p></div>
      <div class="how-card"><h3>Memorization distinction</h3>
        <p>Finding your work in a training dataset is strong evidence it was used to build these models. It does not by itself prove a model memorized the piece exactly.</p></div>
      ${SPOKEN&&alleged.length?`<div class="how-card"><h3>Why some models are drawn with a dashed outline</h3>
        <p>These companies do not officially publish what they trained on. We therefore use information admitted by the companies themselves in official filings, or presented in a court of law with sufficient evidence. Each dashed model cites the filings and statutes it rests on, numbered in the references below.</p></div>`:''}
    </div>
  </section>`}
  ${PROBE?`<section><h2>How we tested</h2>
    <div class="how">
      <div class="how-card"><h3>Nobody publishes what these models read</h3>
        <p>For images and audio there are public datasets we can search. For writing there is nothing to search: the companies behind these models have never said what text they trained on. So we ask the model instead, and watch how it behaves. That is weaker than a receipt, and we say so.</p></div>
      <div class="how-card"><h3>Can it pick your writing out of a line-up?</h3>
        <p>We show the model your real passage alongside close rewrites of it and ask which is the original. A model that has never read your work is guessing, and guessing scores 25 out of 100. Doing better, repeatedly, is the strongest sign we can get without a dataset. This is the test the grade is based on.</p></div>
      <div class="how-card"><h3>Will it write your words back?</h3>
        <p>We give it the opening of one of your passages and ask it to keep going, and separately we ask it several persuasive ways to reproduce the piece outright. We report the longest run of your exact words it produced. Modern models are trained to refuse the second one, and these did.</p></div>
      <div class="how-card"><h3>Does it know things only your piece says?</h3>
        <p>We ask questions about your work and keep only the answers that name something specific your piece contains. An answer that is true of the subject in general, or that repeats the question back, proves nothing — a model can know who a state's attorney general is without ever having read you. Those are dropped from this report rather than counted.</p></div>
      <div class="how-card"><h3>What this cannot tell you</h3>
        <p>These tests say how likely it is that a model learned from your writing. They are not proof, and a news story reported by many outlets is harder to attribute than a piece only you wrote. Worth reading the findings yourself before drawing any legal conclusion.</p></div>
    </div>

        <span class="rd">The line-up test (DECOP): detecting whether a model has seen a text by asking it to tell the original from paraphrases.</span>
        <a href="https://arxiv.org/abs/2602.05252" target="_blank" rel="noopener">Read the paper</a></span></li>
      <li id="ref-2"><span class="rn">[2]</span><span><span class="rt">Shi et al., 2024</span>
        <span class="rd">Detecting pretraining data from large language models — the basis for the recall and knowledge tests.</span>

// produces the same three assets the web app does. Instagram has no web intent
// for posting on the artist's behalf, so the square and story cards ARE the
// Instagram path: download the image, paste the caption in the app.
const CARD_FONT = "'franklin-gothic-atf', Arial, Helvetica, sans-serif";
const CARD_BRAND = '#E15656';  // the pink sampled from logo.png, not --coral
const FORMATS = [
  {id:'square',label:'Instagram (square)',hint:'Square',width:1080,height:1080},
  {id:'wide',  label:'X / LinkedIn (wide)',hint:'Wide', width:1200,height:675},
  {id:'story', label:'Instagram Story',    hint:'Story',width:1080,height:1920}
];
// Layout parameters in "u" units — 1/1080 of the card width — so all three
// formats stay balanced instead of sharing fixed sizes that only suit one.
const LAYOUTS = {
  square:{chip:300,gapAfterChip:80,headlineFont:44,headlineLH:56,statFont:34,statLH:48,statGap:12,maxStats:3,chipRight:false},
  story: {chip:420,gapAfterChip:100,headlineFont:48,headlineLH:62,statFont:38,statLH:52,statGap:14,maxStats:3,chipRight:false},
  wide:  {chip:230,gapAfterChip:0,  headlineFont:34,headlineLH:44,statFont:25,statLH:34,statGap:10,maxStats:2,chipRight:true}
};
function wrapText(ctx,text,maxWidth){
  const words=String(text).split(' '); const lines=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxWidth&&line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line); return lines;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function renderCard(f,d){
  const L=LAYOUTS[f.id]||LAYOUTS.square;
  const cv=document.createElement('canvas'); cv.width=f.width; cv.height=f.height;
  const ctx=cv.getContext('2d');
  const u=f.width/1080, pad=84*u, footerH=110*u;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,f.width,f.height);
  ctx.fillStyle=CARD_BRAND; ctx.fillRect(0,0,f.width,18*u);

  // Everything in the top row is sized relative to the grade chip, so it reads
  // as one aligned row whether the chip is 230 wide (wide) or 420 (story).
  const chip=L.chip*u, chipX=L.chipRight?f.width-pad-chip:pad;
  ctx.font='700 100px '+CARD_FONT;
  const labelFont=(chip*0.86)/ctx.measureText('My Croquis Score').width*100;
  const brandFont=chip*0.15;
  ctx.font='800 100px '+CARD_FONT;
  const wordW=ctx.measureText('Croquis').width/100*brandFont;
  const logoSz=brandFont*1.32, brandGap=brandFont*0.28;
  const brandW=(d.logo?logoSz+brandGap:0)+wordW;
  const rowY=pad+Math.max(logoSz,labelFont)*0.55;

  ctx.fillStyle='#2D2D2D'; ctx.font='700 '+labelFont+'px '+CARD_FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('My Croquis Score',chipX+chip/2,rowY);

  const brandX=L.chipRight?pad:(f.width-pad-brandW);
  ctx.textAlign='left';
  if(d.logo) ctx.drawImage(d.logo,brandX,rowY-logoSz/2,logoSz,logoSz);
  ctx.fillStyle=CARD_BRAND; ctx.font='800 '+brandFont+'px '+CARD_FONT;
  ctx.fillText('Croquis',brandX+(d.logo?logoSz+brandGap:0),rowY);

  const chipY=rowY+labelFont*0.55+chip*0.04;
  ctx.fillStyle=d.color; roundRect(ctx,chipX,chipY,chip,chip,chip*0.14); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.font='800 '+(chip*0.62)+'px '+CARD_FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(d.grade,chipX+chip/2,chipY+chip*0.54);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  const textX=pad;
  const textW=L.chipRight?(chipX-pad-50*u):(f.width-pad*2);
  let ty=L.chipRight?rowY+logoSz/2+74*u:chipY+chip+L.gapAfterChip*u;
  ctx.fillStyle='#2D2D2D'; ctx.font='700 '+(L.headlineFont*u)+'px '+CARD_FONT;
  for(const line of wrapText(ctx,d.headline,textW)){ ctx.fillText(line,textX,ty); ty+=L.headlineLH*u; }

  ty+=24*u; ctx.font='400 '+(L.statFont*u)+'px '+CARD_FONT;
  for(const stat of d.stats.slice(0,L.maxStats)){
    ctx.fillStyle=CARD_BRAND; ctx.beginPath(); ctx.arc(textX+8*u,ty-10*u,7*u,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555555';
    for(const line of wrapText(ctx,stat,textW-40*u)){ ctx.fillText(line,textX+36*u,ty); ty+=L.statLH*u; }
    ty+=L.statGap*u;
  }

  ctx.fillStyle='#FAFAFA'; ctx.fillRect(0,f.height-footerH,f.width,footerH);
  ctx.fillStyle=CARD_BRAND; ctx.font='700 '+(30*u)+'px '+CARD_FONT;
  ctx.fillText(d.url,pad,f.height-42*u);
  return cv.toDataURL('image/png');
}

const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('fmtRow').addEventListener('click',e=>{
  const b=e.target.closest('.fmt'); if(b) showCard(b.dataset.fmt);
});
document.getElementById('dlCard').addEventListener('click',()=>downloadCard(curFmt));
// Instagram accepts no web share intent, so the button does the two things the
// artist would otherwise do by hand: save the square (or story) card and put
// the caption on the clipboard, ready to paste into the app.
document.getElementById('igBtn').addEventListener('click',async e=>{
  const id = curFmt==='story' ? 'story' : 'square';
  showCard(id); downloadCard(id);
  const btn=e.currentTarget;
  try{ await navigator.clipboard.writeText(shareText); btn.textContent='Saved — caption copied'; }
  catch{ btn.textContent='Image saved'; }
  setTimeout(()=>{ btn.innerHTML='<span class="ig">'+IG_ICON+'Instagram</span>'; },2600);
});
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
</script>
