  if(n>=1e6) return '~'+(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1e3) return '~'+(n/1e3).toFixed(0)+'K';
  return ''+n;
}
// fmt() already prefixes "~" for rounded values, so callers must not add their own.
// A dataset scanned exhaustively (every shard) reports an exact count -- show it in
// full rather than rounding it and implying an estimate.
function mentions(d){
  const n = d.mentionsFound||d.count||0;
  if(!n) return 'Nothing found';
  return (d.exact ? n.toLocaleString('en-US') : fmt(n)) + ' mention' + (n===1?'':'s');
}

const _probeScores = (((R.imageInference||{}).works||[]).flatMap(w=>w.modelResults||[]))

  .map(m=>m.score||0);

// Badges here state *findings*, so only a positive memorization signal earns one.
// A "no clear memorization" badge derived from the mean also contradicted itself:
// the mean can sit below 0.50 while an individual model still reads MODERATE in
// the section below, so the hero was denying what the page then showed.
const MEMO = mia==null ? null
  : mia>=0.60 ? {t:'Memorization detected',line:'There is meaningful evidence that AI models have found and memorized parts of your work.',c:'#D14A3A',positive:true}
  : mia>=0.50 ? {t:'Early signs of memorization',line:'There is some evidence that AI models have begun to memorize your work.',c:'#E8622C',positive:true}
  : {t:'No clear memorization',line:'We found no clear evidence that AI models have memorized your work.',c:'#2E9E5B',positive:false};

for(const inf of [R.imageInference,R.audioInference,R.writingInference]){
  for(const w of (inf&&inf.works)||[]) for(const m of w.modelResults||[])
    if(m.riskLevel==='HIGH'||m.riskLevel==='MODERATE') flagged.add(m.model||m.imageModel);
}
const modelCount = (R.models||[]).length + flagged.size;
const noun = R.modality==='music'||R.modality==='podcast_radio' ? 'recordings'

const cor = s => '<span style="color:var(--coral)">'+s+'</span>';
// Big plain-language summary + a detailed line beneath it (numbers highlighted).
// The overall message unifies TWO signals: whether the work was found in

const memStrong = mia!=null && mia>=0.60, memSome = mia!=null && mia>=0.50;
let summary, detail;

} else if (present===0 && memSome) {

    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}
  <div class="next"><h2>What&rsquo;s next</h2><div class="steps">
    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p><p style="margin-top:10px"><button class="btn btn-primary" id="shareBtn">Get assets</button></p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

  <section><h2>How we searched</h2>
    <div class="how">
      <div class="how-card"><h3>We search by style signatures</h3>
        <p>We build a style profile from example works by the creator of interest. We then search the datasets against the style profile. Where applicable, this is combined with caption search for the creator&rsquo;s name or their signature keywords (e.g., names of characters, collections, etc.).</p></div>
      <div class="how-card"><h3>We test the models directly</h3>
        <p>Beyond the datasets, we probe the AI models themselves. For this, we employ membership inference methods, which test the AI models&rsquo; familiarity with the creator&rsquo;s style and work, allowing us to assign a likelihood for use.</p></div>
      <div class="how-card"><h3>Memorization distinction</h3>
        <p>Finding your work in a training dataset is strong evidence it was used to build these models. It does not by itself prove a model memorized the piece exactly.</p></div>
    </div>
  </section>
`;

// ── Share modal ─────────────────────────────────────────────────────────────
const shareText = (present>0
  ? `My work was found in ${present} major AI training dataset${present===1?'':'s'}` +
    (S.totalMentions ? ` — ${fmt(S.totalMentions)} mentions` : '') + '.'
  : 'I checked whether my work is in the datasets used to train AI image models.')
  + ' Check yours at croquis.sfai.agency';
const shareUrl = 'https://croquis.sfai.agency';
document.body.insertAdjacentHTML('beforeend', `
  <div class="modal" id="shareModal">
    <div class="modal-card">
      <button class="modal-close" id="shareClose" aria-label="Close">&times;</button>
      <h2>Share your report</h2>
      <p class="sub">The more artists know this is happening, the harder it is to ignore.</p>
      <div class="caption-box" id="shareCaption">${esc(shareText)}</div>
      <div class="share-row">
        <button class="btn btn-primary" id="copyCaption">Copy caption</button>
        <a class="btn" target="_blank" rel="noopener"
           href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}">Post on X</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}">LinkedIn</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}">Facebook</a>
      </div>
      <p class="sub" style="margin:0">Nothing is uploaded — the text is composed here in your browser.</p>
    </div>
  </div>`);
const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
</script>
