  .modal-card h2 { margin:0 0 6px; font-size:22px; }
  .modal-card p.sub { color:var(--gray); font-size:14px; margin:0 0 18px; }
  .modal-close { position:absolute; top:14px; right:18px; border:0; background:none;
                 font-size:26px; line-height:1; color:var(--gray); cursor:pointer; }
  .share-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .btn { font:inherit; font-size:14px; font-weight:700; border-radius:24px;

    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

  <section><h2>How we searched</h2>
    <div class="how">
      <div class="how-card"><h3>We search by style, not just by name</h3>
        <p>We build a style profile from example works by ${esc(R.artistName||'the artist')} and search the datasets with it. This is the main method: it finds work whether or not anyone labelled it with a name.</p></div>
      <div class="how-card"><h3>We combine that with names and titles</h3>
        <p>Every image in these datasets carries a caption. We read those for ${esc(R.artistName||'the artist')} and the names of their characters and strips, and use it alongside the style search rather than in place of it.</p></div>
      <div class="how-card"><h3>We test the models directly</h3>
        <p>Beyond the datasets, we probe the AI models themselves with membership inference &mdash; measuring how they respond to specific works to see whether the model already knows them. Where that has run, the results are in &ldquo;Evidence from models&rdquo; above.</p></div>
      <div class="how-card"><h3>We searched every file, not a sample</h3>
        <p>${(R.datasets||[]).filter(d=>d.coverageComplete).length} of the datasets were read in full &mdash; every one of their ${((R.datasets||[]).reduce((a,d)=>a+(d.coverageComplete?(d.rowsCovered||0):0),0)/1e9).toFixed(1)} billion rows. So these counts are exact, not estimates.</p></div>
      <div class="how-card"><h3>We only show your actual work</h3>
        <p>A caption mentioning a name pulls back merchandise, news photos and fan art too. Those are counted but kept out of the examples above, so what you see is the work itself.</p></div>

// produces the same three assets the web app does. Instagram has no web intent
// for posting on the artist's behalf, so the square and story cards ARE the
// Instagram path: download the image, paste the caption in the app.
const CARD_FONT = "'franklin-gothic-atf', Arial, Helvetica, sans-serif";
const CARD_BRAND = '#E15656';  // the pink sampled from logo.png, not --coral
const FORMATS = [
  {id:'square',label:'Instagram (square)',hint:'Square',width:1080,height:1080},
  {id:'wide',  label:'X / LinkedIn (wide)',hint:'Wide', width:1200,height:675},
  {id:'story', label:'Instagram Story',    hint:'Story',width:1080,height:1920}
];
// Layout parameters in "u" units — 1/1080 of the card width — so all three
// formats stay balanced instead of sharing fixed sizes that only suit one.
const LAYOUTS = {
  square:{chip:300,gapAfterChip:80,headlineFont:44,headlineLH:56,statFont:34,statLH:48,statGap:12,maxStats:3,chipRight:false},
  story: {chip:420,gapAfterChip:100,headlineFont:48,headlineLH:62,statFont:38,statLH:52,statGap:14,maxStats:3,chipRight:false},
  wide:  {chip:230,gapAfterChip:0,  headlineFont:34,headlineLH:44,statFont:25,statLH:34,statGap:10,maxStats:2,chipRight:true}
};
function wrapText(ctx,text,maxWidth){
  const words=String(text).split(' '); const lines=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxWidth&&line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line); return lines;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function renderCard(f,d){
  const L=LAYOUTS[f.id]||LAYOUTS.square;
  const cv=document.createElement('canvas'); cv.width=f.width; cv.height=f.height;
  const ctx=cv.getContext('2d');
  const u=f.width/1080, pad=84*u, footerH=110*u;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,f.width,f.height);
  ctx.fillStyle=CARD_BRAND; ctx.fillRect(0,0,f.width,18*u);

  // Everything in the top row is sized relative to the grade chip, so it reads
  // as one aligned row whether the chip is 230 wide (wide) or 420 (story).
  const chip=L.chip*u, chipX=L.chipRight?f.width-pad-chip:pad;
  ctx.font='700 100px '+CARD_FONT;
  const labelFont=(chip*0.86)/ctx.measureText('My Croquis Score').width*100;
  const brandFont=chip*0.15;
  ctx.font='800 100px '+CARD_FONT;
  const wordW=ctx.measureText('Croquis').width/100*brandFont;
  const logoSz=brandFont*1.32, brandGap=brandFont*0.28;
  const brandW=(d.logo?logoSz+brandGap:0)+wordW;
  const rowY=pad+Math.max(logoSz,labelFont)*0.55;

  ctx.fillStyle='#2D2D2D'; ctx.font='700 '+labelFont+'px '+CARD_FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('My Croquis Score',chipX+chip/2,rowY);

  const brandX=L.chipRight?pad:(f.width-pad-brandW);
  ctx.textAlign='left';
  if(d.logo) ctx.drawImage(d.logo,brandX,rowY-logoSz/2,logoSz,logoSz);
  ctx.fillStyle=CARD_BRAND; ctx.font='800 '+brandFont+'px '+CARD_FONT;
  ctx.fillText('Croquis',brandX+(d.logo?logoSz+brandGap:0),rowY);

  const chipY=rowY+labelFont*0.55+chip*0.04;
  ctx.fillStyle=d.color; roundRect(ctx,chipX,chipY,chip,chip,chip*0.14); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.font='800 '+(chip*0.62)+'px '+CARD_FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(d.grade,chipX+chip/2,chipY+chip*0.54);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  const textX=pad;
  const textW=L.chipRight?(chipX-pad-50*u):(f.width-pad*2);
  let ty=L.chipRight?rowY+logoSz/2+74*u:chipY+chip+L.gapAfterChip*u;
  ctx.fillStyle='#2D2D2D'; ctx.font='700 '+(L.headlineFont*u)+'px '+CARD_FONT;
  for(const line of wrapText(ctx,d.headline,textW)){ ctx.fillText(line,textX,ty); ty+=L.headlineLH*u; }

  ty+=24*u; ctx.font='400 '+(L.statFont*u)+'px '+CARD_FONT;
  for(const stat of d.stats.slice(0,L.maxStats)){
    ctx.fillStyle=CARD_BRAND; ctx.beginPath(); ctx.arc(textX+8*u,ty-10*u,7*u,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555555';
    for(const line of wrapText(ctx,stat,textW-40*u)){ ctx.fillText(line,textX+36*u,ty); ty+=L.statLH*u; }
    ty+=L.statGap*u;
  }

  ctx.fillStyle='#FAFAFA'; ctx.fillRect(0,f.height-footerH,f.width,footerH);
  ctx.fillStyle=CARD_BRAND; ctx.font='700 '+(30*u)+'px '+CARD_FONT;
  ctx.fillText(d.url,pad,f.height-42*u);
  return cv.toDataURL('image/png');
}

const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('fmtRow').addEventListener('click',e=>{
  const b=e.target.closest('.fmt'); if(b) showCard(b.dataset.fmt);
});
document.getElementById('dlCard').addEventListener('click',()=>downloadCard(curFmt));
// Instagram accepts no web share intent, so the button does the two things the
// artist would otherwise do by hand: save the square (or story) card and put
// the caption on the clipboard, ready to paste into the app.
document.getElementById('igBtn').addEventListener('click',async e=>{
  const id = curFmt==='story' ? 'story' : 'square';
  showCard(id); downloadCard(id);
  const btn=e.currentTarget;
  try{ await navigator.clipboard.writeText(shareText); btn.textContent='Saved — caption copied'; }
  catch{ btn.textContent='Image saved'; }
  setTimeout(()=>{ btn.innerHTML='<span class="ig">'+IG_ICON+'Instagram</span>'; },2600);
});
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
</script>
