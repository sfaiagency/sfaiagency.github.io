"", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Funky Winklebean - One of a Kind Disney Cartoon Character\n\nThe Funky Winkerbean, also known as simply the Winkerbean, is an American cartoon character that was created by Bill Finger and Steve Ditchendorf in Marvel Comics' popular comic book series, The Fantastic Four. The character was first introd", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Today! The latest installment of the Funkyverse\u2019s most exciting new game show, brought to you by Crankshaft!\n\nEND_OF_DOCUMENT_TOKEN_TO_BE_REPLACED\n\nA Stroke of Luck\n\nThis Sunday strip is, I guess, supposed to be ironic. Jessica still doesn\u2019t know the kind of man her father really was. Although Jess ", "imageUrl": null, "keyword": "john darling", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Lisa's Story: The Other Shoe\n\nA story from the comic strips that will make you laugh and cry. Originally a \u201cgag-a-day\u201d comic strip that portrayed life in high school, Funky Winkerbean evolved into a mature series of real-life stories. In 1999, Lisa Moore, one of Funky\u2019s friends and a main character,", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "As a child, Pogo\n\nwas one of those comic strips that looked really funny but was hard for me to figure out. Sort of like Funky Winkerbean. But, then again, how could an 8-year old appreciate the social and politic satire of Walt Kelly?\n\nKelly is an under-appreciated part of American cultural history", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Unfortunately, the same can't be said of our friend from the newspaper comic strips, Funky Winkerbean. This was originally meant to be the centerpiece of the parade -- because really, if there's one thing that we can all be thankful for, it's that we're not Funky Winkerbean -- but as it turns out, i", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "That's why today, I've rounded up another month's worth of absolute sorrow in handy comic strip form to bring you April's Most Depressing Funky Winkerbean strips! And this was a good one, featuring the deadly potential of technology, the deaths of cast members both old and new, and even a guest appe", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A tip of the SoSF turban to Comic Book Harriet, who never fails to spin enlightening and entertaining gold from Tom Batiuk\u2019s dreary dross.", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In the late summer of 1973, I was living in an apartment in Elyria, Ohio and was hard at work on my one year old comic strip Funky Winkerbean. Along with Funky, I was still creating my comic panel Rapping Around for the Tuesday Teen Page in my local paper the Chronicle-Telegram. I had been doing Rap", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Band of seniors at the Bedside Manor retirement home, from the comic strip Funky Winkerbean.\n\nThey are led by former Westview High school band fuhrer, Harry L. Dinkle. He seems to have mellowed somewhat, but he still makes the seniors go out and sell candy as a fundraiser. They first appeared in Dec", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "How Funky Winkerbean Changed My Life\n\nFirst, let me assure you that not all of my Life Philosophies are derived from the Sunday comics.\n\nThat being said, I admit that Funky Winkerbean changed my life.\n\nDo you remember hapless Les back in the 70s?  (By the way, I\u2019ve never really understood the word \u2018", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "COURTESY OF SUSAN CASHTom Batiuk, creator of the \"Funky Winkerbean\" comic strip, will be at Ground Zero Comics and Cards at 10 a.m. May 5 for a book signing and Free Comic Book Day.\n\nIn 1972, a junior high English teacher in Elyria, Ohio set out to begin his career as a newspaper cartoonist.\n\nBatiuk", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Since its newspaper debut in 1972, the comic strip Funky Winkerbean has chronicled the journey through life of a group of students from the fictitious West View High School. This twelfth volume presents strips from 2005, 2006, and 2007.\n\nMixing humor with serious, real-life issues, this volume of Th", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The world of \u201cFunky Winkerbean\u201d has matured along with its creator, Tom Batiuk. This 1998 strip highlights a midpoint in the comic\u2019s 50-year evolution. ( Tom Batiuk/KFS)\n\nDuring Batiuk\u2019s first stop, an editor handed him a book of his syndicate\u2019s recently launched \u201cDoonesbury\u201d to peruse. A subsequent", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\u201cFunky Winkerbean\u201d depicts a poignant moment in the relationship of Les and Lisa Moore in 2007 \u2014 the year Lisa would die from breast cancer. (Tom Batiuk/KFS)\n\nShortly after Lisa\u2019s death, Batiuk decided to reboot \u201cFunky\u201d again because he didn\u2019t want to dwell on Les\u2019s mourning. The strip jumped ahead ", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Roger Bollen was the writer and illustrator of the \"Animal Crackers\" syndicated comic strip, artist of dozens of children's books and producer of television shows.\n\nBollen, who lived in Chagrin Falls, was a prolific creator who started out in newspaper comics strips and went on to illustrate more th", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "This fruit-flavored breakfast cereal produced by Ralston Cereals in 1988 was based on the assortment of newspaper comic strips featured on the box.Some of the characters that appeared in the Morning Funnies were Dennis the Menace, the Family Circus family, ious miseries of its characters. In last month's strips, a joke about the announcement of DC's relau", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I\u2019ve been writing for the \u201cfunnies\u201d - newspaper comic strips - for a few years now, assisting several different clients with scripts, plots and gags. It\u2019s challenging, enjoyable work and I think I\u2019ve gotten pretty good at it. However, every morning, I read a week\u2019s worth of Bill Watterson\u2019s The Comp", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Unlike CA Senior Writer Chris Sims, who steadfastly scours the funny pages each month for his Funky Winkerbean/Crankshaft chronicle, Funkywatch (to say nothing of his inspiration, Josh Fruhlinger at the daily Comics Curmudgeon blog), there's a good chance you don't indulge in traditional comic strip", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Some more Year of the Dragon fun...Dragons in Literature. Take the quiz here\n# # # #\n\nI know this subject has been done to death in the last few weeks, but this cartoon by Tom Batiuk in the Denver Post seems to sum up the feeling of those who think if it's on the Internet, it's free. I'll be followi", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\"Crankshaft\", created by Tom Batiuk and drawn by Dan Davis, first launched in 1987 and follows namesake character u\u2019re reading these words on a website called \u201cThe Comics Curmudgeon,\u201d a number of things that irritate me about the comic strip Blondie, and one of them is that we have been repeatedly told that Dagwood\u2019s job title is \u201coffice manager,\u201d despite the fact that he", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "You know who else is having a dismal season?  A comic strip called Funky Winkerbean.  Of course, this is the normal state of this strip, so this isn\u2019t news to anyone.\n\nToday\u2019s strip illustrates\u2013or rather, doesn\u2019t illustrate\u2013one of the many problems this strip parades like virtues: people talking abo", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "BY TOM BATIUK AND DAN DAVIS\nClick image to rotate through samples.\n\nHumor. Drama. Real-life stories. In his popular comic strip Crankshaft, cartoonist Tom Batiuk has created a cast of characters so real that fans are compelled to follow their adventures.\n\nA former minor league baseball pitcher, the ", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "CLEVELAND, Ohio \u2013 Comic strips tend to fall in one of two areas these days: They go for the rarely-subtle yuk-yuk laughs or one-liners, or they pull on heartstrings in serious story lines.\n\n\u201cCrankshaft,\u201d created and drawn by Tom Batiuk and illustrated by Chuck Ayers, does both.\n\nBlack Squirrel Books", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Doonesbury! The only comic strip my father loved and that I ever read as a child (stiill living at home, that is).\n\nHowever, I have to wonder if Donald Trump has ever commented on Garry Trudeau using \u201cThe NY snob\u201d in his comic strip. There is a book out there, but I haven\u2019t bought it yet.\n\nOh my gos", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Tom Batiuk talks about Crankshaft, featured in \u2018Strike Four,\u2019 a baseball compilation of the comic strip\n\nby Marc Bona, The Plain Dealer", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "MARY WORTH\u2019S ADVICE\u2014Since the 1930s, Mary Worth has been sharing her sage advice on newspaper comic pages. In recent years, she has tackled every social ill from drug abuse to teen pregnancy. At ReadTheSpirit, we thank Mary Worth for contributing a comic strip to this new book\u2014and now for quickly te", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Prelude is a collection of the early comic strips that bring Lisa and Les together. Introduced to readers of Funky Winkerbean in late 1984 as she experiences SAT test anxiety, Lisa becomes Les Moore\u2019s best friend and a pivotal character. Les and Lisa go to the prom, begin steady dating, and then bre", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "2 edition of crankshaft found in the catalog.\n\ndesigning for structural strength and fatigue resistance : a modern guide for designers of reciprocating machinery\n\nCrankshaft is a comic strip about a character by the same name \u2014 an elderly, curmudgeonly school bus driver \u2014which debuted on June 8, Wri", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In late 1988, Ralston took on its most ambitious licensed-cereal. Partnering with King Features Syndicate, they brought several of the comic strips they represented to breakfast with Morning Funnies.\n\nThe cereal\u2019s name came from the term \u201cthe funny papers,\u201d which was often shortened to \u201cthe funnies,", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "That's why today, I've rounded up another month's worth of absolute sorrow in handy comic strip form to bring you May's Most Depressing installments of Funky Winkerbean and its spin-off, Crankshaft! It's a pretty momentous occasion for me, too -- not just because of Les's growing insanity and the am", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "For more pictures and screenshots of John Darling, click here.", "imageUrl": null, "keyword": "john darling", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Time and again, I promise myself that I will not allow Tom Batiuk to send me down the Google hole. Usually I\u2019m compelled to search for context for a reference he\u2019s made to some obscure (to me) silver age comic book. Sometimes I\u2019ll search Grandpa Google for a particularly odd or stilted expression ut", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "guest review by Kevin Wolf\nTwo books , Safe Return Home: An Inspirational Book for Caregivers of Alzheimer\u2019s (Andrews McMeel publisher 1998) and Roses in December: a story of love and Alzheimer\u2019s (The Kent State University Press 2015) by Tom Batiuk and Chuck Ayers are the early and complete collecti", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Richard Willis replied to Wandering Sensei: Moderator Man's discussion What Comic Books Have You Read Today?\n\"Lee Houston, Junior said: In case you're unaware of this, the Funky Winkerbean strip\u2026\"\n57 minutes ago\n\nRichard Willis replied to Peter Wrexham's discussion Celebrity Mastermind - \"The Histor", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Over the past 40 years, Tom Batiuk\u2019s Funky Winkerbean has transitioned from a gag-a-day comic strip about a high school to an ongoing chronicle of pure, abject misery. Thanks to the ongoing commentary on Josh Fruhlinger\u2019s Comics Curmudgeon, I am now completely obsessed with it, which is why I spend ", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "All of this and much more of Funky\u2019s early beginnings can be found in The Complete Funky Winkerbean Vol. 1\n\nDecember 15, 2009\nAs I noted in an earlier blog or two, I've been periodically doing tributes to some of my favorite comic books and ...\nRead More\n\nRipples in the Summer\n\nSeptember 10, 2020\nA ", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I took that work to the newspaper syndicates, and on March 27th, 1972 Funky Winkerbean first appeared on the comics page.", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Tom Batiuk, the award-winning cartoonist who has been writing and drawing the syndicated comic strip, Funky Winkerbean, for over 50 years, has announced that the beloved strip will be coming to a close at the end of this year as a daily comic, but will still continue on his personal website, tombati", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Tom Batiuk (rhymes with \u201cattic\u201d) spent several years as a high school teacher before creating Funky Winkerbean, the celebrated comic strip distributed by King Features Syndicate to more than 400 newspapers nationwide. Batiuk has been recognized for his bold yet sensitive approach to real-life issues", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Moore I See, the Les I Know\n\nY. Knott\nOctober 14, 2022 at 11:19 pm\nSomeone\u2026could cobble together a pretty good Sunday strip using the strips of just the 10th, 13th and 15th. Just put \u2019em together in that order, and you\u2019ve actually got something.\n\nSwitching from spectacles to a monocle actually w", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Building their own EcoNest\n\nBy Story By John Darling Photos by Jamie Lusch", "imageUrl": null, "keyword": "john darling", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\nMorning Funnies Ceral was produced by Ralston Cereals in 1988 & 1989. It was a super sweet cereal, bright in color and shaped like smiley faces.\n\nThe taste and shape wasn't the hook for this cereal though.....the box was. The box featured comic strips on the front and back panels. In addition, the ", "imageUrl": null, "keyword": "funky winkerbean", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Things I Like Dept:  Pete\u2019s face in panel one is perfect.  \u201cWhat?  Are you still talking?  I\u2019m trying to read, pal.\u201d  This is probably the only time I\u2019ve liked Pete at all.\n\nAnd look at Chester, too\u2013happily enjoying ice cream while reading a comic book.  First of all, the book isn\u2019t sealed away, as ", "imageUrl": null, "keyword": "tom batiuk", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Last Fall I gave a talk at Baldwin Wallace University at the invitation of Dr. Michael Dolzani who taught a graphic novel course where they read Lisa\u2019s Story. Dr. Dolzani recently shared with me some of the essays that were written in regard to Lisa\u2019s Story, and
