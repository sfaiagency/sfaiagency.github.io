IS NOSE by Lynn Johnston", "Graduation by Lynn Johnston", "Laugh 'N' Learn Spanish by Lynn Johnston & Brenda Wegmann"], "partial": false, "shardsScanned": 128, "shardsTotal": 128}, {"datasetName": "OBELICS", "hfPath": "HuggingFaceM4/OBELICS", "apiPath": "HuggingFaceM4/OBELICS", "datasetKey": "obelics", "modality": "image", "found": true, "count": 596, "mentionsFound": 596, "exact": true, "coverageComplete": true, "rowsCovered": 141047704, "coverageNote": "", "highConfidenceCount": 26, "nameMatchCount": 570, "thirdPartyCount": 0, "lowConfidenceCount": 38751, "totalIncludingLowConfidence": 39347, "rows": [{"text": "The Genie Award-winning documentary Comic Book Confidential (1988)\u2014researched in part in the extensive comic book collection of bpNichol, Canada\u2019s first alternative comic writer (Bell 143)\u2014offered a broad introduction to American comic books for many, drawing attention to the rich variety of express", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Julie Doucet, a veteran comic book artist from Montreal, wasn't surprised in the least by what transpired with the Grand Prix D'Angoul\u00eame. To her, it has always been a mainstream, commercial, conservative event. But she also says it's not fair to make wide-ranging judgments based on what's happening", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Known for his ground-breaking comic strip \"Doc and Raider,\" long-time Poser creator Sean Martin (a.k.a., SeanMartin on Renderosity) used his skills to document gay life during the AIDS epidemic.\n\nMartin died in early August from complications of pancreatic cancer. He was 69.\n\nBased on his relationsh", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "United Media was a large editorial column and comic strip newspaper syndication service based in the United States, owned by the E. W. Scripps Company, that operated from 1978 to 2011. It syndicated 150 comics and editorial columns worldwide. Its core businesses were the United Feature Syndicate and", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It seems as though more than half of our time as parents of young kids is spent either apologizing for their antics or cleaning up the resulting debris. Plus there's a lot of yelling, in spite of your best intentions and everything modern parenting gurus preach.\n\nWright's classic comic strip, Nipper", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Elly Paterson is the main female character in the comic strip, For Better or For Worse by Lynn Johnston. Her chain-smoking brother, Phil, is being pressured to quit smoking but isn\u2019t finding it easy. Finally he\u2019s down to his last cigarette before facing a smoke-free future, as illustrated in the Fri", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Kevin Frank is an award-winning author/illustrator who has been creating books, cartoons and illustrations for over 20 years. He wrote and illustrated a middle-grade graphic novel called SCURVY DOGS which was published by Kane Miller in 2016, and the sequel SCURVY DOGS AND THE DINOSAUR BONEYARD was ", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I\u2019ve always loved the \u201cfunny pages.\u201d We called them the \u201cfunnies,\u201d as in, \u201cPass the funnies.\u201d But my life, as the only child of two working parents, wasn\u2019t one I saw in the Sunday comics, where big families, sibling battles and giant sandwiches seemed to be the norm.\n\nEventually \u201cSally Forth\u201d came a", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Filed under Poems, Essays, and Things\n\nWalking Around the House (NaPoWriMo #20)\n\nThe dilemnas of being woman of the house from the comic \"For Better or for Worse\" by Lynn Johnston. Sourced by Yahoo!News\n\nOh these breakfast plate piles seem higher each day.\nAt least the sun is out though.\nFirst, into", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\u00e2\u20ac\u0153My other favourite comic strip is For Better or For Worse by Lynn Johnston. It\u00e2\u20ac\u2122s very unique because the characters all age in real time, so every year as they got older it was like I was growing up with these people. I did not consider them characters, they were real to me.\u00e2\u20ac\u009d\n\nWhile most youn", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "For Better or for Worse Vol. 1\n\nCollecting one of the most beloved comic strips of all time, with a devoted audience of more than 220 million. This new series, produced with Lynn Johnston's cooperation, is the definitive edition, collecting each decade of the strip in three volumes. Since For Better", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Used to be that a kid who \u201cdidn\u2019t like to read\u201d could be found perusing the newspaper every Sunday for the colored comic pages come rain or shine.  Now thanks to a host of different factors the comics page is no longer the go to place for kids to get their comic fixes.  That honor now belongs to the", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "From Benjamin Franklin's drawing of the 1st American political caricature in 1754 to modern cartoonists' blistering assaults on George W. Bush and preliminary love-affair with Barack Obama, editorial cartoons were part of American journalism and politics. American Political Cartoons chronicles the n", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "My good friend Dave Kellett has been working for the last four years on a labor of love: a feature-length documentary film about the art and practice of comic strips.\n\nStripped features dozens and dozens of interviews with cartoonists like Bill Amend (FoxTrot), Stephan Pastis (Pearls Before Swine), ", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "With the cartoon landscape of the 1980s showing housewives mostly in the mold of Blondie and Hi and Lois, Sally Forth would become part of a new generation of comic strips (along with Lynn Johnston\u2019s For Better or For Worse and Cathy Guisewite\u2019s, Cathy) that showed woman taking center stage in a mor", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Is this the beginning of the end for the comic book page printed daily in many American cities?\n\nSome cartoonists and readers fear such a trend as Lee Enterprises, an Iowa-based media company that owns nearly 80 daily newspapers, shifts to a \u201cone-size-fits-all set of offerings\u201d with its comic strips", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "There Goes My Baby\n\nby Lynn Johnston, There Goes My Baby Books available in Docs, PDF, EPUB, Mobi, Textbook, Kindle Format. Download There Goes My Baby book, This collection includes the cartoon's trademarks--the foibles of teenagers, terrors of tots, and trials of marriage--and also features hilari", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "FOR BETTER OR FOR WORSE newspaper comic strip collected\n\nBy pghhead - October 31, 2017\nCollect the Entire Run Chronologically Beginning with Volume One\n\nSan Diego, CA (October 31, 2017) \u2013 One of the most beloved comic strips of all time, this new collection of For Better or For Worse, produced with ", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In the years following 1975, a group of female-created comic strips came to national attention in a traditionally male-dominated medium. Typical Girls: The Rhetoric of Womanhood in Comic Strips uncovers the understudied and developing history of these strips, defining and exploring the ramifications", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "We have some very exciting news to share, courtesy of IDW Publishing and the Library of American Comics:\n\nWelcome back, Elly, John, and the entire Patterson family as IDW Publishing and the Library of American Comics proudly announce For Better or For Worse: The Complete Library by Lynn Johnston. Th", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Okay, I can\u2019t really claim to be a regular comic strip reader. But I recently became aware of exciting new developments in Lynn Johnston\u2019s For Better or For Worse (question for all you Strunk and White nerds \u2013 is the name of a comic strip italicized?). I feel like Ms. Johnston, without even meaning ", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "How to Write Kick-Ass Scenes by Lynn Johnston is a fantastic resource for fiction authors. Lynn has already been one of my favorite fiction teachers for quite some time now, and this latest workshop of hers covers one of the most crucial aspects of fiction writing: making sure your scenes aren\u2019t bor", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Who Are You, Charlie Brown? the documentary special on the American cartoonist Charles M Schulz is set to premiere on Apple TV+ on June 25, the streaming platform announced on Friday while releasing the trailer.\n\nSchulz, who created the popular comic strip Peanuts featuring the character Charlie Bro", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Back outside, we see (from left to right) Toronto, Skullturf Q. Beavispants, and Mooncattie posing bravely by Lynn Johnston\u2019s \u201cStar\u201d.", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Yellow Kid was the name of a lead American comic strip character that ran from 1895 to 1898 in Joseph Pulitzer's New York World, and later William Randolph Hearst's New York Journal. Created and drawn by Richard F. Outcault in the comic strip Hogan's Alley, it was one of the first Sunday supplem", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A For Better or For Worse Retrospective\n\nLast month I went mostly cold turkey on reading websites that sell the news and instead decided to embark upon a re-reading of the entire 29-year run of For Better or For Worse, a comic strip that I've previously written about. Aside from a single week-long g", "imageUrl": null, "keyword": "lynn johnston", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": t
