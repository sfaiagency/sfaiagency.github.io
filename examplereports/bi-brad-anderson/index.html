tion into this highly-addictive \u201cstrip\u201d and its creator. Preliminary studies shows that consumption of", "imageUrl": null}, {"text": "Also released this week, poorly reviewed family movie \u201cMarmaduke\u201d took advantage of the dearth of competition in the kiddie genre to slide into the number two spot on the sale\u2019s chart. Based on a long running comic strip, the talking dog film was the fourth most rented disc last week.\n\nWith the fall", "imageUrl": null}, {"text": "Published by Southdown Press Pty. Ltd. (of West Melbourne, Victoria, Australia), my copy of Special No. 4 isn\u2019t in the best shape \u2014 it\u2019s pretty brittle. I\u2019m not familiar with comic book grading scales, and this one might not fare so well. If it was an LP record it would be a cutout, with its corner ", "imageUrl": null}, {"text": "United Media was a large editorial column and comic strip newspaper syndication service based in the United States, owned by the E. W. Scripps Company, that operated from 1978 to 2011. It syndicated 150 comics and editorial columns worldwide. Its core businesses were the United Feature Syndicate and", "imageUrl": null}, {"text": "When I was a kid, the comics page was my entry point into being a newspaper reader. There was a mini-renaissance going on thanks to The Far Side, Calvin & Hobbes and Bloom County. Plus, Garfield was still in its first decade of lasagna-loving and Monday-hating.\n\nI loved checking out the comics page ", "imageUrl": null}, {"text": "COLUMBUS, Ohio \u2014 In a 1970 Beetle Bailey comic strip, the character known as Sarge berates his uniform-wearing dog, Otto, for a paperwork mistake.\n\n\u201cWe can\u2019t all be Snoopy,\u201d a dejected Otto replies.\n\nThis confluence of two iconic comic strip dogs is on exhibit along with dozens of other images at th", "imageUrl": null}, {"text": "A new exhibit on dogs in cartoons and comic strips includes vinyl toys of Charlie Brown and Snoopy and Dennis the Menace and Ruff, from the private collection of exhibit curator Brian Walker, in a photo taken June 24 in Columbus, Ohio. The genesis for the exhibit, which runs through October, came wh", "imageUrl": null}, {"text": "Now, Marmaduke is no Dark Knight, but let\u2019s be real, filmmaker Tom Dey (Failure to Launch, Shanghai Noon) is making an entirely different film. Given the track record of comic strips to film, (Garfield anyone?) Marmaduke hits a home run. Marmaduke will delight the kids while simultaneously entertain", "imageUrl": null}, {"text": "Marmaduke is the perfect family comedy and considering it is based on the legendary comic strip, that fact should not be surprising. Yet, it is, because so many efforts to bring comics, whether graphic novels or comic strips, to the big screen are frankly terrible.", "imageUrl": null}, {"text": "\u201cBig Moose\u201d is a new comic book \u201cone-shot\u201d spin off from United States publisher Archie Comics\u2019 line of teen-targeted comedy series. It features the ancillary character Marmaduke \u201cMoose\u201d Mason, who is characterized as the best athlete in Archie Comics\u2019 fictional Riverdale High School but also its po", "imageUrl": null}, {"text": "Part ode to the comics of yesteryear and fascination with really big comics, Golden Bell Presents: The Sunday Comics! The Sunday Comics is not your typical newspaper, rather, a new, innovative way to read and enjoy comics. Every issue's packed with dozens of original stories, while featuring a sprin", "imageUrl": null}, {"text": "This was the second year the event has taken place and was made possible by a grant from Cheshire West and Chester Council.\n\nEarlier in the day a 17th Century plague doctor and an entourage of soldiers posed for photos by Chester Cross, before both armies marched through the city with drums beating,", "imageUrl": null}, {"text": "A new animated adaptation of the eponymous MARMADUKE comic strip which currently appears in more than 660 newspapers, in over twenty countries.\n\nMARMADUKE epitomizes the overgrown lapdog, with an irascible streak and a penchant for mischief that is tempered with a deep sense of love and responsibili", "imageUrl": null}, {"text": "Marmaduke Snoopy wasn t the only famous canine comic strip character rolled out in the s. America first met this lovable, messy Great Dane in , and creator Brad Anderson produced the strip until his in . His son Paul still draws new strips, which remain in wide syndication..The following is a list o", "imageUrl": null}, {"text": "Heathcliff Play by Play book. Details (if other): Cancel.\n\nHeathcliff is a 30-minute Saturday morning animated series based on the Heathcliff comic strip created by George Gately and produced by Ruby-Spears Productions. It premiered on ABC on October 4, 1980, with a total of 26 episodes produced und", "imageUrl": null}, {"text": "Photographed By Duane Hall, October 14, 2016\n3. The Battle of Hartville Marker\nRight Panel\nA Stubborn, Sullen, Bloody Fight\nand his men.\n\nI think I may safely state that the object of the expedition was fully accomplished, and more. [The] Army of the Frontier countermarched rapidly to save Springfie", "imageUrl": null}, {"text": "Lord Snooty is one of the most famous characters from the Beano, first appearing in the first issue, dated 30th July 1938, and drawn by Dudley D. Watkins.\n\nThe central character was Lord Marmaduke of Bunkerton, but known to his friends as Snooty. The original premise was quite simple and conventiona", "imageUrl": null}, {"text": "After over half a century of poorly drawn and unfunny comic strips, Marmaduke gets retooled into a poorly made and unfunny movie.  The Marmaduke comic began wasting ink and space in newspapers around the world in 1954 and there had been numerous attempts by producers throughout the years to option i", "imageUrl": null}, {"text": "When making the leap from successful comic strip to feature film, there can be some bumps along the way. Just ask Garfield, Marmaduke or Dennis the Menace. Actually, those films aren't that bad, but after watching them one after another this weekend thanks to my son and HBO Family, I can tell you th", "imageUrl": null}, {"text": "Marmaduke, the world's most lovable Great Dane, leaps from comic strip fame (appearing in 600 newspapers in over 20 countries) to big screen stardom in this family comedy event. A suburban family moves to a new neighborhood in Orange County, California with their large yet lovable Great Dane, who ha", "imageUrl": null}, {"text": "MARMADUKE (June 4) He may not pass obedience school, but the beloved comic strip pooch graduates to the big screen in this live-action romp. Owen Wilson voices the beloved accident-prone Great Dane along with Fergie, George Lopez, Kiefer Sutherland and more stars as his amusing four-legged friends. ", "imageUrl": null}, {"text": "Art Of Storytelling: The Comic Strip\n\nWithout going into history and homages and whatnot I have a feeling for most of us our first introductions to comics were in the daily or Sunday newspaper. Probably not so much anymore with newspapers losing to the internet, but that\u2019s where the comic strip thri", "imageUrl": null}, {"text": "CBS is developing a series based on a comic book\n\nCBS is turning to the world of comics for a new comedy series. jump startthe long-running strip of Rob Armstrong about a black family living in Philadelphia, is being adapted to series on the network as a multi-camera comedy starring Wayne Conley (Th", "imageUrl": null}, {"text": "Been thinking about theme park lands lately. I hope someday I get to visit the \u201cKing\u2019s Row\u201d area of Toon Lagoon at Universal before they eventually retheme it because it\u2019s a weird mausoleum to a bunch of old comic strips owned by King Features Syndicate nobody cares about. In other words it sounds l", "imageUrl": null}, {"text": "While the Marmaduke comic strip series portrays the Great Dane as a lovable galoot who always means well, insurance companies are aware of the actual truth behind the matter. Some owners are able to limit their level of aggressive by giving them the proper training during the early stages of their l", "imageUrl": null}, {"text": "United Feature Syndicate (UFS) is a large American editorial column and comic strip newspaper syndication service based in the United States and established in 1919. Originally part of E. W. Scripps Company, it was part of United Media (along with the Newspaper Enterprise Association) from 1978 to 2", "imageUrl": null}, {"text": "Based on the eponymous classic comic strip, Marmaduke tells the story of a ludicrously large lapdog who often finds himself in trouble of his own making. The plot of this computer-animated feature revolves around Marmaduke's unlikely entanglements in the elite world of competitive dog shows. While t", "imageUrl": null}, {"text": "COLUMBUS, Ohio (AP) \u2013 In a 1970 Beetle Bailey comic strip, the character known as Sarge berates his uniform-wearing dog, Otto, for a paperwork mistake.\n\n\u201cWe can\u2019t all be Snoopy,\u201d a dejected Otto replies.\n\nThis confluence of two iconic comic strip dogs is on exhibit along with dozens of other images ", "imageUrl": null}, {"text": "Earlier this spring, composer Christopher Lennertz recorded his score to the new family comedy, Marmaduke. Directed by Tom Dey, and based on the classic comic strip by Brad Anderson, the film stars Owen Wilson as the voice of the Great Dane who makes the lives of the Wilson family a frequent series ", "imageUrl": null}, {"text": "If you have some Marmaduke comic books lying around in pretty good condition, you may be wondering if they\u2019re worth anything. I\u2019ll tell you in today\u2019s article!\n\nIn today\u2019s article, I\u2019ll examine the history of Marmaduke and the value of the comics, so keep reading!\n\nWhat Are Marmaduke Comics?\n\nIf you", "imageUrl": null}, {"text": "Photographed By O. C. Richardson, 1861\n5. Illustration on Battle of Boonville Marker\n[Caption reads] Battle of Boonville as sketched by O. C. Richardson, from Camp-Fire and Cotton-Field by Thomas W. Knox\nadvancing, were compelled to cross a stretch of open ground. A body of the enemy concealed in a ", "imageUrl": null}, {"text": "Cats love lasagna -- at least, if Garfield is to be believed. \"Garfield\" is the most widely syndicated comic strip in the world, according to the Guinness Book of World Records, and it's also one of the most commercially present comic strips. Paws, Inc., is the company behind \"Garfield,\" handling cr", "imageUrl": null}, {"text": "Pete\u2019s movie career is picking up, which might be the \u201cscheduling\u201d issues he spoke about. He will have an appearance in 2021\u2019s The Suicide Squad, and according to IMDB, he\u2019s currently filming/recording the voice of Marmaduke for the animated adaptation of the classic comic strip. He also landed part", "imageUrl": null}, {"text": "And I'm Tank McNamara with the Norts Spews [Jeff Millar, Bill Hinds] on *FREE* shipping on qualifying offers. This edit will also create new pages on Comic Vine for: Beware, you are proposing to add brand new pages to the wiki along with your edits. Make sure this is what you intended. Comic Book Pr", "imageUrl": null}, {"text": "Lord Snooty is a fictional character in a comic strip in the UK comic The Beano, first appearing in issue 1, dated 30 July 1938, and was the longest running strip in the comic until Dennis the Menace and Gnasher overtook it. The central character was Lord Marmaduke of Bunkerton, known to his friends", "imageUrl": null}, {"text": "The very first cartoon SN&R published was a 1989 illustration by John Kloss that took on fears surrounding nuclear contamination of Rancho Seco.\n\nAnyone who\u2019s seen a prehistoric cave drawing already knows that cartoons are exponentially older than the written word, yet they don\u2019t always get the resp", "imageUrl": null}, {"text": "From Brad Anderson\u2019s endearing newspaper comic strip, we\u2019ve come a long way. Marmaduke from this year serves as a timely reminder that Hollywood has no problem recycling great series until they\u2019re reduced to an indistinguishable jumble of fart jokes and viral TikTok moments. You didn\u2019t like the 2010", "imageUrl": null}, {"text": "There are so many great movies about dogs. These films are heart-warming and relatable. So, read on to see our complete list!\n\nThe first film in the series and its sequel were shot by a Saint Bernard named Chris.  He was hired for all the movies, but died shortly after finishing the filming of the s", "imageUrl": null}, {"text": "What Type of Dog Is Marmaduke?\n\nMarmaduke, the Winslow family dog in the comic strip that bears his name, is a Great Dane (just like Scooby Doo)!\n\nWhat Type of Dog Is Lady & Tramp?\n\nThis breed has historically been used as a sporting dog (cocker is thought to stem from the woodcock birds that the do", "imageUrl": null}, {"text": "Marmaduke, the world\u2019s most lovable Great Dane, leaps from comic strip fame (appearing in 600 newspapers in over 20 countries) to big screen stardom in this family comedy event. A suburban family moves to a new neighborhood in Orange County, California with their large yet lovable Great Dane, who ha", "imageUrl": null}, {"text": "Marmaduke, the world's most lovable Great Dane, leaps from comic strip fame to big screen stardom. In this family comedy event, the \"Duke\" is living large in Orange County, California. But fitting in with his new four-legged friends - and a potential romantic interest - isn't always easy for a super", "imageUrl": null}, {"text": "A comic strip is a sequence of drawings arranged in interrelated panels to display brief humor or form a narrative, often serialized, with text in balloons and captions. Traditionally, throughout the 20th century and into the 21st, these have been published in newspapers and magazines , with horizon", "imageUrl": null}, {"text": "Best known for starring in the Marmaduke comic strip, Pennsylvania besides chose the Great Dane to star as their example. Designated the country dog in 1965, these dogs can grow to about 30 inches grandiloquent !\n\nThe Boykin Spaniel was named the official submit cad of South Carolina in 1985. Origin", "imageUrl": null}, {"text": "This appeared in Los Angeles Times newspaper on August 27, 1995, next to Marmaduke strip!\n\nThe 3 \"Jungle Shih Tzu\" installments below were drawn by Canadian cartoonist Jay Stephens, copyrighted in 1998. I am not too clear about its content but since it's a 'comic strip', I figured why not place it i", "imageUrl": null}, {"text": "Arguably one of the most famous \u201cghost\u201d photos, this picture appeared in Country Living magazine and was shot by English photographer Captain Hubert C. Provand in 1936. The photo was widely accepted as an actual image of an ethereal being, and even has a great deal of mythology attached to it. Howev", "imageUrl": null}, {"text": "I just found this little collection of Bob Thaves' Frank And Ernest. I clipped from the newspaper when I was 12. I had to give up clipping Sunday Comics. I couldn't stand seeing the strips on the reverse side of the page being totally mutilated. The sight of a decapitated Andy Capp creeped me out.\n\n", "imageUrl": null}, {"text": "Marmaduke is an animated adaptation of the eponymous and much-loved comic strip created by Brad Anderson in 1954. The comic strip remains popular decades after its debut and still features in over 600 newspapers in over twenty countries where audiences have grown to love the playful Great Dane Marma", "imageUrl": null}, {"text": "Cinesite and Rhythm & Hues combine to bring Marmaduke to life on the big screen.\n\nCheck out the Marmaduke trailers and clips at AWNtv!\n\nFox's big-screen adaptation of Marmaduke (based on the long-running comic strip) goes further in its hybrid animation approach than Beverly Hills Chihuahua or other", "imageUrl": null}, {"text": "In reading up on the Garfield comic strip recently, something struck us that we had never realized before. Garfield lives in Indiana.\n\nThat got us thinking about where other classic daily comic strips take place. A couple settings were fairly well known, while others were a surprise. In many cases, ", "imageUrl": null}, {"text": "Someone today, who will not go named because she's applying for jobs and needs to preserve her reputation, told me that she likes the comic strip Marmaduke. Now, that's rather abhorrent on its own, as every Marmaduke strip boils down to \"Marmaduke is a big dog. Sometimes, he interacts with his owner", "imageUrl": null}, {"text": "Marmaduke is an animated comedy film based on a comic strip by Brad Anderson. Marmaduke is about a Great Dane dog who is mischievous & messy. A dog trainer makes the team with Marmaduke to demonstrate that he can be the first Great Dane worthy of winning a distinguished dog show trophy.", "imageUrl": null}, {"text": "I really wanted to like this game more, as Heathcliff was a favourite cartoon character of mine as a kid. He was up there with Marmaduke, Garfield and more when I read the Sunday comics my dad gave me every weekend. Spot On runs with the old colouring/ activity book idea of \u2018spot the difference\u2019, an", "imageUrl": null}, {"text": "Dawg, shown above in a classic Sunday page from 1965, is among the canines featured in a new exhibition. See the press release below.\n\n(Columbus, OH) \u2013 The Dog Show: Two Centuries of Canine Cartoons, an exhibition curated by comics historian Brian Walker, features over one hundred different characte", "imageUrl": null}, {"text": "Fox plans a Marmaduke feature, based on the newspaper strip, according to Hollywood Reporter.  Tom Dey (Shanghai Noon) will direct the film, which may be live action, animated, or a combination like the hugely successful Alvin and the Chipmunks.\n\nThe newspaper strip, drawn by Brad Anderson, has been", "imageUr   <div class="tag">Was this work used to train AI?</div>
  <h1>${esc(R.reportName||R.artistName)}</h1>
  <div class="meta">Generated ${new Date(R.generatedAt||Date.now()).toLocaleString()}</div>
  <h2 class="score-heading">Croquis Score</h2>
  <div class="hero"><div class="chip">${grade.g}</div><div>
    <p class="hsum">${esc(summary)}</p>
    <p class="hdet">${detail}</p>
    ${MEMO&&MEMO.positive?`<div class="pills"><span class="badge" style="color:#fff;background:${MEMO.c}">${esc(MEMO.t)}</span><span style="color:var(--gray);font-size:14px">${esc(MEMO.line)}</span></div>`:''}
    ${names.length?`<div class="pills"><span class="hlabel" style="margin:0">Trained on your work:</span>${names.map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>`:''}
  </div></div>

    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}

    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p><p style="margin-top:10px"><button class="btn btn-primary" id="shareBtn">Get assets</button></p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>How we searched</h2>
    <div class="how">
      <div class="how-card"><h3>We read the text next to every image</h3>
        <p>AI models are trained on huge collections of images scraped from the web, each with a caption. We searched those captions for ${esc(R.artistName||'this artist')} and the names of their characters and strips.</p></div>
      <div class="how-card"><h3>We searched every file, not a sample</h3>
        <p>${(R.datasets||[]).filter(d=>d.coverageComplete).length} of the datasets were read in full — every one of their ${((R.datasets||[]).reduce((a,d)=>a+(d.coverageComplete?(d.rowsCovered||0):0),0)/1e9).toFixed(1)} billion rows. So these counts are exact, not estimates.</p></div>
      <div class="how-card"><h3>We only show your actual work</h3>
        <p>A caption mentioning a name pulls back merchandise, news photos and fan art too. Those are counted but kept out of the examples above, so what you see is the work itself.</p></div>
      <div class="how-card"><h3>What a match means</h3>
        <p>Finding your work in a training dataset is strong evidence it was used to build these models. It does not by itself prove a model memorised any single piece.</p></div>
    </div>
  </section>
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;

// ── Share modal ─────────────────────────────────────────────────────────────
const shareText = (present>0
  ? `My work was found in ${present} major AI training dataset${present===1?'':'s'}` +
    (S.totalMentions ? ` — ${fmt(S.totalMentions)} mentions` : '') + '.'
  : 'I checked whether my work is in the datasets used to train AI image models.')
  + ' Check yours at croquis.sfai.agency';
const shareUrl = 'https://croquis.sfai.agency';
document.body.insertAdjacentHTML('beforeend', `
  <div class="modal" id="shareModal">
    <div class="modal-card">
      <button class="modal-close" id="shareClose" aria-label="Close">&times;</button>
      <h2>Share your report</h2>
      <p class="sub">The more artists know this is happening, the harder it is to ignore.</p>
      <div class="caption-box" id="shareCaption">${esc(shareText)}</div>
      <div class="share-row">
        <button class="btn btn-primary" id="copyCaption">Copy caption</button>
        <a class="btn" target="_blank" rel="noopener"
           href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}">Post on X</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}">LinkedIn</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}">Facebook</a>
      </div>
      <p class="sub" style="margin:0">Nothing is uploaded — the text is composed here in your browser.</p>
    </div>
  </div>`);
const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
