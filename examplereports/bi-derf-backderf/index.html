  : mia>=0.50 ? {t:'Early signs of memorization',line:'There is some evidence that AI models have begun to memorize your work.',c:'#E8622C',positive:true}
  : {t:'No clear memorization',line:'We found no clear evidence that AI models have memorized your work.',c:'#2E9E5B',positive:false};
const flagged = new Set();
for(const inf of [R.imageInference,R.audioInference,R.writingInference]){
  for(const w of (inf&&inf.works)||[]) for(const m of w.modelResults||[])
    if(m.riskLevel==='HIGH'||m.riskLevel==='MODERATE') flagged.add(m.model||m.imageModel);
}
const modelCount = (R.models||[]).length + flagged.size;
const noun = R.modality==='music'||R.modality==='podcast_radio' ? 'recordings'
  : R.modality==='writing' ? 'writing' : R.modality==='video'||R.modality==='animation' ? 'videos' : 'images';
const cor = s => '<span style="color:var(--coral)">'+s+'</span>';
// Big plain-language summary + a detailed line beneath it (numbers highlighted).
// The overall message unifies TWO signals: whether the work was found in
// training datasets, and whether directly probing the models shows memorization.
const memStrong = mia!=null && mia>=0.60, memSome = mia!=null && mia>=0.50;
let summary, detail;
if (present===0 && !memSome) {
  summary = mia==null
    ? 'No sign of your work in AI training data — for now.'
    : 'No clear sign AI models have used or memorized your work — for now.';
  detail = 'We searched '+cor(S.totalDatasets||0)+' AI training datasets and found no mention of your work'
    + (mia!=null ? ', and directly testing AI models turned up no clear memorization.' : '. New ones appear all the time, so it\'s worth re-checking.');
} else if (present===0 && memSome) {
  // The "clean datasets but the model clearly memorized it" case: never an A.
  summary = memStrong
    ? 'AI models appear to have memorized parts of your work.'
    : 'AI models are showing early signs of memorizing your work.';
  detail = 'Your work wasn\'t found in the '+cor(S.totalDatasets||0)+' datasets we searched, but directly testing the AI models turned up '
    + (memStrong?'meaningful':'some')+' evidence that they have memorized it.';
} else {
  summary = 'AI companies are using your '+noun+' to teach their AI software.';
  detail = 'Your work was found in at least '+cor(present)+' major AI training dataset'+(present===1?'':'s')
    + (modelCount>0 ? ' and was likely used to train at least '+cor(modelCount)+' AI models.' : '.')
    + (memSome ? ' Directly testing the AI models also shows '+(memStrong?'meaningful':'some')+' evidence of memorization.' : '');
}
// The hosted API renames monthlyActiveUsers -> monthlyDownloads (reportProcessor.js);
// croquis-local reads scanner.models directly, which keeps the original name. Accept both.
const mUsers = m => m.monthlyDownloads || m.monthlyActiveUsers || 0;
const models = (R.models||[]).slice().sort((a,b)=>(b.isMajor?1:0)-(a.isMajor?1:0)||mUsers(b)-mUsers(a));
const majorNames = models.filter(m=>m.isMajor).map(m=>m.name).slice(0,5);
const names = majorNames.length?majorNames:models.slice(0,3).map(m=>m.name);
const probes = ((R.imageInference&&R.imageInference.works&&R.imageInference.works[0]&&R.imageInference.works[0].modelResults)||[])
  .filter(r=>r.riskLevel&&r.riskLevel!=='SKIPPED'&&r.riskLevel!=='ERROR').sort((a,b)=>(b.score||0)-(a.score||0));
// If every probed model came back LOW ("Probably not trained on your work") the
// section states a negative finding and nothing else, so it is dropped entirely —
// the report shows findings, not the absence of them.
const VERD = {HIGH:['Likely trained on your work','#fff','var(--coral)'],
  MODERATE:['Shows signs of being trained on your work','#856404','#fff3cd'],
  LOW:['Probably not trained on your work','#155724','#d4edda']};
// Evidence gallery. A caption match is not automatically showable: the same
// keywords pull back merchandise, storefront listings, photos of the creator and
// explicit fan art. `validation` (scanner/evidence_validation.py) marks each row;
// anything not cleared is counted but never rendered.
const probesShow = probes.some(r=>r.riskLevel && r.riskLevel!=='LOW') ? probes : [];
const evidence=[], withheldBy={};
for(const ds of R.datasets||[]) for(const row of ds.rows||[]){
  if(!(row.imageUrl||row.text)) continue;
  const v=row.validation;
  if(v && v.displayable===false){ withheldBy[v.category]=(withheldBy[v.category]||0)+1; continue; }
  evidence.push({...row,ds:ds.datasetName});
}
// A pipeline may drop withheld rows before writing results.json rather than
// carrying them, in which case the tally above is empty and the real counts are
// on datasetSearch.evidenceWithheld. Prefer whichever actually has numbers.
const declaredWithheld=(R.datasetSearch||{}).evidenceWithheld||{};
if(Object.keys(withheldBy).length===0) Object.assign(withheldBy, declaredWithheld);
const withheldTotal=Object.values(withheldBy).reduce((a,b)=>a+b,0);
// Cap what a single page renders. Peanuts and The Simpsons match hundreds of
// thousands of rows; a few hundred examples make the point without shipping a
// gallery nobody can scroll.
const EVIDENCE_CAP=200;
const shownEvidence=evidence.slice(0,EVIDENCE_CAP);
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.documentElement.style.setProperty('--grade',grade.c);
document.getElementById('app').innerHTML = `
  <div class="brand"><b>Croquis</b></div>
  <div class="tag">Was this work used to train AI?</div>
  <h1>${esc(R.reportName||R.artistName)}</h1>
  <div class="meta">Generated ${new Date(R.generatedAt||Date.now()).toLocaleString()}</div>
  <h2 class="score-heading">Croquis Score</h2>
  <div class="hero"><div class="chip">${grade.g}</div><div>
    <p class="hsum">${esc(summary)}</p>
    <p class="hdet">${detail}</p>
    ${MEMO&&MEMO.positive?`<div class="pills"><span class="badge" style="color:#fff;background:${MEMO.c}">${esc(MEMO.t)}</span><span style="color:var(--gray);font-size:14px">${esc(MEMO.line)}</span></div>`:''}
    ${names.length?`<div class="pills"><span class="hlabel" style="margin:0">Trained on your work:</span>${names.map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>`:''}
  </div></div>
  ${present>0?`<div class="nums">
    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}
  <div class="next"><h2>What&rsquo;s next</h2><div class="steps">
    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    ${withheldTotal?`<p style="color:var(--gray);font-size:14px;margin:-6px 0 16px">
      A further ${withheldTotal.toLocaleString('en-US')} match${withheldTotal===1?' was':'es were'} found but withheld from this gallery (${
        Object.entries(withheldBy).map(([k,n])=>`${n.toLocaleString('en-US')} ${k.replace(/_/g,' ')}`).join(', ')}) — they are counted above but are not examples of your work.
    </p>`:''}
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;
</script>
<footer class="site-footer">
  <div class="site-footer-inner">
    <img src="../../assets/logo.png" alt="SFAI">
    <div><a href="mailto:info@sfai.agency">info@sfai.agency</a></div>
    <p class="copyright">Powered by SFAI.agency &middot; &copy; 2026, The SFAI.agency, San Francisco, CA</p>
  </div>
</footer>
</body>
