d one of the top five comic books ever created.\n\nPin-up (Dargaud) is a Euro-comic that ", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "6 edition of Postmodern art found in the catalog.\n\nby Stuart A. Kallen\n\nPublished 2009 by Lucent Books in Detroit .\nWritten in English\n\nFar more than a comic book with an edge, Art Spiegelman's Maus interrogates the fallacious identity politics of the Nazis, to an unforgettable effect. Given recent ", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Many comic books from the Golden, Silver and Bronze Ages are fun to read, even forty-plus years after their publication. Some of these comics are striking for their timelessness, and others for how they reflect their publication date. If nothing else, it\u2019s enlightening to read the classic stories th", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Blind Vaysha, from The National Film Board of Canada (an outfit that wholly owned the Animated Short category from the \u201960s until the early \u201990s), is directed by Theodor Ushev, and adapted from a philosophical parable penned by Bulgarian poet Georgi Gospodinov. In it, a girl is born with the ability", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The sweeping story of cartoons, comic strips and graphic novels and their century-long hold on the American imagination.\n\nStarting with the Civil War and cartoonist Thomas Nast, creator of the lasting images of Uncle Sam and Santa Claus, author Jeremy\n\nDauber whizzes readers through comics\u2019 progress", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Spiegelman's \"Self portrait with Maus Mask,\" 1989\n\nA reaction to the 9/11 attacks on the World Trade Center in New York, Spiegelman's 2004 comic \"In the Shadow of no towers\" was first published as a comic strip in Germany's Die Zeit weekly before it hit the US market.\n\nIt wasn't his first cooperatio", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Genie Award-winning documentary Comic Book Confidential (1988)\u2014researched in part in the extensive comic book collection of bpNichol, Canada\u2019s first alternative comic writer (Bell 143)\u2014offered a broad introduction to American comic books for many, drawing attention to the rich variety of express", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It was the work of writer and cartoonist Art Spiegelman, and the story was a biographical tale of his father's real-life experience as a Polish Jew who survived the horrors of Auschwitz. It's some pretty heavy shit. If there were a comic book hall of fame, Maus would be one of its first inductees. I", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A comic book is a collection of sequentially juxtaposed panels that depict distinct scenarios in the manner of comics art. Panels are frequently accompanied with descriptive text and written narration, with dialogue typically included in word balloons, which is a hallmark of the comics art style. Th", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Cartoonist Don Simpson burst on the scene in the Orwellian year of 1984, at the height of Reagan\u2019s arms race, neutron bombs, \u201cMinute-Man\u201d missiles, and \u201cdense-pack\u201d multiple-warheads packing twenty megatons (millions of tons of TNT) of explosive force each. The American comic book was also in artist", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "(JTA) \u2014 A rural Tennessee school board\u2019s decision earlier this month to remove \u201cMaus,\u201d the celebrated graphic novel about the Holocaust, from its curriculum, has attracted fierce backlash from other pockets of the state and beyond.\n\nA nearby comic-book store is pledging to give away the book for fre", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "On the flipside, underground comic books that reflected the thriving counterculture at the time began to emerge with Robert Crumb\u2019s Fritz the Cat, Spain Rodriguez\u2019s Trashman and Gilbert Shelton\u2019s The Fabulous Furry Freak Brothers. This portion of the documentary is fascinating as this period of comi", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "By now we all ought at least to be aware of, if not conversant with, the growing influence of graphic literature in the culture. By \"graphic\" I mean \"illustrated,\" the medium of cartoons and comics. (As writer-illustrator Marjane Satrapi jokes, \"When you say 'graphic novel,' I think you mean Lady Ch", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It\u2019s cool to be a nerd. Marvel is pretty much synonymous with box office success and there\u2019s nothing obscure about saying you read graphic novels anymore. Neil Gaiman\u2019s Sandman: Overtures is one of the most famous and influential comics every published. But back in 1989 the comic book industry looke", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I've been reading the graphic novels written and drawn by Jason \u2013 alias John Arne S\u00e6ter\u00f8y \u2013 since American independent comics publisher Fantagraphics issued the first English-language edition of his work, Hey, Wait..., in 2001. By that point Jason had been publishing comics in his home country of No", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Every now and then you come across a comic book that's just not worth your time, and sadly this is the same mindset that currently keeps me from being a regular visitor to direct comics shops. How the industry manages to field so many titles of so little interest is frankly beyond me, but let the co", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Jules Feiffer's comic strip and outlook influenced a number of cartoonists who came after.\n\nLucy Shelton Caswell, curator of the Billy Ireland Cartoon Library and Museum at The Ohio State University, echoes McDonnell. \"He studied at the feet of a couple of the masters -- Milton Caniff and Will Eisne", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Amazing Spiderman # 25, 1965 | \u00a9 Dave, Flickr, edited, CC-BY-NC-ND-2.0 During the 80s and early 90s, the comic book industry built on a new distribution system that focused on comic book stores that bought their comics directly from publishers at a discount. As a new service for collectors, comic bo", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "After writing for Mad, Cracked and Playboy, humorist Lynch recently moved into the children's book field with his book Otto's Orange Day (Toon Books, 2008), illustrated by Syracuse Post-Standard political cartoonist Frank Cammuso. Lynch followed with another 2008 Toon Book, Mo and Jo Fighting Togeth", "imageUrl": null, "keyword": "art spiegelman", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "From political cartoons and the newspaper funny pages to emotionally resonant biographies and multi-volume superhero epics, the scope of comics is a broad one. While many people may still hold onto the outdated idea that comics are silly or childish, the truth is comics comprise a multi-billion-doll", "imageUrl": null, "keyword": "art spiegelman", "tier":
