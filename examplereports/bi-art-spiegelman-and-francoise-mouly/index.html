e force each. The American comic book was also in artist", "imageUrl": null}, {"text": "Listen\nA soundtrack to the intimate documentary Kurt Cobain: Montage of Heck (November 6) will leave Nirvana fans feeling all the feels. Expect unreleased home recordings and a sketch comedy routine performed by Cobain. Store it in a heart-shaped box.\n\nRead\nGraphic novel pioneer Will Eisner has an a", "imageUrl": null}, {"text": "Many comic books from the Golden, Silver and Bronze Ages are fun to read, even forty-plus years after their publication. Some of these comics are striking for their timelessness, and others for how they reflect their publication date. If nothing else, it\u2019s enlightening to read the classic stories th", "imageUrl": null}, {"text": "Comic Book Confidential and the Art of Perfect Timing\n\nRon Mann\u2019s documentary was dismissed by some as decidedly amateurish upon its release. Now, 25 years later, even its kitschiest elements don\u2019t distract from its status as a document of what may be comics\u2019 most critical moment of maturation.\n\nThe", "imageUrl": null}, {"text": "I did not grow up with the work of Maurice Sendak.\n\nWhile I was always peripherally aware of his most famous book \u2014 the now-classic children\u2019s story Where The Wild Things Are \u2014 I didn\u2019t spend any substantial time with him until just a few years ago, when I came across a two-page comic strip from an ", "imageUrl": null}, {"text": "The term graphic novel has been in use since the 1970s, though it did not catch on until a decade later. While graphic novels are comic books, the distinguishing factor for a graphic novel is length. Listed below in no particular order are several novels in different genre from classic to contempora", "imageUrl": null}, {"text": "A beautifully illustrated graphic novel that tells the story of Sim\u00f3n Radowitzky (1891-1956), a gentle soul caught up in a cruel world. The author/illustrator is an Argentinian living in Spain where the book was first published in 2016. Radowitzky appears in a few books (recently The Anarchist Expro", "imageUrl": null}, {"text": "Far-left cartoonist Spiegelman\u2019s experiencing something that was to be fully expected in the tragically politicized climate his side of the spectrum led to, as described by Reuters:\n\nA school board in Tennessee has voted to remove the Holocaust-themed graphic novel \u201cMaus\u201d from its eighth-grade langu", "imageUrl": null}, {"text": "You knew a kid just like him. Pimply chin, buck teeth, always picked last for dodge ball. And after some bully grabbed his lunch money, there\u2019s a pretty good chance he\u2019d bury his shiny nose in a comic book.\n\nDan Pussey is that kid. \u201cI set out to create a truly pink human being, someone totally hideo", "imageUrl": null}, {"text": "The Times of Israel/JTA reported that there\u2019s been a backlash against the school board\u2019s decision:\n\nA rural Tennessee school board\u2019s decision earlier this month to remove \u201cMaus,\u201d the celebrated graphic novel about the Holocaust, from its curriculum has attracted fierce backlash from other pockets of", "imageUrl": null}, {"text": "In terms of output Ivan Brunetti\u2019s graphic novel production is slim, with only the Misery Loves Comedy collection entirely his work, but his respect and reputation among fellow creators is immense. That respect, combined with a fastidious curator\u2019s instinct and innate good taste permitted the fantas", "imageUrl": null}, {"text": "George Joseph Herriman (August 22, 1880 \u2013 April 25, 1944) was an American cartoonist best known for the comic strip Krazy Kat (1913\u20131944). More influential than popular, Krazy Kat had an appreciative audience among those in the arts. Gilbert Seldes' article \u201cThe Krazy Kat Who Walks by Himself\u201d was t", "imageUrl": null}, {"text": "When I was a kid, I read comic books, lots of them and all kinds \u2013 everything from Archie to Superman. So I know the power of putting together graphics and text. And I have to confess, that when I was in school, we could still find Classics Illustrated* in second hand comic stores and I may have act", "imageUrl": null}, {"text": "From political cartoons and the newspaper funny pages to emotionally resonant biographies and multi-volume superhero epics, the scope of comics is a broad one. While many people may still hold onto the outdated idea that comics are silly or childish, the truth is comics comprise a multi-billion-doll", "imageUrl": null}, {"text": "How many artists have created their own genres? Robert Sikoryak may stand among few, especially for genres within the comics form.\n\nHe has an eloquently simple concept: combine a set of words with incongruous drawings in the styles of famous comics. For his first 2009 graphic novel,\nMasterpiece Comi", "imageUrl": null}, {"text": "(JTA) \u2014 A rural Tennessee school board\u2019s decision earlier this month to remove \u201cMaus,\u201d the celebrated graphic novel about the Holocaust, from its curriculum, has attracted fierce backlash from other pockets of the state and beyond.\n\nA nearby comic-book store is pledging to give away the book for fre", "imageUrl": null}, {"text": "On the flipside, underground comic books that reflected the thriving counterculture at the time began to emerge with Robert Crumb\u2019s Fritz the Cat, Spain Rodriguez\u2019s Trashman and Gilbert Shelton\u2019s The Fabulous Furry Freak Brothers. This portion of the documentary is fascinating as this period of comi", "imageUrl": null}, {"text": "The world of graphic books is huge: from comic book super-heroes to politics and memoirs. What they all have in common is a form in which the pictures are as important as the words.\n\n\u2018Every now and then I noticed the artwork doing something clever that couldn\u2019t be done with just words, and I liked h", "imageUrl": null}, {"text": "If you had asked me, when I was a comic book-loving Jewish girl coming of age in 1960s Detroit, besotted with Batman and following Superman\u2019s every adventure, what I wanted to do when I grew up, I may well have described exactly what Steve Bergson does today.\n\nBergson is a \u201ccomics scholar.\u201d He studi", "imageUrl": null}, {"text": "Tennessee, the state where evolution was considered a radical concept unfit for student consumption, continues to live up to its reputation as a backwards puddle in the human gene pool by removing Art Spiegelman\u2019s groundbreaking graphic novel, Maus, from the hungry eyes of eighth graders.\n\nThe McMin", "imageUrl": null}, {"text": "In 1950, eminent social theorist C.L.R. James declared that it is in the \u201cserious study\u201d of popular comic strips like Dick Tracy and Gasoline Alley that \u201cyou find the clearest ideological expression of the American people and a great window into the future of America and the modern world.\u201d This cour", "imageUrl": null}, {"text": "A slightly different approach to a comic book aimed specifically towards children, this work by French Jewish historian Maurice Rajsfus tells the story of two boys who learn they have far more in common than their different religions might suggest. It serves as a lesson that those who are most innoc", "imageUrl": null}]}, {"datasetName": "The Pile (uncopyrighted)", "hfPath": "monology/pile-uncopyrighted", "found": true, "count": 16, "mentionsFound": 16, "exact": true, "coverageComplete": false, "rowsCovered": 917770, "rows": []}, {"datasetName": "C4 (en)", "hfPath": "allenai/c4", "found": true, "count": 30, "mentionsFound": 30, "exact": true, "coverageComplete": false, "rowsCovered": 2230060, "rows": [{"text": "Let\u2019s call this the battle of the animated animals. NO, the battle of the genre\u2019d animated animals.\nIn one side of the ring we have Blacksad, the noir graphic novel starring a giant black feline private eye named John Blacksad. In the far side of the ring, we have plucky Rango, a laissez-fair const S = R.summary || {};
const GRADES = [
  {g:'A',c:'#2E9E5B'},{g:'B',c:'#7CB342'},{g:'C',c:'#F0A202'},
  {g:'D+',c:'#EF8354'},{g:'D',c:'#E8622C'},{g:'F',c:'#D14A3A'}
];
function fmt(n){ n=n||0;
  if(n>=1e9) return '~'+(n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(n>=1e6) return '~'+(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1e3) return '~'+(n/1e3).toFixed(0)+'K';
  return ''+n;
}
// fmt() already prefixes "~" for rounded values, so callers must not add their own.
// A dataset scanned exhaustively (every shard) reports an exact count -- show it in
// full rather than rounding it and implying an estimate.
function mentions(d){
  const n = d.mentionsFound||d.count||0;
  if(!n) return 'Nothing found';
  return (d.exact ? n.toLocaleString('en-US') : fmt(n)) + ' mention' + (n===1?'':'s');
}
const present = S.datasetsPresent||0;
// Membership-inference memorization signal, folded into the overall grade so a
// clean dataset search can't read "A" while the models clearly memorized the
// work. mia = mean of the per-model aggregate scores (0.5 is the null point).
const _probeScores = (((R.imageInference||{}).works||[]).flatMap(w=>w.modelResults||[]))
  .filter(m=>m.riskLevel&&m.riskLevel!=='SKIPPED'&&m.riskLevel!=='ERROR')
  .map(m=>m.score||0);
const mia = _probeScores.length ? _probeScores.reduce((a,b)=>a+b,0)/_probeScores.length : null;
// Memorization evidence lifts the severity: meaningful (+2), some (+1), none (0).
const miaBump = mia==null?0 : (mia>=0.60?2 : mia>=0.50?1 : 0);
const grade = GRADES[Math.min(present+miaBump,5)];
// The hero carries the score, the grade and the two summary lines -- nothing else.
// Badges here state *findings*, so only a positive memorization signal earns one.
// A "no clear memorization" badge derived from the mean also contradicted itself:
// the mean can sit below 0.50 while an individual model still reads MODERATE in
// the section below, so the hero was denying what the page then showed.
const MEMO = mia==null ? null
  : mia>=0.60 ? {t:'Memorization detected',line:'There is meaningful evidence that AI models have found and memorized parts of your work.',c:'#D14A3A',positive:true}
  : mia>=0.50 ? {t:'Early signs of memorization',line:'There is some evidence that AI models have begun to memorize your work.',c:'#E8622C',positive:true}
  : {t:'No clear memorization',line:'We found no clear evidence that AI models have memorized your work.',c:'#2E9E5B',positive:false};
const flagged = new Set();
for(const inf of [R.imageInference,R.audioInference,R.writingInference]){
  for(const w of (inf&&inf.works)||[]) for(const m of w.modelResults||[])
    if(m.riskLevel==='HIGH'||m.riskLevel==='MODERATE') flagged.add(m.model||m.imageModel);
}
const modelCount = (R.models||[]).length + flagged.size;
const noun = R.modality==='music'||R.modality==='podcast_radio' ? 'recordings'
  : R.modality==='writing' ? 'writing' : R.modality==='video'||R.modality==='animation' ? 'videos' : 'images';
const cor = s => '<span style="color:var(--coral)">'+s+'</span>';
// Big plain-language summary + a detailed line beneath it (numbers highlighted).
// The overall message unifies TWO signals: whether the work was found in
// training datasets, and whether directly probing the models shows memorization.
const memStrong = mia!=null && mia>=0.60, memSome = mia!=null && mia>=0.50;
let summary, detail;
if (present===0 && !memSome) {
  summary = mia==null
    ? 'No sign of your work in AI training data — for now.'
    : 'No clear sign AI models have used or memorized your work — for now.';
  detail = 'We searched '+cor(S.totalDatasets||0)+' AI training datasets and found no mention of your work'
    + (mia!=null ? ', and directly testing AI models turned up no clear memorization.' : '. New ones appear all the time, so it\'s worth re-checking.');
} else if (present===0 && memSome) {
  // The "clean datasets but the model clearly memorized it" case: never an A.
  summary = memStrong
    ? 'AI models appear to have memorized parts of your work.'
    : 'AI models are showing early signs of memorizing your work.';
  detail = 'Your work wasn\'t found in the '+cor(S.totalDatasets||0)+' datasets we searched, but directly testing the AI models turned up '
    + (memStrong?'meaningful':'some')+' evidence that they have memorized it.';
} else {
  summary = 'AI companies are using your '+noun+' to teach their AI software.';
  detail = 'Your work was found in at least '+cor(present)+' major AI training dataset'+(present===1?'':'s')
    + (modelCount>0 ? ' and was likely used to train at least '+cor(modelCount)+' AI models.' : '.')
    + (memSome ? ' Directly testing the AI models also shows '+(memStrong?'meaningful':'some')+' evidence of memorization.' : '');
}
// The hosted API renames monthlyActiveUsers -> monthlyDownloads (reportProcessor.js);
// croquis-local reads scanner.models directly, which keeps the original name. Accept both.
const mUsers = m => m.monthlyDownloads || m.monthlyActiveUsers || 0;
const models = (R.models||[]).slice().sort((a,b)=>(b.isMajor?1:0)-(a.isMajor?1:0)||mUsers(b)-mUsers(a));
const majorNames = models.filter(m=>m.isMajor).map(m=>m.name).slice(0,5);
const names = majorNames.length?majorNames:models.slice(0,3).map(m=>m.name);
const probes = ((R.imageInference&&R.imageInference.works&&R.imageInference.works[0]&&R.imageInference.works[0].modelResults)||[])
  .filter(r=>r.riskLevel&&r.riskLevel!=='SKIPPED'&&r.riskLevel!=='ERROR').sort((a,b)=>(b.score||0)-(a.score||0));
// If every probed model came back LOW ("Probably not trained on your work") the
// section states a negative finding and nothing else, so it is dropped entirely —
// the report shows findings, not the absence of them.
const VERD = {HIGH:['Likely trained on your work','#fff','var(--coral)'],
  MODERATE:['Shows signs of being trained on your work','#856404','#fff3cd'],
  LOW:['Probably not trained on your work','#155724','#d4edda']};
// Evidence gallery. A caption match is not automatically showable: the same
// keywords pull back merchandise, storefront listings, photos of the creator and
// explicit fan art. `validation` (scanner/evidence_validation.py) marks each row;
// anything not cleared is counted but never rendered.
const probesShow = probes.some(r=>r.riskLevel && r.riskLevel!=='LOW') ? probes : [];
const evidence=[], withheldBy={};
for(const ds of R.datasets||[]) for(const row of ds.rows||[]){
  if(!(row.imageUrl||row.text)) continue;
  const v=row.validation;
  if(v && v.displayable===false){ withheldBy[v.category]=(withheldBy[v.category]||0)+1; continue; }
  evidence.push({...row,ds:ds.datasetName});
}
// A pipeline may drop withheld rows before writing results.json rather than
// carrying them, in which case the tally above is empty and the real counts are
// on datasetSearch.evidenceWithheld. Prefer whichever actually has numbers.
const declaredWithheld=(R.datasetSearch||{}).evidenceWithheld||{};
if(Object.keys(withheldBy).length===0) Object.assign(withheldBy, declaredWithheld);
const withheldTotal=Object.values(withheldBy).reduce((a,b)=>a+b,0);
// Cap what a single page renders. Peanuts and The Simpsons match hundreds of
// thousands of rows; a few hundred examples make the point without shipping a
// gallery nobody can scroll.
const EVIDENCE_CAP=200;
const shownEvidence=evidence.slice(0,EVIDENCE_CAP);
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}
  <div class="next"><h2>What&rsquo;s next</h2><div class="steps">
    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p><p style="margin-top:10px"><button class="btn btn-primary" id="shareBtn">Get assets</button></p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>How we searched</h2>
    <div class="how">
      <div class="how-card"><h3>We read the text next to every image</h3>
        <p>AI models are trained on huge collections of images scraped from the web, each with a caption. We searched those captions for ${esc(R.artistName||'this artist')} and the names of their characters and strips.</p></div>
      <div class="how-card"><h3>We searched every file, not a sample</h3>
        <p>${(R.datasets||[]).filter(d=>d.coverageComplete).length} of the datasets were read in full — every one of their ${((R.datasets||[]).reduce((a,d)=>a+(d.coverageComplete?(d.rowsCovered||0):0),0)/1e9).toFixed(1)} billion rows. So these counts are exact, not estimates.</p></div>
      <div class="how-card"><h3>We only show your actual work</h3>
        <p>A caption mentioning a name pulls back merchandise, news photos and fan art too. Those are counted but kept out of the examples above, so what you see is the work itself.</p></div>
      <div class="how-card"><h3>What a match means</h3>
        <p>Finding your work in a training dataset is strong evidence it was used to build these models. It does not by itself prove a model memorised any single piece.</p></div>
    </div>
  </section>
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;

// ── Share modal ─────────────────────────────────────────────────────────────
const shareText = (present>0
  ? `My work was found in ${present} major AI training dataset${present===1?'':'s'}` +
    (S.totalMentions ? ` — ${fmt(S.totalMentions)} mentions` : '') + '.'
  : 'I checked whether my work is in the datasets used to train AI image models.')
  + ' Check yours at croquis.sfai.agency';
const shareUrl = 'https://croquis.sfai.agency';
document.body.insertAdjacentHTML('beforeend', `
  <div class="modal" id="shareModal">
    <div class="modal-card">
      <button class="modal-close" id="shareClose" aria-label="Close">&times;</button>
      <h2>Share your report</h2>
      <p class="sub">The more artists know this is happening, the harder it is to ignore.</p>
      <div class="caption-box" id="shareCaption">${esc(shareText)}</div>
      <div class="share-row">
        <button class="btn btn-primary" id="copyCaption">Copy caption</button>
        <a class="btn" target="_blank" rel="noopener"
           href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}">Post on X</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}">LinkedIn</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}">Facebook</a>
      </div>
      <p class="sub" style="margin:0">Nothing is uploaded — the text is composed here in your browser.</p>
    </div>
  </div>`);
const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
</script>

  <div class="site-footer-inner">

    <div><a href="mailto:info@sfai.agency">info@sfai.agency</a></div>
    <p class="copyright">Powered by SFAI.agency &middot; &copy; 2026, The SFAI.agency, San Francisco, CA</p>
  </div>
</footer>
</body>
