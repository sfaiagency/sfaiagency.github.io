egory": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "On May 6th, Dynamite Comics is embarking on a never-before-attempted crossover event that joins all of the comic publisher's most popular characters together in an extravagant genre-bending mash-up. The gimmick? All of these characters -- and all of the comic book writers who will tell their stories", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\u201cAny time you get a chance to fulfill a childhood dream of writing comic books, it is of course very exciting,\u201d said writer Mikki Kendal. \u201cTo be able to do it as part of the Swords of Sorrow event with such an amazing group of women writers is unreal. When this project first came up, I was afraid to", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Gotta\u2019 go with Alan Scott (especially when he\u2019s drawn by Alex Ross). Just love the whole kinda\u2019 connected to the Oa based space cop corps, but still kinda\u2019 not. Really hoping he gets a live action appearance opportunity via flashback on Stargirl.\n\nMiss Fury! First female superhero drawn/created by a", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Victor Gischler is an author of hard-boiled crime fiction. Since 2001 he has written several novels. He also writes comic book stories, mostly for Marvel Comics.\n\nIn 2013, he wrote a six-issue story arc for Dynamite Entertainment's The Shadow series which had the crime fighter fighting alongside Geo", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In case you\u2019ve been hiding under the bed for the past several years you are already aware the extent to which women everywhere are in love with comic books. Walk past any comic convention anywhere and one sees women of all ages dressing up as their favorite character and participating in a culture t", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\u201cComic books are one of the most accurate portrayals of the socioeconomic and cultural norms and values of their time,\u201d says comic historian Aarthi Parthasarathy. Taking that into consideration, one can trace the history of feminism, by looking at comics in India and the west.\n\nFeminism (read: equal", "imageUrl": null, "keyword": "tarpe mills", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Dynamite Entertainment, in response to the public\u2019s overly positive reaction to Gail Simone\u2019s Swords of Sorrow crossover event, is building upon the enthusiasm with an all-new one-shot special entitled Swords of Sorrow: Miss Fury / Lady Rawhide, bringing together two iconic comic book heroines. Dyna", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Catfights and crossdressers, mad scientists and Gestapo agents with swastika-branding irons-it\u2019s one lurid and exciting adventure after another in this lavish, full-color collection of the first female superhero created and drawn by a woman. Miss Fury was a sexy adventurer clad in a skin-tight panth", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Miss Fury HC by (W/A/C) Tarp Mills\nCatfights and crossdressers, mad scientists and Gestapo agents with swastika branding irons-it's one lurid and exciting adventure after another in this lavish, full-color collection of the first female superhero created and drawn by a woman. Miss Fury was a sexy ad", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A woman's place is saving the universe. Think comic books can\u2019t feature strong female protagonists? Think again! In The Spectacular Sisterhood of Superwomen you\u2019ll meet the most fascinating exemplars of the powerful, compelling, entertaining, and heroic female characters who\u2019ve populated comic books", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Hey there Whovians! Disappointed that Whoniverse was cancelled? Well I have just the thing to lift your spirits! We have some more information about the upcoming Doctor Who comic book series from the guys over at Titan Comics. We have covers, we have creators and we have The Tenth and Eleventh Docto", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Dynamite Entertainment is once again teaming up with StoryBundle, the unique literature bundling site known for its support of indie authors, to host an all-new comic book and graphic novel promotion that will allow readers to purchase over 1,500 pages worth of Pulp-inspired stories from Dynamite En", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "As another year of comic book reviewing draws towards its close, we come around to Centaur again. This feature is \"Diana Deane in Hollywood\" by Tarpe Mills. There's an interesting, albeit sexist set-up for a scenario here. Diana is a gender-reversed Tarzan in this story; being a woman, she \"naturall", "imageUrl": null, "keyword": "tarpe mills", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Spectacular Sisterhood of Superwomen\n\nA woman's place is saving the universe.   Think comic books can't feature strong female protagonists? Think again! In The Spectacular Sisterhood of Superwomen you'll meet the most fascinating exemplars of the powerful, compelling, entertaining, and heroic fe", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "IDW Publishing regrets to inform you that this January, many of your most beloved characters are coming under attack. Vicious, bloodthirsty Martians have descended from the skies and crossed through infinite panels and dimensions seeking total comic book conquest! Batten down the hatches and assembl", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Now, Miss Fury and her team of Black Furies have discovered this cruel phenomenon - and they're going to kick some Nazi ass, in an all-female style mission of revenge. The original graphic novel fits perfectly into a continuity gap in the original storylines of Miss Fury, taking place in the summer ", "imageUrl": null, "keyword": "tarpe mills", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Framed by the work of female graphic artists such as Tarp\u00e9 Mills, the new Prada Womenswear SS18 Campaign is a continuation of the Life Comix campaign previously featuring the Menswear collection.\n\nPresenting a new idea of femininity and post-feminism the real-life graphic novel challenges the audien", "imageUrl": null, "keyword": "tarpe mills", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Miss Fury, on the cover of issue #1, art by Alex Schomburg.\n\nMiss Fury is a fictional superheroine from the Golden Age of Comics. She first appeared as The Black Fury on April 6, 1941, a Sunday comic strip distributed by the Bell Syndicate, and created by artist June Tarp\u00e9 Mills (writing as Tarp\u00e9 Mi", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I used to read The Comics Journal when I was 13 years old. I'm not sure if I was supposed to do that. I don't even remember how I got my hands on a copy. Don't tell anyone.\n\nBy the time I was 16, I learned that a comic book's real worth was its investment value, and that The Comics Journal was stupi", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Kevin Cuffe is a father, a warlock, and a Ringo Award-winning comic book author. When not podcasting with Bob Frantz or protecting the universe from malicious extra-dimensional entities, he is usually writing, playing D&D or watching AEW. Kevin lives in Williamsburg, Virginia with his lovely partner", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Miss Fury newspaper strip reprints were collected into a comic book by Timely Comics (the company that became known as Marvel Comics) in December 1942. At first black and white, full color stories started in Issue #2.\n\nThe character was known as Black Fury in the context of the stories, and I imagin", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Miss Fury first appeared in the Newspapers Sunday April 6,later these were reprinted in comic book form for 8 issues starting with Miss Fury #1 by Timely comics, Winter Marla Drake. The book is a bit strange in that it starts in the \"middle\" of the original run and proceeds to the abrupt, and unfini", "imageUrl": null, "keyword": "tarpe mills", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A while back, we did an Agent of S.T.Y.L.E. dedicated to the many comic book costumes worn by the Black Widow. Natasha Romanova has had a long history in the comics, so it\u2019s natural that she\u2019s felt like changing her suit now and then. Her most prominent look, the simple black bodysuit, was inspired ", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "This week the PopCult Bookshelf plays catch up, with four capsule reviews of books that came out earlier this year.\n\nThis is the first original graphic novel in Kaboom!\u2019s successful \u201cAdventure Time\u201d series. Written by web cartoonist Danielle Corsetto and drawn by Zack Sterling (\u201cBravest Warriors\u201d), ", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "There is also the option of an 18\u00d724\u2033 lithograph that is available to purchase signed or unsigned.\n\nNot only has Tucci created this variant cover for Vampirella #1, but he recently crowdfunded his Zombie Sama graphic novel, which featured a preview ashcan for his upcoming Shi-Return of the Warrior s", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "One of the few female artists working during the Golden Age of comics, June Tarp\u00e9 Mills was the creator of Miss Fury, an action comic strip and comic book that first appeared in 1941. Miss Fury is credited as being the first female action hero created by a woman. The Miss Fury comic strip ran until ", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In glorious full color at last, here are the first four years of this wildly original series of Sunday comics pages \u2013 that were also collected in comic book form by Timely (Marvel, back when) Comics.  These are the strips that inspired us to write the following upon the occasion of their reprinting ", "imageUrl": null, "keyword": "tarpe mills", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "August 15, 2013, Mt. Laurel, NJ:  Dynamite is proud to announce the November release of Noir, a new comic book miniseries that unites Miss Fury, one of the first female superheroes, with the Black Sparrow, a villainess featured in the bestselling comic series, The Shadow.  Written by acclaimed crime", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Prepare to have your imagination rescued by heroes of the past with the Asgard Press 2022 Vintage Golden Age Comics Calendar, a gallery of classic comic book covers from the Golden Age of comic publishing. These comic book covers feature many earlier-era super heroes such as Amazing-Man, The Blue Be", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Statistics show that in the 1940s, girls were as likely to read comic books as boys.\n\nBut there was a difference, said retired educator Magdalena Lamarre.\n\nToday, females in comic books are often the heroes, battling evil and fighting for virtue, equality and liberty. But the road to superhero gende", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "She was born in the borough of Brooklyn.\n\nTarp\u00e9 Mills (1915\u201388) was the pseudonym of comic book creator June Mills, one of the first major female comics artists. She is best known for her action comic strip, Miss Fury, the first female action hero created by a woman.[1]\n\nBorn June Tarp\u00e9 Mills, she s", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Superheroes By Women, For Women\n\nA confluence of events:\n\n1) The understandable to-do that's arisen over the whole Starfire and Catwoman depictions in the new DC books has put a lot of attention on superhero comics being written and drawn by men for men (or men-children, as the case may be), with li", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "No, she's Tarp\u00e9 Mills' Miss Fury, from the Golden Age comic strip of the same name.\n\nThose partial panels are all from Sunday strips form the mid-to-late-40s, and were all scanned from the Trina Robbins-edited Miss Fury: Sensational Sundays 1944-1949 (IDW;2011), which I just started reading.\n\nMiss F", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Catfights and crossdressers, mad scientists and Gestapo agents with swastika branding irons-it's one lurid and exciting adventure after another in this lavish, full-color collection of the first female superhero created and drawn by a woman. Miss Fury was a sexy adventurer clad in a skin-tight panth", "imageUrl": null, "keyword": "tarpe mills", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Nelvana was Canada\u2019s first comic book superhero. Until the end of 1940, U.S. comics had claimed sovereignty over North America. Superheroes such as Superman (cocreated by Canadian Joe Shuster) and Batman colonized Canadian newspapers and comic books to such an extent that local artists had to move s", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A special issue of a future issue of the Journal of Fandom Studies will focus on comic book women in response to an increased interest in representations of women in comic books and the general explosion of comic studies over the last decade. The best-known comic book heroes historically have been m", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "JB: What type of challenges did you face in adapting from traditional fiction writing to a comic? Which process do you find more fun?\n\nMK: Word count was probably the hardest part for me. It turns out the dialogue that you can fit in those little boxes on a comics page require more brevity than any ", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Written by Corinna Bechko. Art by Jonathan Lau. Cover by Tula Lotay. The Golden Age heroine returns! New York during the Second World War is a place of mystery and intrigue, but with all our boys fighting in Europe, who will stand up to the forces of darkness at home? Miss Fury is ready to step into", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Spectacular Sisterhood of Superwomen by Hope Nicholson\nThis collections spans the history of powerful, compelling, entertaining, and heroic female comic book characters. Costumed crime busters like Miss Fury, super-spies like Tiffany Sinn, sci-fi pioneers like Gale Allen, and even kid troublemak", "imageUrl": null, "keyword": "miss fury", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuris     <p class="hdet">${detail}</p>
    ${MEMO&&MEMO.positive?`<div class="pills"><span class="badge" style="color:#fff;background:${MEMO.c}">${esc(MEMO.t)}</span><span style="color:var(--gray);font-size:14px">${esc(MEMO.line)}</span></div>`:''}
    ${names.length?`<div class="pills"><span class="hlabel" style="margin:0">Trained on your work:</span>${names.map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>`:''}
  </div></div>
  ${present>0?`<div class="nums">
    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}
  <div class="next"><h2>What&rsquo;s next</h2><div class="steps">
    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;
</script>
