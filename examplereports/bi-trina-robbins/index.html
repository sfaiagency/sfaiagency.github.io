<style>
  /* Design tokens copied from the site's styles.css :root so a report and the
     website render identically. */
  :root { --coral:#E15A4A; --coral-dark:#D14A3A; --dark:#2D2D2D; --gray:#666666;
          --bg:#FAFAFA; --bg-footer:#F5F5F5; --line:#ececec;
          --font-family:'franklin-gothic-atf', Arial, sans-serif; }
  * { box-sizing:border-box; }
  body { font-family:var(--font-family); color:var(--dark); margin:0; background:#fff; }
  .wrap { max-width:900px; margin:0 auto; padding:0 24px 80px; }
  /* Site header: logo left, matching sfai.agency's .header */
  .site-header { border-bottom:1px solid var(--line); background:#fff; }
  .site-header-inner { max-width:900px; margin:0 auto; padding:18px 24px;
                       display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .site-header img { height:34px; display:block; }
  .site-header .hnav { display:flex; gap:20px; align-items:center; }

  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .step { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:18px; }
  .step .n { width:30px; height:30px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; font-weight:800; margin-bottom:8px; }

  .step p { margin:0; font-size:13px; color:rgba(255,255,255,.75); line-height:1.5; }

  .row .sp { flex:1; }
  .badge { font-size:12px; font-weight:700; border-radius:20px; padding:5px 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .card { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card img { width:100%; height:170px; object-fit:cover; display:block; background:var(--bg); }
  .card .cap { padding:10px 12px; font-size:13px; }
  /* Share modal — mirrors the app's "Get assets" flow, minus the canvas card
     generator: a static report has no server, so it offers the caption and the
     platform links and lets the artist post from there. */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
           align-items:center; justify-content:center; padding:24px; z-index:50; }
  .modal.open { display:flex; }
  .modal-card { background:#fff; border-radius:20px; max-width:520px; width:100%;
                padding:28px; position:relative; max-height:90vh; overflow:auto; }
  .modal-card h2 { margin:0 0 6px; font-size:22px; }
  .modal-card p.sub { color:var(--gray); font-size:14px; margin:0 0 18px; }
  .modal-close { position:absolute; top:14px; right:18px; border:0; background:none;
                 font-size:26px; line-height:1; color:var(--gray); cursor:pointer; }
  .share-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .btn { font:inherit; font-size:14px; font-weight:700; border-radius:24px;

         color:var(--dark); cursor:pointer; text-decoration:none; display:inline-block; }
  .btn-primary { background:var(--coral); border-color:var(--coral); color:#fff; }
  .btn:hover { opacity:.9; }
  .caption-box { background:var(--bg); border:1px solid var(--line); border-radius:12px;

                 white-space:pre-wrap; }
  /* How we searched — the app's methodology cards, condensed. */
  .how { display:grid; gap:10px; }
  .how-card { background:var(--bg); border-radius:16px; padding:16px 20px; }
  .how-card h3 { font-size:15px; font-weight:700; margin:0 0 3px; }
  .how-card p { font-size:14px; color:var(--gray); line-height:1.55; margin:0; }
  .site-footer { background:var(--bg-footer); border-top:1px solid var(--line); margin-top:48px; }
  .site-footer-inner { max-width:900px; margin:0 auto; padding:32px 24px; text-align:center; }
  .site-footer img { height:30px; margin-bottom:12px; }
  .site-footer a { color:var(--coral); text-decoration:none; }
  .site-footer .copyright { color:var(--gray); font-size:13px; margin:6px 0 0; }
  @media (max-width:680px){ .nums,.steps{grid-template-columns:1fr;} .hero{flex-direction:column;} }
</style>

ingLowConfidence": 1145, "rows": [{"text": "Vampirella, issue 100\nPublished by Warren, October 1981\nCover artwork by Enrique Torres, Jose Gonzalez, and Sanjulian\nVampirella was originally created by Forrest J Ackerman (editor of Famous Monsters of Filmland) and underground comix artist Trina Robbins and this \u2018Gala\u2019 issue features reproduction", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Moxie Theatre, that shining citadel of feminist drama, has crowned its tenth season with Javier Velasco\u2019s Eternally Bad, an unrelenting salvo intended to send patriarchal religions cowering for mercy. Based on a script by Trina Robbins, Eternally Bad scours religions and cultures around the globe to", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "On Our Shelves Now\n(This book cannot be returned.)\n\nThe IWW, which has been organizing workers since 1905, is often cited yet elusive to scholars because of its eclectic and controversial cultural and social character. Wobblies! presents the IWW whole, scripted and drawn by old-time and younger Wobb", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Hedy Lamarr was by any standards a remarkable woman who lived a remarkable life. This has been briefly spotlighted in a 2006 educational comic by Trina Robbins and Cynthia Martin, and by P\u00e9n\u00e9lope Bagieu in her Brazen collection, but William Roy and Sylvain Dorange providing a more detailed biography", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Edited by underground writer-cartoonist Leonard Rifas and published by Denis Kitchen\u2019s Kitchen Sink Press, both issues of Corporate Crime Comics present a \u201ccollection of corporate atrocity stories\u201d written and illustrated by a variety of prominent voices in the underground comix scene, including Gre", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Mann also interviewed a wide range of subjects that never made the final cut, including musician Frank Zappa and important figures in comic books like Carl Banks, Julie Schwartz, and Trina Robbins. Mann was very protective of his subjects and recalled the difficulty he had interviewing legendary com", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "During its illustrious run, Gay Comix was the backbone of the LGBT comics scene, providing a space where established comic book creators could expand their artistic horizons; where comic strip creators could publish longer format stories; and where new creators could cut their teeth, often with work", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "If you had asked me, when I was a comic book-loving Jewish girl coming of age in 1960s Detroit, besotted with Batman and following Superman\u2019s every adventure, what I wanted to do when I grew up, I may well have described exactly what Steve Bergson does today.\n\nBergson is a \u201ccomics scholar.\u201d He studi", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Continuing on with writer spotlights from last week\u2019s look at Trina Robbins, this week I interviewed Colleen AF Venable, the author of our hilarious and cute new series Guinea Pig, Pet Shop Private Eye, with art by Stephanie Yue, who was in the spotlight in November.\n\nQ. What was the first thing you", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A talented young actress becomes fatally ensnared in London's mysterious and glittery drug culture of the early 20th century. Trina Robbins' comic book adaptation of Sax Rohmer's sensational 1919 novel. DOPE was both the first novel to speak openly about the world's international drug trade, and the", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Maltese Mummy\nby Trina Robbins, illustrated by Tyler Page\n\nIf Rob Reger\u2019s Emily the Strange accessorized, swept her bangs to the side, and got an extra-strength dose of perkiness, she would be very much like Megan Yamamura, one of the partners in the Chicagoland Detective Agency. Megan\u2019s adventu", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "#\nMAY170550\n(W) Trina Robbins (A/CA) Trina Robbins\nA talented young actress becomes fatally ensnared in London's mysterious and glittery drug culture of the early 20th century. Trina Robbins' comic book adaptation of Sax Rohmer's sensational 1919 novel. DOPE was both the first novel to speak openly ", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Yep, 50. The Daughter of Draculon \u2014 created by Forrest J. Ackerman and Trina Robbins \u2014 first appeared in Warren\u2019s Vampirella #1, in a story illustrated by Tom Sutton.\n\nThe issue, with its famous Frank Frazetta cover, is dated September 1969, but it came out in July of that year \u2014 July 17, according ", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The late '80s and early '90s was a sort of heyday for comics anthologies promoting awareness or raising funds for progressive causes: support for people with AIDS (1988\u2019s Strip AIDS USA, edited by Trina Robbins, Bill Sienkiewicz, and Robert Triptow), pro-choice efforts (1990\u2019s Choices, edited by Tri", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A Bunch of Jews (and other stuff): A Minyen Yidn\n\nA Bunch of Jews (and other stuff) is based on the 1938 short story collection of Trina Robbin\u2019s father, Muttel (Mutye) Perechudnik, and was originally published in Yiddish. This graphic novel features a collection of stories drawn from Muttel\u2019s (late", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Fittingly, alongside Brinkley are two comic books by Trina Robbins, who also wrote two books about Brinkley\u2019s place in comics history. While Kathleen has a wispy, Art Nouveau style, Girl ories of love, lust, bullies, exes, and of course comic books and video-games all make up the varied stories in this collection.\n\nKatie West lives in Scotland and is the owner", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Dynamite continues the celebration of Vampirella\u2019s 50th anniversary with the Blank Comic, which takes our favourite alien vampire on a new adventure that defies expectations. Leaping off the page with spectacular art and a story to kill for, Vampirella Blank Comic Book #1 is the Vampi book I have wa", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Winner of the Jessica Rabbit award for \u201cI\u2019m Not Bad I\u2019m Just Drawn That Way\u201d is this brainchild of comics artist Trina Robbins and writer/editor Forrest Ackerman. Is it weird to have a crush on a comic book character? I mean, clearly Vampirella was drawn with a specific, hormone-addled demographic i", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "COVER STORY: Jews and the invention of the American comic book\n\nLook up in the sky: It\u2019s a bird. It\u2019s a plane. No, it\u2019s a minyan of comic book superheroes and their geeky Jewish creators.\n\nFrom its inception, the modern comic book has been a friendly domain for Jews, from Marvel\u2019s Stan Lee to Maus\u2019 ", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A new documentary called BAD ATTI tten by Justin Gray with art by Liam Sharp and Jimmy Palmiotti. \"The Feast\" written by Justin The entire Vampirella vs Witchblade trilogy collected in one trade. A quiet drive home from work erupts into evils unleashed as NYPD detective Sara Pezzini crosses paths with Vampir", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Willy Mendes Spotlight (47:46, 109mb)\nWilly was joined by Trina Robbins, Kim Munson, Joshua Starnes and the panel was moderated by Brian Doherty. Comic Con started off the panel by giving Willy an inkport award. Willy spoke about her Queen of Cosmos Book 1 and 2. Kim talked about her 50 page article", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "through their two \u201cTarpe Mills &  Miss Fury: Sensational Sundays\u201d volumes that bring together all of the strips from 1941 through 1949, highlighted by Trina Robbins\u2019 marvelous introductory essays on the life and career of a true comic original, Tarpe Mills, whose detailed artwork shines due to the m", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The world of comic books, both on the page and off, is one that\u2019s typically dominated by men. It\u2019s an unavoidable gender skew yet what gets pushed to the forefront often hides a wealth of overlooked female talent.\n\nWomen in Comics: Looking Forward and Back is a group exhibition at the Society of Ill", "imageUrl": null, "keyword": "trina robbins", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "he   <div class="tag">Was this work used to train AI?</div>
  <h1>${esc(R.reportName||R.artistName)}</h1>
  <div class="meta">Generated ${new Date(R.generatedAt||Date.now()).toLocaleString()}</div>
  <h2 class="score-heading">Croquis Score</h2>
  <div class="hero"><div class="chip">${grade.g}</div><div>
    <p class="hsum">${esc(summary)}</p>
    <p class="hdet">${detail}</p>
    ${MEMO&&MEMO.positive?`<div class="pills"><span class="badge" style="color:#fff;background:${MEMO.c}">${esc(MEMO.t)}</span><span style="color:var(--gray);font-size:14px">${esc(MEMO.line)}</span></div>`:''}
    ${names.length?`<div class="pills"><span class="hlabel" style="margin:0">Trained on your work:</span>${names.map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>`:''}
  </div></div>

    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}

    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p><p style="margin-top:10px"><button class="btn btn-primary" id="shareBtn">Get assets</button></p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>How we searched</h2>
    <div class="how">
      <div class="how-card"><h3>We read the text next to every image</h3>
        <p>AI models are trained on huge collections of images scraped from the web, each with a caption. We searched those captions for ${esc(R.artistName||'this artist')} and the names of their characters and strips.</p></div>
      <div class="how-card"><h3>We searched every file, not a sample</h3>
        <p>${(R.datasets||[]).filter(d=>d.coverageComplete).length} of the datasets were read in full — every one of their ${((R.datasets||[]).reduce((a,d)=>a+(d.coverageComplete?(d.rowsCovered||0):0),0)/1e9).toFixed(1)} billion rows. So these counts are exact, not estimates.</p></div>
      <div class="how-card"><h3>We only show your actual work</h3>
        <p>A caption mentioning a name pulls back merchandise, news photos and fan art too. Those are counted but kept out of the examples above, so what you see is the work itself.</p></div>
      <div class="how-card"><h3>What a match means</h3>
        <p>Finding your work in a training dataset is strong evidence it was used to build these models. It does not by itself prove a model memorised any single piece.</p></div>
    </div>
  </section>
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;

// ── Share modal ─────────────────────────────────────────────────────────────
const shareText = (present>0
  ? `My work was found in ${present} major AI training dataset${present===1?'':'s'}` +
    (S.totalMentions ? ` — ${fmt(S.totalMentions)} mentions` : '') + '.'
  : 'I checked whether my work is in the datasets used to train AI image models.')
  + ' Check yours at croquis.sfai.agency';
const shareUrl = 'https://croquis.sfai.agency';
document.body.insertAdjacentHTML('beforeend', `
  <div class="modal" id="shareModal">
    <div class="modal-card">
      <button class="modal-close" id="shareClose" aria-label="Close">&times;</button>
      <h2>Share your report</h2>
      <p class="sub">The more artists know this is happening, the harder it is to ignore.</p>
      <div class="caption-box" id="shareCaption">${esc(shareText)}</div>
      <div class="share-row">
        <button class="btn btn-primary" id="copyCaption">Copy caption</button>
        <a class="btn" target="_blank" rel="noopener"
           href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}">Post on X</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}">LinkedIn</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}">Facebook</a>
      </div>
      <p class="sub" style="margin:0">Nothing is uploaded — the text is composed here in your browser.</p>
    </div>
  </div>`);
const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
