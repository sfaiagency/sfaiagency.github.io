n goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In case you haven't noticed--and arguably in spite of all logic--the 21st Century is a great time to be an Archie Comics fan. Along with Marvel and DC, Archie is the only US comic book company to have weathered the twists and turns of the market for seven straight decades and even now the company's ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "COMIC BOOK CREATOR #9 electrifies your summer with a sizzlin' JOE STATON and his energizin' art extravaganza! We talk with the cartoonist about his long, productive career in comics (with special emphasis on fan-favorite E-MAN and NOVA, who dominate our exclusive Staton cover), from his days at Char", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Detail from \u201cA Day at the Psychedelic Circuits,\u201d by Art Spiegelman. The artist, who won a Pullitzer Prize for his graphic novel Maus,\u201d has created a formalist comic experiment in which readers are encouraged to create multiple narratives by changing the order in which they read the individual panels", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The late Stan Goldberg once told me that KATHY, THE TEENAGE TORNADO--one of several Atlas/Marvel Archie variations--was the first regular comic book he ever drew (after a couple tries at horror stories). Mainly the company's colorist in this period, Stan G (so dubbed to differentiate him from Editor", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Hulk is a superhero appearing in publications by the American publisher Marvel Comics. The character was created by writer Stan Lee and artist Jack Kirby. In his comic book appearances, the character is both the Hulk, a green-skinned, hulking and muscular humanoid possessing a vast degree of phy", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Rarely did a hero get a beating like this in comic books! Spider-Man's rouges gallery, including the Scorpion, were a distinct threat - more like the maniacal Richard Widmark in Kiss of Death (1947) than Superman's Lex Luthor. Ditko made this clear by Spider-Man's crumpled posture and with little to", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "My indexing for the Grand Comic Book Database often leads to interesting roads. I've been adding lettering and coloring credits to Marvel\u2019s titles, circa late 1950\u2019s through the 1970\u2019s. While going over some early Amazing Spider-Man interior credits (adding Stan Goldberg\u2019s coloring credit, since he ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "March 13: Kathy by Stan Lee and Stan Goldberg. I collect this 1960s  teen humor series by my favorite Stans. It ranks with the very best of the genre. It\u2019s a delightful and unfortunately rare day when I can add an issue to my collection.\n\nMarch 14: The Access Guide to the Black Comic Book Community ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "This final page is from 1987. Pencils by Stan Goldberg with inks by Rudy Lapick.", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Several small comic publishers put in an appearance at BEA this year there are comic and manga publishers here.  One of our favorites is Papercutz and today they had award winning and well known illustrator Stan Goldberg not only signing his Nancy Drew graphic novel, but he included original drawing", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "APR152033\nComic Book Creator #9 features a sizzlin' Joe Staton and his energizin' art extravaganza! We talk with the cartoonist about his career in comics (with special emphasis on E-Man and Nova, who dominate our cover!), from his days at Charlton, through working with the Big Two (and co-creating ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "FF #1 (JAN110748)\nWritten by JONATHAN HICKMAN\nPencils and Cover by STEVE EPTING\nVariant Cover by DANIEL ACUNA\nVariant Cover by STAN GOLDBERG\nCharacter Variant Cover by MARKO DJURDJEVIC\nFantastic Four 50th Anniversary Variant by PAOLO RIVERA\nBlank Cover Also Available\nThe fight for tomorrow begins to", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Archie Comics, co-CEO Nancy Silberkleit, a former art educator took over the reins at the legendary comic book company in 2009, after her husband Michael Silberkleit (son of Archie Comics founder Louis Silberkleit) died. While the Archie brand is what she\u2019s well-known for, she dons another hat of be", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Stan also had some smaller latter-day personal artistic triumphs that weren\u2019t for Archie with the Jewish-themed Mendy and the Golem, the anti-bullying comic book, Rise Above, and Nancy Drew and the Clue Crew for Papercutz.\nHe was empowered by the energy of his fans at conventions and other personal ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A studied master of storytelling, all the while his drawing style was evolving, giving unique character to the Riverdale gang in ways no one had ever done before. His biggest success came as he started his sixth decade of drawing comic books. When Archie Comics decided to allow Archie to marry in a ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The folks at Papercutz love a good laugh, and who better to provide it than the Three Stooges? Here\u2019s a look at their second volume of new Three Stooges comics, written by George Gladir and Stefan Petrucha and illustrated by Stan Goldberg. Gladir and Goldberg are old Archie hands, while Petrucha wri", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "David Campiti, long-time Art Agent and owner of Glass House Graphics, shares his confessions of his love for the females in comics with C4S.\n\nThe first time I\u2019d read a VAMPIRELLA comic from Warren, I was in high school; I was wowed by the sexy-but-realistic art by Enrich and by Jose Gonzalez. I also", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Above is Jack \u201cKing\u201d Kirby\u2018s magnificent cover for Fantastic Four #1, inked by Dick Ayers and colored by Stan Goldberg. The story within, in which the quartet faces off against the Mole Man (and each other), was written by Stan \u201cthe Man\u201d Lee. The success of FF #1 led to Marvel Comics\u2019 superhero rena", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Additional highlights are a cover by Underground legend and Garbage Pail Kids artist John Pound, a large full color Superman illustration by Joe Giella, the cover to Archie Comics #255 by Stan Goldberg, a Golden Age cover from Justice Traps the Guilty by Marvin Stein, a great Superman daily strip by", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Superman/Batman #16 will be drawn by Marc Deering and Diogenes Neves and not Jae Lee. Though he still does the cover.\n\nAnd instead of Aaron Kuder, Action Comics #35 will also have artist Scott Kolins as well as Vincente Cifuentes, and the above new cover.\n\nElektra #7 will have art by Alex Sanchez, n", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "They say you should never judge a book by its cover, but what comic book fan hasn\u2019t been drawn to an amazing piece of art and made a risky purchase? Each decade of comic book history has seen incredible examples of art that stand the test of time, but generally they go unrecognized outside of the fa", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Liverpudlians. Rock \u2018n\u2019 rollers. Comic book heroes. It\u2019s little wonder that the creators of comics used the Beatles as characters in their work. After all, these four living, breathing human beings were always perceived as \u201ccharacters\u201d anyway. \u201cA Hard Day\u2019s Night\u201d is sometimes like a live-action car", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "George Gladir (September 27, 1925 \u2013 April 3, 2013) was an American writer for comic books. Primarily known as a scripter for Archie Comics, he co-created that publisher's character Sabrina the Teenage Witch, with artist Dan DeCarlo.\n\nGeorge Gladir was born in New York City, the son of Russian immigr", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "He was inducted into comic books' Jack Kirby Hall of Fame in 1996.\n\nCarl Burgos was born as Max Finkelstein in New York City, the child of Jewish parents.[3] He studied at the National Academy of Design in Manhattan,[2] where, he recalled in the late 1960s, \"I quit after one year because I couldn't ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Included here is their excellent miniseries from 2004 (with inks by the great Shane Glines, and various short stories with art by Rick Burchett, Ronnie Del Carmen and even ARCHIE legend Stan Goldberg. Special mention must be made of the production design here; this book is gorgeous:", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The East End is finally getting its own comic book convention.\n\nThis free event will host many professional comic book creators and vendors, allowing visitors to speak with writers and artists and to have the opportunity to purchase original works of art and collectibles.\n\n\u201cComic books run through e", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "As Comic-Con winds down, so do the panels, but there's still a few exciting ones for die hard fans of Supernatural and Fringe!\n\nThere might not be comic book industry were it not for Jack Kirby...and if you don't know who that is, you really don't belong at this convention. Each year, his friends an", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "When I was a kid, I'd go to bed at night and have a recurring dream. In it, I'd stumble upon a stash of gigantic, over-sized comic books.\n\nI'd loved comics since my Uncle Billy took me to the corner store and gave me a nickel to buy a funny animal title missing half its cover. I soon graduated to DC", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Avengers #1 created by Jack Kirby, Stan Lee, Dick Ayers, Stan Goldberg, and Sam Rosen was a revolutionary comic book that was incredibly made. In this comic, the Avengers were brought together by the God of Mischief Loki himself, just like the movie but things played out a little differently. His pl", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Kathy 1 (Oct/59) was published by the company going without a cover name between calling itself Atlas and Marvel; Vicki 4 (Aug/75) by Atlas/Seaboard. Both covers were drawn by Stan Goldberg. The question is whether he needed any help for the eight words of dialogue on the Kathy cover if he came up w", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Matt Brandstein (born January 29, 1972) is an American writer and occasional Bollywood film actor. He is most known for his writing of the popular Jewish childrens comic book series Mendy and the Golem. Brandstein often employs the use of his Hebrew name Moshe in honor of his Jewish heritage.\nBiogra", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "He\u2019s drawn almost every icon that exists in comic books, from Superman to Batman to Spider-Man to Captain America, and now Norm Breyfogle is tackling yet another cultural icon: Archie. Archie, Jughead, Moose, Reggie, Betty and Veronica and company have seen a lot of talented artists drawing their ad", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A few years back, controversial Archie Co-CEO Nancy Silberkleit, herself a former teacher, put out a comic book entitled Rise Above. Drawn by Stan Goldberg, it was the story of a young girl with braces being bullied at her school. I\u2019m proud to say I worked behind the scenes on that one. In all my de", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Written by George Gladir, with art by Stan Goldberg, Mike Esposito, Bill Yoshida, and Barry Grossman \u2014 this comic was about Betty and her friends in Riverdale dealing with the struggles of virtual home schooling!", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The understated simplicity of Ditko\u2019s cover included what would become an iconic Spider-Man image; the full-figure pose was used as the corner symbol on the monthly Amazing Spider-Man title years after he was gone. The bold coloring, likely by Stan Goldberg, compliments Ditko\u2019s images. Spider-Man\u2019s ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The second, and perhaps more traditional homage to the female form is Millie The Model #127 from March 1965. Once again, the editor is Stan Lee, and the cover is drawn and inked by Stan Goldberg. When I was younger, I never read a US romance comic, but I often admired the cover art on the spinners. ", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Remember Bingo? That Wilkin Boy? In spite being little more than a hipper Archie clone without the romantic triangle aspect, Bingo was successful enough to hold his own comic book--which began in 1969--throughout the 1970s. He's even been revived from time to time both in cameos and in reprints in t", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The first volume of Nancy Drew and the Clue Crew debuts from Papercutz on October 30, and we have a sneak preview for you. Like the prose chapter books of the same name, this graphic novel features Nancy and her familiar friends from the series as eight-year-olds, so it\u2019s pitched at a younger audien", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "This 1962 MILLIE THE MODEL flashback story deals with Millie's teenage obsession with fashion which makes it a de facto origin story for Millie! Written by Stan Lee and drawn by Stan Goldberg in a style somewhat between the early humor style and the mid-sixties soap opera seriousness of the title, i", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It\u2019s with great sadness that the NCS passes on the news that comic book legend Stan Goldberg passed away Sunday, Aug 31st, at age 82 from complications of a severe stroke he suffered a few weeks earlier. Stan and his wife Pauline were two of the most wonderful, friendly and genuine people The Lovely", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "When FF#1 arrives in March, it will have a number of variant covers, including one by Stan Goldberg, the original colorist for the 1960\u2019s fantastic Four.\n\nFF #1 (JAN110748)\nFF #1 GOLDBERG VARIANT (JAN110750)\nWritten by JONATHAN HICKMAN\nPencils and Cover by STEVE EPTING\nVariant Cover by DANIEL ACUNA\n", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A couple of weeks ago Archie Comics went viral and made the news for a 1997 Betty comic book which had Betty Cooper going to high school via computer and set in the year 2021. After being posted by Archie Comics, then picked up by USA Today, and fact-checked by Snopes, the story went everywhere. Fir", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "When you think of Stan Lee and his inheritance when he falls to him, much of this legacy revolves around helping us bring some amazing stories about comic books. Working together with the legends of comic colleagues like Jack Kirby, Steve Ditko, John Romita, Moebius, Joe Maneely, Gene Colan, Don Hec", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Over at Publishers Weekly, I talked to the folks at Fulcrum Publishing about their nonfiction graphic novel line, which includes the anthologies Trickster, Wild Ocean, and Colonial Comics, and to one of their authors, Joel Christian Gill, creator of Strange Fruit and Tales of the Talented Tenth.\n\nAt", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Steve Ditko\u2019s superb embellishment adds crispness and moodiness to Kirby's pencils. Ditko\u2019s inking was very much influenced by John Severin in this period, and his delineation over Kirby was impressive (further complimented by Stan Goldberg's coloring). This is another tale of a young recruit facing", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Love and Rockets' creators Gilbert and Jaime Hernandez have mentioned in interviews that they loved Little Archie comic books when they were growing up. Little Archie was started in the 1950s and stars the characters from Archie comics as little kids. The earlier stories were written and drawn by Bo", "imageUrl": null, "keyword": "stan goldberg", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Interesting. I only know Stan Goldberg as a colorist.\n\nHere's a forgotten Marvel comic from 1971, written by Stan Lee and drawn by Stan Goldberg.\n\nEclipso was probably thought to be daring because, I think, he was the first bad guy to headline a feature.\n\n
