ed Beatle\u2019s assassination, Ono commi", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Google went all out on their Doodle today for the 107th anniversary of iconic animator Winsor McCay, known for his \"Little Nemo in Slumberland\" fantasy strip and numerous cartoon creations that revolutionized the film and print industry. \u201cUnlike any comic strip before or since, Little Nemo represent", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Thanks to an alert by John Canemaker, I know that today, Halloween 2007, is Ollie Johnston's 95th birthday.\n\nReally, what can be said about a man on such a day when he's lived so long that he's influenced millions--both professionally and personally--and it's all been said before, often by people wh", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The definitive biography of one of America\u2019s great comic artists, Winsor McCay (1866-1934) McCay\u2019s groundbreaking comic strips Dream of the Rarebit Fiend and Little Nemo in Slumberland, created in the first decade of the twentieth century, remain among the most brilliant examples of the art form.\n\nW", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Dallas, Texas - Among the highlights in Heritage Auctions\u2019 Animation Art auction Dec. 8-9 in Beverly Hills, California, will be a trove of memorabilia celebrating the 90th birthday of Mickey Mouse and the one of the largest collections of artwork by Mary Blair ever offered, many of which come direct", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "There are numerous guides about Mary Blair, but my two favorites are The Art and Aptitude of Mary Blair: An Appreciation by John Canemaker and the photo e-book, Mary Blair\u2019s Special Flair written by Amy Novesky and illustrated by Brittney Lee.\n\nCanemaker\u2019s book is packed with photos, earning it the ", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "When the kids and I first watched The Mysterious Geographic Explorations of Jasper Morello in 2006, I had never heard of steampunk. But when as soon as I heard the term, I knew that this is what it meant.\n\nJasper Morello is an animated short with the look of a 19th-century daguerreotype. The tone is", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A storyboard is a graphic organizer in the form of illustrations or images displayed in sequence for the purpose of pre-visualizing a motion picture, animation, motion graphic or interactive media sequence. The storyboarding process, in the form it is known today, was developed at Walt Disney Produc", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "If you want to learn more about Mary Blair, there is a book of her work entitled The Art and Flair of Mary Blair by John Canemaker.", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Using the magic and wonder of Black Light Theatre Madcap vividly brings to life Winsor McCay\u2019s creation of a young boy\u2019s adventures. From the Golden Age of newspaper comic strips and in celebration of the 100th anniversary of Little Nemo in Slumberland, Madcap creates the surreal landscape of the Ki", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Among the gifts I was lucky enough to receive this year was the enormous volume Winsor McCay, His Life and Art, a much-revamped edition of a book originally published in 1987, compiled and written by John Canemaker. Everything that Canemaker publishes is worth owning; his writing is elegant, his sch", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Bernardo Britto conceived his most recent animated short, the Sundance Short Film Jury Prize-winning Yearbook, after grappling with the ultimately insignificant scale of his previous work. \u201cIt didn\u2019t mean anything, and people would just forget about it,\u201d realized Britto. \u201cHow do you deal with making", "imageUrl": null, "keyword": "john canemaker", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Eyvind Earle standing in front of the storyboard for the Walt Disney Studio short film Paul Bunyan (1958). Photo from the collection of John Canemaker.\n\nEyvind was born on Apri     <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    ${withheldTotal?`<p style="color:var(--gray);font-size:14px;margin:-6px 0 16px">
      A further ${withheldTotal.toLocaleString('en-US')} match${withheldTotal===1?' was':'es were'} found but withheld from this gallery (${
        Object.entries(withheldBy).map(([k,n])=>`${n.toLocaleString('en-US')} ${k.replace(/_/g,' ')}`).join(', ')}) — they are counted above but are not examples of your work.
    </p>`:''}
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;
