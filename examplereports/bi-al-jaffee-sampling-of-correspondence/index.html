full credit for MAD; the comic book was indisputably the most imita", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It\u2019s said that the flutter of insect wings in the Indian Ocean can send a hurricane crashing against the shores of the American Northeast. It\u2019s this premise that lies at the core of The System, a wordless graphic novel created and fully painted by award-winning illustrator Peter Kuper. From the subw", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Even though Rube Goldberg worked at a minor New York paper, the Evening Mail, his comic genius wasn't kept under wraps for long. It wasn't his wacky inventions, though, that first brought him fame -- that came later -- but rather a series called Foolish Questions. In Goldberg's daily comic strips, w", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Mad Magazine itself is a product of the Golden age of comic books, beginning as an imprint of Entertaining Comics. It made it\u2019s debut in 1952 and was founded by legendary cartoonist and editor Harvey Kurtzman and publisher William Gaines. EC was responsible for such notable horror comic book contrib", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "But the story of Patricia Walker as a comic book character is pretty fascinating in and of itself, and to explain that we have to go back to the 1940s \u2014 a period that predates, by decades, the creation of most of the characters who we consider to be the core of the Marvel Universe. It was a time whe", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Last year when it was announced that DC Comics was going to move MAD Magazine from New York City, where it\u2019s been headquartered since it was founded as a comic book in 1952, some folks got worried that the very soul of the magazine, and its New York attitude, would not survive the cross-country jour", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I raved about Heroes of the Comics when it came out in 2014. Now I'm going to rave about More Heroes of the Comics, the new companion volume. This large book has 100 meticulous color paintings of people who were involved in the early days of comic books, painted by Drew Friedman, the great portraiti", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Bill Gaines, owner/publisher of MAD Magazine, said, \u201cHarvey was looking for perfection in a 10-cent comic book.\u201d In the opinion of many, Harvey Kurtzman (1924-1993) came as close as humanly possible to achieving that goal. Authors Denis Kitchen and Paul Buhle explore Kurtzman\u2019s life, art, and writin", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Our next selection is \u201cThe Great Treasury of Christmas Comic Book Stories\u201c, an oversized volume that collects from spectacular Christmas stories from comics\u2019 Golden Age.\n\nAmong the joyful and innocent work in this volume, you will find stories by Walt Kelly (\u201cPogo\u201d), John Stanley (\u201cLittle Lulu\u201d), an", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "As curator of the Billy Ireland Cartoon Library & Museum (BICLM) at Ohio State University, Jenny Robb may have one of the coolest jobs in the country. With its current holdings of original cartoons, books, manuscripts, and comic strips in the millions, the BICLM is the largest cartoon art library in", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Join us for a screening of the documentary \"Irwin: A New York Story\", directed by Dan Makara. The film follows the life of Irwin Hasen, a 96-year-old comic book creator and strip artist, as he shares his memories of childhood and the Golden Age of Comics.\n\nThe film will be followed with a panel disc", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "American humor was turned on its ear in 1952, marking the debut of MAD, a comic book (which would morph into a magazine format) edited by Harvey Kurtzman and published by William Gaines. A satirical outlet, nothing was sacred, be it popular culture, politics, or public figures, and many will probabl", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "For decades a key influence on parodists and satirists in all entertainment media, Mad began in 1952 as a full-color Comic Book, Tales Calculated to Drive You Mad, published by EC Comics. Harvey Kurtzman, the founding editor and writer, began by satirizing popular comic book genres of the time (horr", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Note: the interior pages were two-color instead of the usual comic book-style four color.\nThe next-to-last page of the story is from the one-color inside front cover, while the final page was the four-color back cover of the magazine!\nIllustrated by Arnold Roth, it's never been established who wrote", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Next up in the gift guide we have one of my favorite books of the year, another gem from Yoe Books, in fact. Behaving Madly is a collection of work taken from the many imitators of Mad Magazine that began springing up following the massive sucess of MAD after it was converted from a comic book into ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "EC Comics have been out of business for over 50 years and yet over a half century later its influence is still being felt throughout the comic book industry and throughout pop culture.  In an era where most comic book art was often an afterthought to churning out as many titles as possible, EC had a", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Humbug was a humor magazine edited 1957\u20131958 by Harvey Kurtzman with satirical jabs at movies, television, advertising and various artifacts of popular culture, from cereal boxes to fashion photographs. Nine of the eleven issues were published in a black-and-white comic book-sized format.\n\nWith fata", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The End of the MADness\n\nYesterday contributors to MAD Magazine officially got the news that, after 67 years of continuous publication that began with Harvey Kurtzman\u2018s brilliant comic book and eventually evolved into the magazine that forever changed the world of satire and humor, MAD will stop publ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "From Mad #165. Written by Arnie Kogen. Art by Mort Drucker.\n\nNaturally, all this calls for a 13 COVERS salute \u2014 a mix of personal favorites and noteworthy ones, including those I\u2019ve shown off above. I\u2019ll also be re-presenting some Mad material we\u2019ve run over the last few years \u2014 such as 13 GREAT AL ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Alfred E. Neuman. The gap-toothed \u2018What, me worry?\u2019 kid. He\u2019s graced nearly every MAD cover since the 1950s, though his image dates back to the 19th century. He\u2019s been seen on old postcards, wood carvings, advertisements, and political cartoons. Since his association with MAD, he\u2019s appeared in Loone", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Humbug was the 1957-58 magazine published by a quintet of parody-comics veterans...Harvey Kurtzman had been the founding editor of Mad the comic book, and had edited the first few issues of the larger-format Mad, the new format adopted after the Comics Code had been created by the larger publishers ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\"When I started with Marvel, I was in school,\" Claremont explained about first meeting Stan Lee. \"My parents knew Al Jaffee and he said, 'Oh, does he have any interest in comic books?' And the next thing I know the phone rings, and I pick it up and it's, 'Hey there True believer! This is Stan Lee! S", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "If you were a kid in the 1950s, and you got nightmares from a story in a horror comic book, you have Al Feldstein to blame. If you were a kid in the \u201960s or \u201970s, giggling at MAD\u2019s prankster wit, you have Feldstein to thank. And if you\u2019re a kid today, you are the beneficiary of the gaudy tastes \u2014 or", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Three or four generations ago, humorist Milt Gross was so famous that to avoid him and his work would have been almost impossible \u2014 especially for Jewish readers, some of whom must have winced, while others laughed aloud. With comic strips in the biggest circulation dailies, novels and parodies, not", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "From Krakow to Krypton: Jews and Comic Books by Arie Kaplan\n\nArie Kaplan's new and fascinating look at the history of comics books.\n\nFrom Krakow to Krypton tells their stories and demonstrates how they brought a uniquely Jewish perspective to their work and to the comics industry as a whole. Over-si", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "One of MAD magazine's longest-running cartoonists (only Al Jaffee has been around longer) and the creator of dim-witted barbarian Groo the Wanderer, Sergio Aragon\u00e9s is one of comics\u2019 most popular creators. The man some call the world\u2019s fastest cartoonist has his own bi-monthly comic book series at B", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Do you remember these vintage MAD magazine back page Fold-Ins \u2013 where, with a couple of folds, you could change the page\u2019s picture, and its message?\n\nLook back at a few of these clever pieces of art written and illustrated by the immensely talented Al Jaffee.\n\nHere we go with another ridiculous Mad ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Apparently, my brain had been quietly processing this for nearly four years, and spewed it out again, with the joke finally seeing print today. The 2007 drawing mashes up two stock characters: The Grim Reaper and a psychiatrist. Had I placed them on a desert island, it would have been a gag cartoon ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Miss America (Madeline Joyce Frank) is a superhero appearing in American comic books published by Marvel Comics. She first appeared in Marvel Mystery Comics #49 (Nov. 1943), and was created by writer Otto Binder and artist Al Gabriele for Timely Comics, the 1940s precursor of Marvel, in the period f", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "My latest book, which comes out in August from Fantagraphics, is titled Heroes of the Comics: Portraits of the Legends of Comic Books. In advance of the book\u2019s release, I\u2019d like to briefly explain how I decided who I felt is qualified to be included in this collection of 85 portraits.\n\nThe series ki", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "My mother bought me my first MAD magazine off the newsstand at a Stop & Shop supermarket in 1969. The cover featured a Butch Cassidy and the Sundance Kid parody that I believe was drawn by Jack Davis.\n\nI read that issue over and over again\u2014at least until I convinced mom to buy the next month\u2019s issue", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "During the Thirties and Forties, superman really did come to the supermarket, as the New Gods ushered in what we\u2019ve been encouraged to regard as the Golden Age of superhero comics. Beginning in 1938 with the debut of Jerry Siegel and Joe Shuster\u2019s Superman in DC\u2019s Action Comics # 1, the comic book m", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In 1952, editor Harvey Kurtzman and publisher William Gaines launched MAD, one of the most influential and imitated humor publications in the world. Originally created to parody popular TV shows, movies and, inevitably, comic books, MAD soon expanded into a wide-ranging satire of modern American cul", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Al Feldstein, who\u2019s perhaps most well known for his editorial vision for Mad magazine, died in Montana recently at the age of 88. He edited the revolutionary magazine for over thirty years and developed some of the mag\u2019s most well known comic strips, including Spy vs. Spy. He found his fame creating", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "*Stan Lee will not be at this event.\n\nFace front, true believers! The Stan Lee Universe is the ultimate repository of interviews with and mementos about Marvel Comics\u2019 fearless leader! From his Soapbox to the box office, the Smilin\u2019 One literally changed the face of comic books and pop culture, and ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "MISS AMERICA MAGAZINE #2 (NOV. 1944) Patsy Walker would make her debut in this magazine-sized second issue of the comic that top-lined the Madeline Joyce/Miss America character! Ms. Walker was co-created and drawn by pioneering artist Ruth Atkinson, with either Stan Lee, Otto Binder, or Al Jaffee co", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "MAD magazine will no longer publish new content and the 67-year-old political humor and satire outlet won\u2019t be sold on newsstands, prompting its fans to decry the end of an era as the anti-authority publication bites the dust.\n\nThe influential cult comic book and later magazine was launched in 1952,", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Kurtzman recruited his long-time collaborator Will Elder to work on the strip's illustrations. He suggested to Elder an \"outlineless\", painted style, then thought the strip would be better suited by an India inked, outlined comic book style with flat color behind it. Hefner, whose opinion prevailed,", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "For post-war baby boomers too old for Walt Disney comics but too young for the anatomy lessons awaiting us in the pages of Playboy, MAD magazine was our interim secular bible.\n\nIt wasn\u2019t just a comic book, it was our cultural reference guide. Along with the laughs came the first stirrings of a gener", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Legendary cartoonist and The Far Side creator Gary Larson is making single-frame comics once again, recently uploading some new artwork onto his official website. Last year, Larson had teased a new \u201conline era\u201d of his classic Far Side comic strips, and in December, an official website authorized by ", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\u201cA new and fascinating look at the history of comic books \u2026 extremely well documented and profusely illustrated. You really don\u2019t have to be Jewish to thoroughly enjoy this trip down comic book memory lane.\u201d \u2013Al Jaffee, long-time MAD Magazine contributor and author of the forthcoming Talltales.\n\nJew", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "For my shekels, the question of whether the comic book character Superman, is Jewish or not shouldn\u2019t even be questioned.\n\nBorn and named Kal-El by his father Jor-El, \u201cEl\u201d is one of the ancient names for God used throughout the bible and found in great prophets such as Samue-el, Dani-el and angels M", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Bob Petley of Phoenix, Arizona drew and published this card, circa 1963.\nPosted by Mike Rhode at 9:14 PM No comments: Links to this post\n\nTom Toles' editorial cartoon today is based on the fold-in by famed MAD cartoonist Al Jaffee. Here's a good article on Jaffee from the NY Times, and some online f", "imageUrl": null, "keyword": "al jaffee", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "What can we say about a book like this one?  It's all here, the entire run of Humbug, the hidden tributary of so much in contemporary comics.  If there is a hidden link     ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;
