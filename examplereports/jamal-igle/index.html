"heuristic", "confidence": 0.6}}, {"text": "Comic book publishing is on my mind, and it\u2019s largely on my mind because I\u2019m in the midst of a Kickstarter that will bring to print one of my books via Comicker Press \u2014 a new publisher that began its life in the realm of digital comics. So, full disclosure here: I have a vested personal interest in ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "IDW Publishing came prepared to Anaheim, California's WonderCon event last weekend, announcing several high profile comic book initiatives. Besides the previously discussed Womanthology ongoing series (of miniseries) and the full-length Rocketeer project by Mark Waid and Chris Samnee, IDW is develop", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "WHAT I\u2019M READING, by Jamal Igle\n\nHere\u2019s the thing about me. \u2026 I still read comic books. Every week, I\u2019m in my local shop in Park Slope, Galaxy Comics and Collectibles, buying my \u201ccrack\u201d just like any other comics fiend. I don\u2019t have a pull list, I\u2019m not scouring Previews but I do keep up. Mostly, I ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "After DC Comics released their latest Social Media Guidelines, comic book veteran Patrick Zircher declared he was going to deactivate his Twitter account. He didn\u2019t give a specific reason as to why he was deactivating his account, but he did say it was \u201cjust a break.\u201d He also said he was re-focusing", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In an unexpected article posted by \u201cUncle Richie\u201d (our inspiration), the UK muckraker compiled a list of severely late comicbook Kickstarter campaigns, and I wanted to share some of the details with our readers. In a post this week called \u201c35 Late Crowdfunded Kickstarter Comic Books,\u201d Johnston begin", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Shianndrea Toshigawa is just your average, ordinary ninja -in -training. On the run from her father, the Emperor Terminus and the Azumi ninja clan, Shianndrea trains with the legendary Toshigawa clan to embrace the mysterious power within her. Shinobi: Ninja Princess, (a six issue comic book series)", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Here\u2019s another sequel: I mentioned the first Molly Danger book in a Stack Overflow column. It\u2019s a fun comic book about a superhero who looks like a little girl but is apparently something more\u2026 and it sounds like we\u2019ll be finding out about this \u201csomething more\u201d in the second book. I\u2019m excited to see", "imageUrl": null, "keyword": "molly danger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Tomorrow I have a very special guest. I will be interviewing respected comic book artist, editor, art marketing, and creator Jamal Igle. Having been in the comic book business for 27 years, he\u2019s done for many titles such as Supergirl and Firestorm. He\u2019s also the creator behind Molly Danger, the co-c", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The essential Dragonfly & Dragonflyman #3, by Tom Peyer, Peter Krause and Andy Troy, is out from AHOY Comics on Wednesday, Jan. 8 \u2014 so it\u2019s time for another EXCLUSIVE cover commentary by Jamal Igle.\n\nNot only that, Jamal will show off his design for the issue\u2019s big debut: Lady Dragonflyman \u2014 what is", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Michele and I like to joke that our cat Nettie Netzach is secretly a superhero, that when we aren\u2019t around that she moonlights as the dynamic Netzach Wondercat.  So when I found out that there was an actual comic book series about crime-fighting felines, Hero Cats, of course I had to pick it up.\n\nI ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "how have they changed over time?\n\nJAMAL IGLE: Well, to be honest, when I first conceived Molly, the project was much more of mercenary effort, less personal. It started as a television animation pitch then became reworked as a comic book project for the sake of expediency.\n\nOver the years, my perspe", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Along with all the tricks and treats that come with this time of year, there comes something else. Not something wicked, but something wonderful: Halloween ComicFest is back, and it\u2019s taking place on the special day itself, October 31st! Like Free Comic Book Day, Halloween ComicFest is a day where p", "imageUrl": null, "keyword": "molly danger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "[Link] A Timeline of Recent Allegations in the Comic Book Industry\n\nEditor's Note: This is too important not to repost.\n\nSince June 15, 2020, when artist/writer Cameron Stewart was widely accused of abusing his clout to prey on aspiring teenage comic book creators, the industry has continued to be r", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The pencils are done by Jamal Igle. While not being an especially stand out artist, he manages to make this book his own. He has a clear talent similar to Rafael Albuquerque at drawing unique  faces which capture a character\u2019s entire mood. It\u2019s something rare in many artists that deserves acknowledg", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Oh, Political Me, by JAMAL IGLE\n\nWriter and artist Jamal Igle writes about how comics turned him into a liberal political junkie \u2014 in a very unexpected way:\n\nBig shock, I know. I\u2019m a black guy from New York in an interracial relationship with a French woman from Paris, with a mixed race child. I\u2019m a", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Designed as a point of entry for each concept, every ACTIONVERSE issue is a \u201c#1\u201d. The first three issues include:\n\nACTIONVERSE FEATURING MOLLY DANGER #1 is written and drawn by Jamal Igle (SUPERGIRL / THE TERMINATOR / ACTIONVERSE #0), Cover by Igle and Ross Hughes . Jake Roth, after being forced by ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In a partnership with Markerstone Pictures, Romark Entertainment has secured the rights to the critically acclaimed comic book series HERALD.\n\nThe series, published by Action Lab Entertainment and created by writer John Reilly, and artists Tom Rogers and Dexter Weeks, tells the story of Nikola Tesla", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Dragonfly & Dragonflyman #4, by Tom Peyer, Peter Krause and Andy Troy, is out from AHOY Comics on Wednesday, Feb. 12 \u2014 so it\u2019s time for another EXCLUSIVE cover commentary by Jamal Igle.\n\nAgain, following the lead of the previous issue\u2019s cover, we focused on a single moment/world as opposed to the sp", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "AHOY Comics is in the middle of a multiverse-spanning event via a series of one-shots under The Wrong Earth line of comics. Each one is written and illustrated by a coterie of incredible writers and artists. The next one-shot up for release is The Wrong Earth: Purple #1, written by Stuart Moore and ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The superhero has been a mainstay of comic books since 1938 and is synonymous with wall crawlers, dark knights, and other four color characters. This Halloween, Action Lab Entertainment presents its first ever superhero crossover, ACTIONVERSE, which also doubles as a new branding initiative for it\u2019s", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "AudioComics Kids presents its newest title adapted from the children\u2019s graphic novel series from industry superstar Jamal Igle (Action Comics, Supergirl, Firestorm, Daredevil/Shi): Molly Danger!\nProduced in association with Action Lab Entertainment, and directed by AudioComics co-founder William Duf", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I love it when I\u2019m wrong. I love to be put in my place. Tough love, kiddos, is often the best kind of love. So, just a few weeks ago I shouted at the heavens \u201cWhy isn\u2019t there a Spotify of comic books yet, damnit?!\u201d And with that, I figured the universe would laugh at me and that would be that. But n", "imageUrl": null, "keyword": "molly danger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Dragonfly & Dragonflyman #2, by Tom Peyer, Peter Krause and Andy Troy, is out from AHOY Comics on Wednesday, Dec. 11 \u2014 so it\u2019s time for another EXCLUSIVE cover commentary by Jamal Igle.\n\nAs with Issue #1, Tom\u2019s brief was very simple: \u201cBoth stories feature a fight between Stinger and his brainwashed ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Happy Comic Release Day! Welcome to another installment of GeekMom Comic Book Corner, where we recap our adventures in comics for the week as well give you some of the latest in comic book news.\n\nI\u2019ve been a fan of Batman since I was a child, but due to the darkness of his comic book stories, I have", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Dudley Datson and the Eternal Machine #1\u2014written by Snyder with pencils by Jamal Igle, inks by Juan Castro, colors by Chris Sotomayor, and letters by Tom Napolitano\u2014is the simplest of the three books, but it\u2019s also the weakest. The book focuses on Dudley Datson, a young but brilliant inventor with a", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Ahead of this week\u2019s publication of their first comic book magazine, AHOY Comics is releasing preview pages of their eagerly anticipated series THE WRONG EARTH and announcing plans for two major industry conventions. Throughout the summer, the startup publisher has been teasing its debut titles and ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It is truly an honour and privilege to interview a man who DC describes as a \u201ctriple threat\u201d, comic book legend Jamal Igle. He has worked with the biggest comic book names in the industry, Image, Marvel and DC, but it is his recent work with Action Lab and Molly Danger that caught my attention.\n\nWhe", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Sen. Ted Cruz tried to use comic books to illustrate a point against environmentalists in a clip passed around Monday and Tuesday. It went over poorly, both among fans and creators.\n\n\u201cHave you noticed in how many movies, how often rabid environmentalists are the bad guys? Whether it\u2019s Thanos or\u2026 go ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I am not familiar with Ahoy Comics, but when I saw just the cover to The Wrong Earth at my comic shop, it made me want to learn more. It\u2019s a dimension-spanning story of super heroics, two sides of the same coin, but one side has some serious anger issues. From writer Tom Peyer and art by Jamal Igle,", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "SUPERGIRL #43 Written by Sterling GatesArt by Jamal Igle & Jon Sibal Cover by Joshua Middleton\nThings are going well for Supergirl \u2013 she\u2019s back on New Krypton, and she\u2019s even managing to patch things up with her mother, Alura. But when she goes to visit her older cousin, Superman warns her that not ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "They say there\u2019s no such thing as a free meal in this town but come May 4th, at your local comic shop, there\u2019ll be something much, much better; free comic books. On that day you will literally be able to pick up a bundle of free publications to read, to hand to curious friends, to covet.\n\nFor the un", "imageUrl": null, "keyword": "molly danger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Adapting a television show into a comic book is always a bit of a challenge, but cartoon Teen Titans Go! is more challenging than most. Not only are the episodes short, the plots absurd, and the pacing completely manic, but Teen Titans Go! relies quite heavily on sound for many of its funniest bits,", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The first issue to be released as of this line will be The Wrong Earth: Trapped on Teen Planet #1. Written by Gail Simone and illustrated by Bill Morrison, Walter Geovani and Rob Lean, the story follows gritty vigilante Dragonfly as he ventures into a world filled with teenagers, jokes, romance and ", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The concept of the multiverse is an idea that has long been a hallmark of many comic book yarns throughout the years, and nowhere is the idea of parallel Earths being handled with as much pathos, action, and humor as in AHOY! Comics\u2019 The Wrong Earth, written by Tom Peyer and illustrated by Jamal Igl", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Not every comic book character gets the chance to have a special day dedicated purely to their heroic deeds \u2014 but AHOY Comics\u2019 Dragonflyman is no mere superhero. Indeed, he\u2019s twice the man that other heroes manage to be \u2014 literally.\n\nThe character debuted in 2018\u2019s The Wrong Earth mini-series, which", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "One of the most prolific and eclectic comic book writers working today, Scott Snyder (Nocterra, American Vampire, Wytches) is just getting started, as it was announced today that his publishing company, Best Jackett Press, is teaming up with comiXology to write eight new comic books that will be rel", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Wrong Earth has always been a great choice for comic book fans who enjoy big, wacky superhero crossovers. Now the series returns for its most extravagant multiverse game to date, and a number of guest star creators are joining the ride.\n\nPrevious volumes of The Wrong Earth have focused on the Ba", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Writer Kwanza Osajyefo, artist Jamal Igle and a group of creators, including designer Tim Smith 3 and cover artist Khary Randolph, are launching a Kickstarter (click here) for a new comic book that asks a very basic, yet provocative, question: What if only black people could get superpowers? Of cour", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "THE FUTURE IS BLACK, by Jamal Igle\n\nHome \u00bb RANDOM STUFF \u00bb THE FUTURE IS BLACK, by Jamal Igle\n\nWhat if only black people had superpowers?", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I'm asking for a friend. She's very excited about the upcoming Supergirl show, which looks tonally different than any of the 539 other live-action superhero and based-on-a-comic book shows currently on air. I liked the six minutes I saw, and was a little amazed that the preview for a Supergirl telev", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "3D Cowboy\u2019s Cosmic Convict Challenge(rs) is a 24-page, black and white comic (lettered by Crank!) that will only be available on May 7, 2015 (Free Comic Book Day) and only at Challengers Comics + Conversation in Chicago. Browne, Seeley and Smarto will be signing at Challengers on FCBD, along with Za", "imageUrl": null, "keyword": "molly danger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Written by Vito Delsante & Various. Art by Ray Anthony Heights and Sean Izaakse. Cover by Ray Anthony Heights & Various. IT ALL STARTS HERE! Be a part of the largest creator owned crossover that the Publishing world has ever seen. No Publisher has ever dared, let alone successfully brought together ", "imageUrl": null, "keyword": "molly danger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "DC's Supergirl Comes to an End in May\n\nSupergirl will come to an end this May with issue #42.\n\n(Keep in mind we are talking about the COMIC BOOK series, not the CW TV series, which was already picked up for another season.)\n\nI don\u2019t know about anyone else, but I think that it\u2019s been difficult to sup", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Longtime Comic Book Legal Defense Fund Executive Director Charles Brownstein has resigned, and the board of directors has accepted his resignation, according to a statement released by the organization Monday evening.  The move came as creators withdrew or made public their earlier withdrawal of sup", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Jamal Yaseem Igle[2] is an American comic book artist, editor, art director, marketing executive and animation storyboard artist. The creator of the comic book series Molly Danger he is also known for his pencilling, inking and coloring work on books such as Supergirl and Firestorm.", "imageUrl": null, "keyword": "molly danger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "ZATANNA #12\nWritten by PAUL DINI\nArt by JAMAL IGLE\nCover by ADAM HUGHES\nZatanna\u2019s struggle against the newly rejuvenated Brother Night continues, and his scorched-earth approach has her reconsidering where she draws the line in dealing with her foes . . . and what else she can do to protect the worl", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Tomorrow's Teen Titans #52 is being drawn by one of my favorite artists, Jamal Igle.\n\nI had NO idea.\n\nIn the \"House of Seven Hells!\" this man's name on a cover is an easy sell.\n\nMonth in, month out, he's been delivering with quiet reliability.\n\nThere's no guessing with this man's artwork. His charac", "imageUrl": null, "keyword": "jamal igle", "tier": "high", "punsafe": null, const shownEvidence=evidence.slice(0,EVIDENCE_CAP);

document.documentElement.style.setProperty('--grade',grade.c);

    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>

  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
