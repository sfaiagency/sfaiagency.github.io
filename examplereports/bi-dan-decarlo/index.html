 547, "thirdPartyCount": 23452, "lowConfidenceCount": 0, "totalIncludingLowConfidence": 23999, "rows": [{"text": "With the hit characters Human Torch and Sub-Mariner now joined by Simon & Kirby's seminal patriotic hero Captain America, Timely had its \"big three\" stars of the era fans and historians call the Golden Age of Comic Books. Rival publishers National Comics Publications / All-American Comics, the siste", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Previously in Josie And The Pussycats: Though the first appearance of Josie McCoy and her sweet but occasionally clueless friend Melody Jones dates back to December of 1962 (cover dated February 1963), Josie spent most of the first decade of her comic book life as a gender-swapped Archie.  The brain", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Archie is a long-running comic strip based on the line of the popular Archie Comics. Launched by King Features Syndicate in 1947, it features the misadventures of Archie Andrews and his pals.\n\nBob Montana drew the first issue of the Archie comic book (November 1942). During World War II, Montana spe", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "DeCarlo was married, with a pregnant wife, and working as a laborer for his father when he began to pursue a professional art career.[4] Circa 1947, answering an ad, he broke into the comic book industry at Timely Comics, the 1940s iteration of Marvel Comics. Under editor-in-chief Stan Lee, his firs", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In case you haven't noticed--and arguably in spite of all logic--the 21st Century is a great time to be an Archie Comics fan. Along with Marvel and DC, Archie is the only US comic book company to have weathered the twists and turns of the market for seven straight decades and even now the company's ", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The blog Big Cartoon News filed the first report on her death, quoting car\u00adtoon and comics his\u00adto\u00adrian Mark Evanier. He said that Josie was drawn to resem\u00adble her by her hus\u00adband, comic book leg\u00adend Dan DeCarlo, who died in 2001 at 82.\n\nAlso read: The Osbournes Return to TV \u2014 in Animated Form\n\nDeCar", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Punk rock pioneers The Ramones and Riverdale High School student Archie Andrews might not have much in common. However, that won\u2019t stop them from hanging out in 2016, in Archie Meets The Ramones.\n\nThis crossover adventure is written by Alex Segura and Matthew Rosenberg, with art by Gisele. Segura ha", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "With The Archie Show\u2019s success in its inaugural 1968 season, a cavalcade of spin-offs was initiated. Generally this meant new iterations of the comic book set-ups in various formats ranging from a half hour to one hour in length, over the next several years. Archie was, essentially, Filmation\u2019s Scoo", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Cheryl had her own comic book for a stretch and was drawn by Dan DeCarlo (RIP), who specialized in va-va voom. On nearly every cover, she\u2019s leaving a trail of gobsmacked teen boys and loving it. Meanwhile, the other young ladies of Riverdale are staring daggers in her direction. (Melody of Josie and", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In 1970, another Archie property received the treatment:. Many times the comic tried to keep the shield as its 1 but Archie was too superior. The Escort, art by Dan DeCarlo; Veronica thinks that a monster roaming the halls of Riverdale High is really Archie in disguise; She even gets him to take her", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "DAN DECARLO: JETTA\nWritten, art and cover by Dan DeCarlo.\nDan DeCarlo's futuristic curvy teenage girl Jetta zoomed through the future a full decade before Judy Jetson. In the 1950s, the fan favorite artist, beloved for his portrayals of Betty and Veronica, Josie and Sabrina The Teenage Witch, deline", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "I raved about Heroes of the Comics when it came out in 2014. Now I'm going to rave about More Heroes of the Comics, the new companion volume. This large book has 100 meticulous color paintings of people who were involved in the early days of comic books, painted by Drew Friedman, the great portraiti", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Based on\nJosie and the Pussycats, a comic book created by Dan DeCarlo.\n\nThe Story\nWhen #1 band in the world DuJour begin to realise their music may be being used for nefarious purposes, their record label eliminate them, which means the label need a new act. Fortunately, they stumble across the Puss", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "And this is a typical Archie style comic book: light reading about a bunch of kids and an oversized animate pitcher of sugar water who just want to have fun. Standing in their way is a slit glasses-wearing living flame named Scorch, who like all anthropomorphized flames, just wants to ruin everybody", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Josie and the Pussycats is an American animated television series, based upon the Archie Comics comic book series of the same name created by Dan DeCarlo. Produced for Saturday morning television by Hanna-Barbera Productions, sixteen episodes of Josie and the Pussycats aired on CBS during the 1970-7", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Cadets select toppings for their nachos at Foster Stadium on Sept. 23.\u2014VMI Photo by Kelly Nye.\n\nAs with everything else at VMI this fall, foodservice has undergone numerous changes in response to the coronavirus pandemic.\n\nIn Crozet Hall, in addition to three separate formations for breakfast roll c", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "That Sabrina character certainly gets around, doesn't she?\n\nSabrina the Teenage Witch is a live-action sitcom based on the Archie comic book by Dan DeCarlo and George Gladir. It was created by Nell Scovell, who also served as the showrunner.\n\nOn her 16th birthday, Sabrina Spellman (Melissa Joan Hart", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Our next selection is \u201cThe Great Treasury of Christmas Comic Book Stories\u201c, an oversized volume that collects from spectacular Christmas stories from comics\u2019 Golden Age.\n\nAmong the joyful and innocent work in this volume, you will find stories by Walt Kelly (\u201cPogo\u201d), John Stanley (\u201cLittle Lulu\u201d), an", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "When I first started reading and collecting comic books, I read superhero comics. JUST superhero comics. Oh, there were a few exceptions like SUGAR & SPIKE and STANLEY & HIS MONSTER but I was pretty much all about the superhero comics.  Little by little, though, I learned that there was more to comi", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Sabrina the Teenage Witch is an Archie spin-off comic book series published by Archie Comics and created by George Gladir and Dan DeCarlo, about a \"half-witch\", daughter of a witch and a normal human being, living with her two aunts, Hilda and Zelda Spellman, who are witches themselves. She lives in", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The Pin-Up Art of Bill Ward #1\n\nIn those countless cheap and long forgotten men's humor magazines, Ward's voluptuous \"girly\" drawings shared the pages with photos of Bettie Page and Mamie Van Doren, and pin-up cartoons by the likes of Archie's Dan DeCarlo and Playboy magazine's Jack Cole. Thumbing t", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "\ufeffFor those just joining us:\n\nIt was July 1963 when I realized people got paid for making comic\nbooks and that I wanted that job.  This epiphany was triggered by\nmy buying and reading Fantastic Four Annual #1, the greatest comic\nbook of all time.  So, when I\u2019m not starting these bloggy things of\nmine", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "non-fiction comic series about Black history), Fast Willie was their entry into the mass market.\n(There were no comic book stores at the time)\nThough not Comics Code-approved, it received newsstand distribution, and sales were climbing for each successive issue.\nUnfortunately, it reached break-even ", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A comic book or comicbook, also called comic magazine or simply comic, is a publication, first popularized in the United States. It consists of comics art in the form of sequential juxtaposed panels that represent individual scenes. Panels are often accompanied by brief descriptive prose and written", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "That hamburger-holding, chubby-cheeked cherub Bob\u2019s Big Boy isn\u2019t just a classic icon of the 1930s, selling burgers and seasonings across the United States. He is also the star of one of the longest running and most widely distributed comic book series in comics history, once published by none other", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Sabrina Spellman is the title character from the Archie Comics comic book Sabrina the Teenage Witch. Sabrina was created by writer George Gladir and artist Dan DeCarlo, and first appeared in Archie's Mad House #22 in October 1962.\n\nSabrina has short, bob-cut white hair, sometimes depicted as yellow.", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Pepper Smith, Josie Jones\u2019 pal, gets the spotlight in the new Betty and Veronica Jumbo Comics Digest #306 \u2014 with two, count \u2019em, two stories, one vintage (by Frank Doyle and Dan DeCarlo) and one new (written by Tom DeFalco, with art by Bill Galvan, Bob Smith, Glenn Whitmore and Jack Morelli).\n\nBut t", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Consider the other members of the comic book trinity. Batman: Bruce Wayne, Gotham, detective. Superman: Clark Kent, Metropolis, boy scout. Their essences are schematic. Wonder Woman has been an Amazon and an Olympian. She\u2019s been a god, a mortal, and a mix of both. She\u2019s Diana Prince sometimes, she\u2019s", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Steven Butler is an American comic book artist. He is known both for penciling the Archie Comics series Sonic the Hedgehog as well as creating new designs for Archie characters in 2007. Butler\u2019s work ranges from inking and providing occasional cover duties for Cat and Mouse to superhero illustration", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Is the world ready for a new Sabrina Spellman? Kiernan Shipka (Mad Men, Feud: Bette and Joan) has been cast in the lead role of Netflix original series Untitled Sabrina Project, based on the Archie Comics graphic novel The Chilling Adventures of Sabrina.\n\nNetflix describes the character as \u201can empow", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The archaeology of the colonized\n\nSabrina the Teenage Witch is a comic book series published by Archie Comics about the adventures of a fictional American teenager named Sabrina a was created by writer George Gladir and artist Dan DeCarlo, and first appeared in Archie's Madhouse #22 (cover-dated Oct", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A continuing part of any long-running comic series is attempts to add supplemental stars to their four-colour firmament. A 1963 d\u00e9but did catch and hold the readers attention. Her name was Josie and she was created by Dan DeCarlo as a veritable female clone of Archie. The titian-haired ing\u00e9nue and h", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Comics, for the most part, are bought in comic book stores or bookstores; however, there are some comics that are promotional material that is given away for various reasons. It is common for publishers, such as Marvel Comics, to use non-traditional methods to promote their comics with other product", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The title went back to more straight humor, and continued that way up to its last issue (with Alexandra starting to manifest magic again), Josie and the Pussycats #106 (October, 1982), with art up until the end mostly by Dan DeCarlo (who based the original character on his wife, Josie), and the last", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In 1981, Hernandez and his brothers Jaime and Mario published the first issue of Love and Rockets, which was quickly picked up by Fantagraphics Books, who republished the earliest materials in a new series starting in 1982.[12] The magazine-sized comic book became known for its genre-bending, its pu", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It\u2019s the season for cool scary comics, and this week we\u2019re taking a look at a trio of terror-filled comics.  Leading the way is a collection I\u2019ve been wanting to see for over 30 years, so let\u2019s dig in and check out some Halloween holiday appropriate comic books!\n\nThis is a deluxe comic book collecti", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Recently Gary Friedrich sued Marvel for using Ghost Rider in a movie saying he owned the rights to him since 2001. While I can\u2019t comment on the specifics of this case it did make me think about creator rights. Now in the comic book industry the battle for creator rights started heating up in the lat", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Tuesday may be New Year\u2019s Day, but Wednesday is New Comics Day! Here\u2019s an early look at Betty & Veronica Jumbo Comics Digest #269, which will be available in comic shops on January 2. We have a preview of the new lead story and an entire classic story with a winter theme and art by Dan DeCarlo. Enjo", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Katy Keene, a character created by Bill Woggon, has appeared in several comic book series published by Archie Comics since 1945. She is a model/actress/singer known as America's Queen of Pin-Ups and Fashions.\n\nHer comics were interactive in that readers were encouraged to submit original drawings of", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Netflix\u2019s \u2018Chilling Adventures of Sabrina\u2019 premieres tomorrow.  The first season consists of ten episodes and the series was created by Roberto Aguirre-Sacasa, who also serves as showrunner.  Aguirre-Sacasa also wrote the dark \u2018Chilling Adventures of Sabrina\u2019, one of the first comic books that was p", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Celebrating National Ice Cream Day, but while Veronica Lodge is looking for ice cream, Archie Andrews is getting his two scoops with Betty Cooper, in this cover by Dan DeCarlo to Archie's Girls Betty And Veronica #247 (July, 1976).\n\nPosted by Dave's Not Here Comic Blog at 3:00 AM No comments:", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In his new graphic novel, Love and Rockets co-creator Jaime Hernandez follows his most beloved characters as they try to recapture the punk rock glory days of their youth.\n\nAging punks, of course, can never go home again but Hernandez elevates his story beyond that simple premise in another transcen", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Today\u2019s bloggy thing continues my 136-part series on comic books that hit the newsstands in the month of July 1963. That month was pivotal to my comic-book career because it was the month when Fantastic Four Annual #1 ignited my desire to write comics.\n\nArchie\u2019s Madhouse launched with an issue dated", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Enjoy National Doughnut Day with Jughead Jones, as he works hard on the cover of Jughead #222 (November, 1973) by Dan DeCarlo and Rudy Lapick.\n\nWonder what the eating machine that is Jughead did with those donut holes?\n\nPosted by Dave's Not Here Comic Blog at 1:32 AM No comments:", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Archie is cool now. Yes, the 74-year-old teen-humour comic book, which never seemed to change, has changed so much lately that you literally might not recognize it sometimes. Earlier this month, the publisher announced that the main Archie title, which had gotten up to more than 600 issues, will be ", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "It\u2019s holiday time in Riverdale, and in this week\u2019s preview of Betty & Veronica Double Digest #258, the Archie gang gets a visit from Noelle Claus, the daughter of the Big Guy himself! We\u2019ve got a preview of that for you this morning, followed by a slice of a classic story illustrated by Dan DeCarlo.", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Jughead should be warning Archie to be careful, lest Betty and Veronica find out what he's doing on New Year's Eve, as shown on this Dan DeCarlo/Rudy Lapick cover to Jughead With Archie #97 (March, 1990).\n\nPosted by Dave's Not Here Comic Blog at 5:59 AM No comments:", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Those of us who spent a large part of our adolescence in front of the spinning comic-book rack might forget just how undiscerning and democratic we could be. We might\u2019ve already preferred Marvel over DC, but we weren\u2019t above taking home any comic book at all, if nothing we already loved were availab", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "THE HISTORY OF ARCHIE\n\nArchie Comics began as MLJ Magazines, formed by Maurice Coyne, Louis Silberkleit and John L. Goldwater in 1939. Their first comic book was Blue Ribbon Comics, which was half full color comics and half red and white tinted. In 1940, Pep Comics debuted, focusing on their patriot", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "If they issued Stars on the Walk of Fame for comic books, Marie would have had a fourth.  Under the pre-Marvel brand Atlas, a total of 46 issues of My Friend Irma were published between June 1950 and February 1955. The comics clearly cross-promoted the radio version with \u201cThe famous C.B.S. RADIO Laf", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Are you the type who goes through her books and goes, \u201cI wish I added this\u201d or \u201cI wish I did that\u201d?\n\nWhat\u2019s your ultimate dream as an artist?\n\nTo be making comic books for a living.\n\nDo you have tips for kids who are dreaming of becoming comic book artists?\n\nUse the Internet, definitely. It\u2019s easier", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "There\u2019s a new Josie and the Pussycats comic book series, and this time it\u2019s \u201cIn Space,\u201d written by Alex de Campi and drawn by artist Devaki Neogi. The series, which was created by Dan DeCarlo in the early \u201960s, has remained one of the most prevailing of the Archie Comics spinoff brands. My mother wa", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "George Gladir (September 27, 1925 \u2013 April 3, 2013) was an American writer for comic books. Primarily known as a scripter for Archie Comics, he co-created that publisher's character Sabrina the Teenage Witch, with artist Dan DeCarlo.\n\nGeorge Gladir was born in New York City, the son of Russian immigr", "imageUrl": null, "keyword": "dan decarlo", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Still from the opening titles for Chilling Adventures of Sabrina. Photo: Netflix\n\n\u201cI have this philosophy based on character actors,\u201d says artist Robert Hack. \u201cIf you\u2019re at an audition and someone says, \u2018Can you ride a horse?\u2019 you say, \u2018Absolutely!\u2019 and then you learn how to ride a horse.\u201d\n\nThat was", "imageUrl": null, "keyword": "dan decarlo", "tier": "name
