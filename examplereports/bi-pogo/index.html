%5B3%2F4%2F8%2F0%2F3480319%5D%2Csizedata%5B120x300%5D&call=url%5Bfile%3Aproduct.chain%5D"}, {"text": "Original Comic Art:Comic Strip Art, Walt Kelly Pogo Daily Comic Strip Original Art dated 2-21-53 (Post-Hall Syndicate, 1953)....", "imageUrl": "https://dyn1.heritagestatic.com/lf?set=path%5B2%2F3%2F0%2F2%2F6%2F23026171%5D%2Csizedata%5B120x300%5D&call=url%5Bfile%3Aproduct.chain%5D"}]}, {"datasetName": "OBELICS", "hfPath": "HuggingFaceM4/OBELICS", "found": true, "count": 1958, "mentionsFound": 1958, "exact": true, "coverageComplete": true, "rowsCovered": 141047704, "rows": [{"text": "James Madison and Walt Kelly, creator of the Pogo comic strip, had this much in common:  they both concluded that we are the problem.\n\nKelly issued his most famous pronouncement \u2014 \u201cWe have met the enemy and he is us\u201d \u2014 on a poster for the first Earth Day in 1970.", "imageUrl": null}, {"text": "Six cartoons get Audio Commentaries, by such esteemed animation historians as Jerry beck and Thad Komorowski. The commentaries provide much-needed historical context and information, well worth a listen. There are also three Comic Book Stories based on the Noveltoons shorts, one drawn by the legenda", "imageUrl": null}, {"text": "Jeremy Love\u2019s graphic novel Bayou (2009) is an audacious bricolage. A Southern tragedy set in the fictional town of Charon, Mississippi during the Depression, Bayou subverts genres to offer something new. Lee Wagstaff, our plucky and determined heroine, struggles to rescue her devoted and industriou", "imageUrl": null}, {"text": "Perhaps the most quoted line ever to originate in a comic strip came from Pogo when the disgusted possum surveyed an environmental mess made by his fellow swamp denizens. He intoned: \u201cWe have met the enemy, and he is us.\u201c\n\nWalt Kelly was asked to explain what he meant by that.\n\nHe said that he had t", "imageUrl": null}, {"text": "Walt Kelly was a genius cartoonist who was responsible for some of Disney's best stuff and he went on to create POGO, the comic strip featured above.", "imageUrl": null}, {"text": "Jules Feiffer's comic strip and outlook influenced a number of cartoonists who came after.\n\nLucy Shelton Caswell, curator of the Billy Ireland Cartoon Library and Museum at The Ohio State University, echoes McDonnell. \"He studied at the feet of a couple of the masters -- Milton Caniff and Will Eisne", "imageUrl": null}, {"text": "I am, as I have previously stated, a big fan of Fantagraphics' republishing of Walt Kelly's Pogo comic strip. In the second volume, I was interested to see the last panel of the strip for September 15, 1952. One corner of the panel has clearly been redrawn and relettered, and rather crudely and inac", "imageUrl": null}, {"text": "And Pogo was always filled with cute and cuddly as well as ridiculous.\n\nAs a boy, I depended on the comic section of the Sunday paper to make sense of the world for me.  If I turned out slightly skewed and warped in certain ways, it is owing to the education I myself was given by Pogo, Lil Abner, Da", "imageUrl": null}, {"text": "From an early collection of political cartoons to Magna anime in Japanese and English1, students and comic enthusiasts will find endless enjoyment from this museum's collections and exhibits. Originally, two converted classrooms in the Journalism building at The Ohio State University2, The Museum ha", "imageUrl": null}, {"text": "After being published annually as it's own title in 1942-1943, Santa Claus Funnies became a Four Color Comics feature, publishing annually from 1944 to 1961.\nThis tale was written and illustrated by Walt Kelly, before he created the classic comic strip Pogo.\nBeginning with a two-part adaptation of t", "imageUrl": null}, {"text": "\u201cWe are confronted by insurmountable opportunities.\u201d\n\nSo commented Walt Kelly, the genius behind \u201cPogo,\u201d one of the all-time great newspaper comic strips featuring both satire and wordplay.\n\nPogo Possum, Churchy LaFemme, Porky Pine and the rest of the Okefenokee Swamp gang butchered common phrases a", "imageUrl": null}, {"text": "Comic books address several topical and controversial subjects all the time and so they should. They are mirrors of the current society they are dealing with. This gives the spotlight on those issues and a platform to discuss them. Even comic strips have done that. Some very early in the history of ", "imageUrl": null}, {"text": "Walt Kelly\u2019s Peter Wheat comics are renowned for their humor, artistic flair and appeal to both children and adults. The Peter Wheat comic books are extremely hard to find and have never been collected as a series before, due to their scarcity and rarity. Between 1948 and 1951, Kelly drew thirty-fiv", "imageUrl": null}, {"text": "(ORIGINALLY PUBLISHED IN JUY 2009)\nIn a recent email exchange with Dave Schuler of The Glittering Eye, he summed up beautifully why the illustrator of the late great Pogo comic strip was such an endearing yet powerful cartoonist.\n\n\"We could use Walt Kelly about now,\" Dave said. \"Criticism without cr", "imageUrl": null}, {"text": "\u201cShow me!\u201d In this YouTube era of media, that\u2019s increasingly the demand from an information-hungry public. Newspapers and magazines surviving today seem to put more effort into photos and videos than they do into prose reporting. Clearly, pioneering comic book journalist Joe Sacco has lived long eno", "imageUrl": null}, {"text": "The official neckware of Arizona is the bolo tie.\nThe official possum of Georgia is Pogo, the possum from Walt Kelly\u2019s long-running comic strip of the same name.\nThe official state beverage of Indiana is water. (In Nebraska, it\u2019s Kool-Aid.)\nThe official state meal of Oklahoma is barbecue pork, chick", "imageUrl": null}, {"text": "About a thousand years ago, I was on Steve King\u2019s WGN radio show (now sorely missed) and somebody called in and asked about the name \u201cComic Book.\u201d I was taken aback momentarily, trying to decide if I should go into my \u201cwe\u2019ve kicked the kids out of the donut shop\u201d auto-rant. Out of respect for Steve ", "imageUrl": null}, {"text": "This is far from the first comic book to use typesetting. Even before the digital revolution (whatever that is), EC Comics were lettered using a Kroy lettering machine that created incredibly uniform text.\n\nAnd Walt Kelly typeset the speech of his sideshow barker P.T. Bridgeport, though he may have ", "imageUrl": null}, {"text": "Caniff wrote, \u201cToday, 100,000,000 Americans follow at least one comic strip each day.\u201d Successful syndicated cartoonists like Caniff, Al Capp, Walt Kelly and many others were akin to Hollywood celebrities, earning top dollar for speaking engagements, appearing on newspaper society pages and were muc", "imageUrl": null}, {"text": "That\u2019s sand, not snow, on the grounds of this mid-1800s homestead.\n\nA fun tidbit of information is that the comic strip Pogowas based on animals living within the Okefenokee Swamp. Pogo the Possum and Albert the Alligator were two characters. Real people DID live in the swamp, like the Chesser famil", "imageUrl": null}, {"text": "It's the saddest thing.\n\nI thoroughly enjoyed Bona Fide Balderdash, Volume 2 in Fantagraphics' complete reprinting of Walt Kelly's \"Pogo\" comic strip. This volume covers the years 1951-52. There's a decent amount of biographical information in the two volumes, and in this one we begin to see a recur", "imageUrl": null}, {"text": "Walt Kelly was the greatest daily comic strip artist in American history. His Pogo strip was an uncanny mixture of laughter, high spirits and swamp intrigue, mixed with pointed political satire. His thinly-veiled villain based on Sen. Joseph McCarthy was one of several characters with political over", "imageUrl": null}, {"text": "I just bought myself the fifth volume of the comprehensive collection of daily and Sunday \"Pogo\" comic strips by Walt Kelly. The foreword by Jake Tapper includes this non-Pogo strip Kelly drew in response to the Displaced Persons Act of 1948.\n\n\nRefugees admitted to the United States under this progr", "imageUrl": null}, {"text": "Those Fabuleous Fifties brings us a beautiful silent Walt Kelly kids comic strip from Animal Comics #22. Once again I plead into the void\u2026 PLEASE, someone out there reprint all the Kelly kids comics! If a book like this was well-designed and aimed at the kids market rather than the comic collectors\u2019", "imageUrl": null}, {"text": "I found a new site full of old comics today. Those Fabuleous Fifties has a lot of nice stuff posted, including the full 1952 Pogo Sunday strip by the great Walt Kelly you see a panel from below. Click on it to go to the post on the Fabuleous Fifties site.", "imageUrl": null}, {"text": "I wouldn\u2019t be surprised if Jordan Peele is a fan of Walt Kelly\u2019s Pogo. It was an excellent, hilarious and incredibly influential comic strip, and Peele strikes me as a man of taste. More specifically, I can see Pogo\u2019s tendency to use genre tropes in the service of social commentary appealing to his ", "imageUrl": null}, {"text": "Walt Kelly's comic BOOK work is not as well known as his comic STRIP work; but Kelly was pretty much Dell/Western's star artist in the 40s. He more or less defined their house style, and when not doing licensed material, such as Disney characters in his own inimitable way . . .", "imageUrl": null}]}, {"datasetName": "The Pile (uncopyrighted)", "hfPath": "monology/pile-uncopyrighted", "found": true, "count": 9, "mentionsFound": 9, "exact": true, "coverageComplete": false, "rowsCovered": 917770, "rows": []}, {"datasetName": "C4 (en)", "hfPath": "allenai/c4", "found": true, "count": 12, "mentionsFound": 12, "exact": true, "coverageComplete": false, "rowsCovered": 2230060, "rows": [{"text": "What\u2019s the origin of the mysterious phrase \u201cetaoin shrdlu\u201d?\nYou are my last hope. I need to know the orig   <div class="tag">Was this work used to train AI?</div>
  <h1>${esc(R.reportName||R.artistName)}</h1>
  <div class="meta">Generated ${new Date(R.generatedAt||Date.now()).toLocaleString()}</div>
  <h2 class="score-heading">Croquis Score</h2>
  <div class="hero"><div class="chip">${grade.g}</div><div>
    <p class="hsum">${esc(summary)}</p>
    <p class="hdet">${detail}</p>
    ${MEMO&&MEMO.positive?`<div class="pills"><span class="badge" style="color:#fff;background:${MEMO.c}">${esc(MEMO.t)}</span><span style="color:var(--gray);font-size:14px">${esc(MEMO.line)}</span></div>`:''}
    ${names.length?`<div class="pills"><span class="hlabel" style="margin:0">Trained on your work:</span>${names.map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>`:''}
  </div></div>

    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}

    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p><p style="margin-top:10px"><button class="btn btn-primary" id="shareBtn">Get assets</button></p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>How we searched</h2>
    <div class="how">
      <div class="how-card"><h3>We read the text next to every image</h3>
        <p>AI models are trained on huge collections of images scraped from the web, each with a caption. We searched those captions for ${esc(R.artistName||'this artist')} and the names of their characters and strips.</p></div>
      <div class="how-card"><h3>We searched every file, not a sample</h3>
        <p>${(R.datasets||[]).filter(d=>d.coverageComplete).length} of the datasets were read in full — every one of their ${((R.datasets||[]).reduce((a,d)=>a+(d.coverageComplete?(d.rowsCovered||0):0),0)/1e9).toFixed(1)} billion rows. So these counts are exact, not estimates.</p></div>
      <div class="how-card"><h3>We only show your actual work</h3>
        <p>A caption mentioning a name pulls back merchandise, news photos and fan art too. Those are counted but kept out of the examples above, so what you see is the work itself.</p></div>
      <div class="how-card"><h3>What a match means</h3>
        <p>Finding your work in a training dataset is strong evidence it was used to build these models. It does not by itself prove a model memorised any single piece.</p></div>
    </div>
  </section>
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;

// ── Share modal ─────────────────────────────────────────────────────────────
const shareText = (present>0
  ? `My work was found in ${present} major AI training dataset${present===1?'':'s'}` +
    (S.totalMentions ? ` — ${fmt(S.totalMentions)} mentions` : '') + '.'
  : 'I checked whether my work is in the datasets used to train AI image models.')
  + ' Check yours at croquis.sfai.agency';
const shareUrl = 'https://croquis.sfai.agency';
document.body.insertAdjacentHTML('beforeend', `
  <div class="modal" id="shareModal">
    <div class="modal-card">
      <button class="modal-close" id="shareClose" aria-label="Close">&times;</button>
      <h2>Share your report</h2>
      <p class="sub">The more artists know this is happening, the harder it is to ignore.</p>
      <div class="caption-box" id="shareCaption">${esc(shareText)}</div>
      <div class="share-row">
        <button class="btn btn-primary" id="copyCaption">Copy caption</button>
        <a class="btn" target="_blank" rel="noopener"
           href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}">Post on X</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}">LinkedIn</a>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}">Facebook</a>
      </div>
      <p class="sub" style="margin:0">Nothing is uploaded — the text is composed here in your browser.</p>
    </div>
  </div>`);
const modal=document.getElementById('shareModal');
const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
document.getElementById('shareBtn')?.addEventListener('click',open);
document.getElementById('shareClose').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
document.getElementById('copyCaption').addEventListener('click',async e=>{
  try{ await navigator.clipboard.writeText(shareText); e.target.textContent='Copied'; }
  catch{ e.target.textContent='Select and copy above'; }
  setTimeout(()=>{ e.target.textContent='Copy caption'; },1800);
});
