, "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "This was one of Vishavjit Singh's first sketches of himself as Captain America.\n\nThen he saw an animated cartoon by American cartoonist Mark Fiore. It powerfully mocked the xenophobia fueling the retaliation for 9/11. It was called \"Find the Terrorist in Your Neighborhood\" and showed a sequence of f", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Telnaes has been intrigued by how apps could allow cartoonists to approach\neditorial cartoons in new ways. \u201cIn print, users are passive \u2013 meaning\nthat editors determine what they see.\u201d She adds \u201cOnline, readers have\nmore content choice but it\u2019s still a passive experience. With apps, the\nevolution of", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Find the Terrorist, created by Mark Fiore, would later become a cartoon strip. The user has to identify the terrorist from a list of suspects of all races and countries of origin, by clicking on their faces. The result is an editorial in itselfo.", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Political cartoons have a long and impressive history. The power they wield is not to be underestimated.\n\nLouis XVI lost his head in part because of a series of salacious drawings that undermined the reputation of Marie Antoinette.\n\nNapoleon was said to have counted the British cartoonist James Gill", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Sweet: Vertigo's Graphic Content blog has posted some pages from their upcoming Fidel Castro graphic novel \"Cuba: My Revolution\" featuring the art of Dean Haspiel, and they are muy bonita.\n\nControversy: A parent in Minnesota has decided that the graphic novel a child brought home from school was ina", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Immigration, gun control and social justice issues. With politics firmly in the headlines both in the UK and USA, Varoom talks to four pioneering US image-makers about how the political cartoon is evolving.\n\nFor a generation of people, the caricature on the newspaper Opinion pages was a brisk correc", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Studies find it's difficult to know whether using social media makes people sad, or whether sad people turn to social media, and then feel worse. (Image by Mark Fiore)\n\nA 2012 survey of social science papers related to the social network turned up 412 separate studies. One of the most popular questi", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Many believe the \"white working class\" swung the election for President Trump. But who exactly does the term refer to? (Mark Fiore/KQED)\n\nStill, there is a lot of confusion about who exactly the white working class refers to. Some suggest we should stop using the term altogether because it is racial", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Once again, I have the honor to comment on a collection of cartoons that students submitted as part of KQED\u2019s \u201cPolitical Cartoon with Mark Fiore\u201d youth media challenge \u2013 and, again, I\u2019m grateful that I don\u2019t have to pick a winner!\n\nWe received hundreds of editorial cartoons on a wide range of issues", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A good political cartoon is more than just funny. It makes you think about current events, holds truth to power and is a tool of criticism.\n\nAustralian artists long enjoyed a high degree of editorial independence, but as newspapers have become more partisan in recent years, that independence has dec", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A Monterey County ordinance aims to help flower growers whose businesses have been undercut by cheap imports. (Mark Fiore/KQED)\n\nRows of dilapidated greenhouses line the little farm roads on the southeastern outskirts of Salinas. People once called this area the \"flower basket of America.\" Most of t", "imageUrl": null, "keyword": "mark fiore", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "A screen shot from \"Let It Trickle,\" Truthdig's 2017 holiday animation by Mark Fiore.\n\nAs 2017 winds down, Mark Fiore brings animated holiday tidings to show the true meaning of trickle-down economics. The national situation is not pretty at the momen   </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    ${withheldTotal?`<p style="color:var(--gray);font-size:14px;margin:-6px 0 16px">
      A further ${withheldTotal.toLocaleString('en-US')} match${withheldTotal===1?' was':'es were'} found but withheld from this gallery (${
        Object.entries(withheldBy).map(([k,n])=>`${n.toLocaleString('en-US')} ${k.replace(/_/g,' ')}`).join(', ')}) — they are counted above but are not examples of your work.
    </p>`:''}
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;
