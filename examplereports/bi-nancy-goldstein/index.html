us, this week we are offering other brand-new merchandise, incl", "imageUrl": null, "keyword": "nancy goldstein", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Jackie Ormes was the first Black woman to create, write and draw her own syndicated comic strip in the United States. For those who read and enjoy comics, you may realize that there are not a lot of female creators working on prominent characters for DC Comics and Marvel. However, in the 1930s, Orme", "imageUrl": null, "keyword": "torchy brown", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In celebration of Black History Month, Comic Book Legal Defense Fund has partnered with Black Nerd Problems to spotlight Black comics creators and cartoonists who have made significant contributions to free expression. Visit CBLDF.org throughout the month of February to learn more!\n\nZelda Jackson Or", "imageUrl": null, "keyword": "nancy goldstein", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Torchy Brown first appeared in the Pittsburgh Courier in the 1937-38 comic strip Dixie to Harlem, drawn by the first Black Female Cartoonist, Jackie Ormes. Torchy Brown was later syndicated around the country until it\u2019s end in 1940.\n\nThe strip was resurrected in the 1950\u2019s as Torchy In Heartbeats. S", "imageUrl": null, "keyword": "torchy in heartbeats", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In the comic strip Torchy Brown from Dixie to Harlem, a spunky Black teenager leaves her Mississippi home for the bright lights of Harlem. She\u2019s glamorous, ambitious, clever, and so self-assured that when she sees a sign pointing one way for COLORED and another way for WHITE, her response is, \u201cI\u2019ll ", "imageUrl": null, "keyword": "torchy brown", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "At San Diego Comic-Con (SDCC) on Friday, Monstress author Marjorie Liu became the first woman to win an Eisner Award for Best Writer, the comic book industry's top honor for graphic authors. Although the industry is still largely a boys' club, Liu's victory shows that change is coming to comics.\n\nLi", "imageUrl": null, "keyword": "patty-jo 'n' ginger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Ormes\u2019s first comic strip, Torchy Brown in Dixie to Harlem, first appeared in the Pittsburgh Courier in 1937. In addition to the Courier, Torchy Brown was syndicated to fourteen other black newspapers. The strip,starring Torchy Brown, was a humorous depiction of a Mississippi teen who found fame and", "imageUrl": null, "keyword": "torchy brown", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "To celebrate the 75th anniversary of the first publication of the comic strip Patty-Jo \u2018n\u2019 Ginger, today\u2019s Google Doodle honors the life of its creator, Jackie Ormes \u2014 through a comic, of course!\n\nThe parallax-animated comic strip offers a glimpse into the story of Jackie Ormes, born Zelda Mavin Jac", "imageUrl": null, "keyword": "torchy brown", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Jackie Ormes has acquired some interest from comic strip fans for her Torchy Brown series (see a sample here), mainly because of the strip reproduced in an old issue of Nemo. But Torchy was hardly more than a blip on Ormes' map. Patty Jo 'n' Ginger was her bread-and-butter cartoon, and it lasted mor", "imageUrl": null, "keyword": "patty-jo 'n' ginger", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Do Any Women Draw Comics?\n\nThe Pittsburgh Courier, a weeklyAfrican-American newspaper published on her comic strip, Torchy Brown in Dixie to Harlem from 1937 to 1938. Torchy Brown was a humorous depiction of a Mississippi teen female who found fame and fortune singing and dancing in the Cotton Club.", "imageUrl": null, "keyword": "torchy brown", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Ormes began her journalism career in 1930 at the Pittsburgh Courier as a proofreader, later covering the police beat and other community stories. A year after marrying Earl Ormes in 1936 \u2014 whom she would be married to for 45 years, until his death \u2014 her big break as a comic strip artist unfolded. Fr", "imageUrl": null, "keyword": "torchy brown", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Jackie Ormes: The First African American Woman Cartoonist by Nancy Goldstein: This one is a little bit of a cheat because it isn\u2019t JUST comics, it\u2019s also a prose biography of this amazing woman. Unfortunately, this is the only book that gathers a significant amount Ormes\u2019s work. Jackie Ormes has bee", "imageUrl": null, "keyword": "nancy goldstein", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "So, this i
