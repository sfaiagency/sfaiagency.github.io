ll, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "After they\u2019d made the spectacle look and feel like a trial, it was easy to convince fence-sitting moderate Republican viewers that establishing guilt beyond reasonable doubt was even necessary. By TED RALL\n\nThe Kavanaugh confirmation battle was a grenade wrapped in an onion covered with more poisono", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "In this political cartoon for aNewDomain.net, our Ted Rall points out what point the media is missing on the Rand Paul vs. the NSA issue. Commentary.\n\nBut the reactions to this news all focus on questioning Paul\u2019s motivations and libertarian politics, rather than on examining the big issue at hand: ", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "With this political cartoon exclusive to aNewDomain.net, I\u2019m Ted Rall.", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "As I\u2019ve mentioned in the past, I firmly believe in capitalism. So why am I posting this comic by Ted Rall that condemns capitalism as a system where income inequality is a core feature? Because I agree with Rall that capitalism, at least as currently practiced, has lost its way and has serious probl", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "United Media was a large editorial column and comic strip newspaper syndication service based in the United States, owned by the E. W. Scripps Company, that operated from 1978 to 2011. It syndicated 150 comics and editorial columns worldwide. Its core businesses were the United Feature Syndicate and", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The late Peter Jennings. (As drawn by David Horsey.)\n\nThe zombie twin of Dr. Julius Hibbert. (As drawn by Ted Rall.)\n\nA selection from Now That\u2019s What I Call Borderline Offensive Clip Art, Volume 3 (As drawn by Gary McCoy.)\n\nMario Cuomo\u2026 walking like an Egyptian. (As drawn by the Vancouver Sun\u2018s Roy", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Steven Taylor is baffled by Ted Rall\u2019s assertion that President Bush is \u201ca right-wing extremist,\u201d given the surprising number of decidedly un-conservative measures he\u2019s taken while in office.\n\nHonestly, I think \u201cradical right winger\u201d is now a code word for \u201cEvangelical Christian.\u201d It\u2019s the only expl", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "TRUMP is an informative guide on Donald Trump presented in a comics format by Ted Rall, published by Seven Stories Press. It is not a satire, nor is it a bombastic attack on Mr. Trump. In fact, if you were only to read a brief passage here or there, you might even warm up a [\u2026]", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The only graphic novel-style biography of the Presidential Contender.\n\nNational Bestseller updated for 2020 with 24 new pages taking Bernie into the 2020 election.\n\nTed Rall's Bernie explores the personal and political development of a man who burst onto the national stage in 2015\u2014rallying Americans", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "No one is above the law \u2014 unless you\u2019re in college, that is. And with Betsy Devos\u2019 Title IX rollback, the gulf between reality and college is even wider. BY TED RALL\n\naNewDomain \u2014 Freshman orientation, Columbia University, New York City, Fall 1981: Now as then, there were speeches. A blur of uppercl", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Leaker: Edward Snowden stole the largest haul of secrets in history from the NSA\n\nA comic book artist is to publish a graphic novel telling the story of the man behind the biggest intelligence leak in military history.\n\n'Snowden' by Pulitzer-nominated Ted Rall claims that the former contractor for t", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "BY TED RALL   |  Is there any justification at all for bombing ISIS?\n\nThere isn\u2019t any congressional authorization, much less a declaration of war. Is there even a good reason for the U.S. to be involved?\n\nThere is no better time to ask this question than now, as much of the world (me included) is di", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Part graphic novel travelog, part tongue-in-cheek travel guide, here are the adventures of caustic cartoonist Rall in the wild and wooly central Asian countries, a powder keg sitting on tomorrow\u2019s oil\u2026 Combines articles with comics chapters relating his experiences retracing the old legendary Silk R", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Just When You Thought Ted Rall Could Not Go Any Lower...\n\nI don\u2019t even know why I bother but I frequently check out the editorial cartoons on yahoo.com. Sometimes they are funny (yes I do laugh at some of them that reflect poorly on the Republicans because they are usually spot on) but most of the t", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "As Long As Enemies Of The State Keep Dying Before Trial, No One Should Trust The State\n\nAuthored by Ted Rall via The Unz Review,\n\nThere is no other way to say it: It was a political assassination.\n\nOsama bin Laden was unarmed. SEALs captured him alive. Following brazenly illegal orders from Washingt", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Today at San Diego Comic-Con International's Publisher's Weekly panel on graphic journalism, political cartoonist and graphic novelist Ted Rall debuted the cover of Tales From the Crypt of Democracy, his forthcoming graphic novel that's included inside 7 Stories Press' Billionaires and Ballot Bandit", "imageUrl": null, "keyword": "ted rall", "tier": "high", "punsafe": null, "validation": {"cate ": false}], "extractionRate": 0.0, "meanSimilarity": 0.0827, "similarityThreshold": 0.85}], "summary": {"contributions": {"loss_based": 0.6832, "secmi": 0.326, "pia": 0.5177, "extraction": 0.0414}, "best": 0.6832}}}]}], "summary": {"totalModels": 2, "modelsProbed": 2, "overallRisk": "MODERATE"}, "models": [{"id": "runwayml/stable-diffusion-v1-5", "name": "runwayml/stable-diffusion-v1-5"}, {"id": "CompVis/stable-diffusion-v1-4", "name": "CompVis/stable-diffusion-v1-4"}]}, "reportName": "Ted Rall", "generatedAt": "2026-08-06T07:10:11.007705+00:00", "datasetSearch": {"mode": "exhaustive-all-shards", "exact": true, "keywordsScanned": ["Ted Rall"], "keywordsExcludedAsGeneric": ["Rall"], "keywordEvidence": [{"keyword": "ted rall", "tier": "high", "count": 3234, "captionHits": 1471, "longformHits": 1763, "longformRatio": 0.545, "perDataset": {"c4-en": 13, "coyo700m": 287, "laion1b-nolang": 112, "laion2b-en": 1026, "laion2b-multi": 46, "obelics": 1744, "pile": 6}, "reason": null}], "summary": {"datasetsPresent": 7, "totalDatasets": 7, "credibleMentions": 3234, "highConfidenceMentions": 3234, "nameMatchMentions": 0, "thirdPartyPropertyMentions": 0, "lowConfidenceMentions": 0}, "evidenceShown": 175, "evidenceWithheld": {"unverified": 1269, "person_photo": 177, "storefront": 22, "unrelated": 27, "not_flat_art": 89, "derivative": 1, "merchandise": 1, "explicit": 4}, "generatedAt": "2026-08-06T07:10:11.007705+00:00"}, "subjectId": "ted-rall", "cohort": "early-adopter", "holistic": {"datasetEvidence": 3234, "datasetsPresent": 7, "membershipInference": 0.5568, "confirmedModels": 77, "estimatedMonthlyUsers": 24862000, "membershipInferenceAvailable": true, "note": "Both signals available \u2014 grade folds dataset presence and model probes."}}</script>
<script>
const R = JSON.parse(document.getElementById('data').textContent);
const S = R.summary || {};
const GRADES = [
  {g:'A',c:'#2E9E5B'},{g:'B',c:'#7CB342'},{g:'C',c:'#F0A202'},
  {g:'D+',c:'#EF8354'},{g:'D',c:'#E8622C'},{g:'F',c:'#D14A3A'}
];
function fmt(n){ n=n||0;
  if(n>=1e9) return '~'+(n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(n>=1e6) return '~'+(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1e3) return '~'+(n/1e3).toFixed(0)+'K';
  return ''+n;
}
// fmt() already prefixes "~" for rounded values, so callers must not add their own.
// A dataset scanned exhaustively (every shard) reports an exact count -- show it in
// full rather than rounding it and implying an estimate.
function mentions(d){
  const n = d.mentionsFound||d.count||0;
  if(!n) return 'Nothing found';
  return (d.exact ? n.toLocaleString('en-US') : fmt(n)) + ' mention' + (n===1?'':'s');
}
const present = S.datasetsPresent||0;
// Membership-inference memorization signal, folded into the overall grade so a
// clean dataset search can't read "A" while the models clearly memorized the
// work. mia = mean of the per-model aggregate scores (0.5 is the null point).
const _probeScores = (((R.imageInference||{}).works||[]).flatMap(w=>w.modelResults||[]))
  .filter(m=>m.riskLevel&&m.riskLevel!=='SKIPPED'&&m.riskLevel!=='ERROR')
  .map(m=>m.score||0);
const mia = _probeScores.length ? _probeScores.reduce((a,b)=>a+b,0)/_probeScores.length : null;
// Memorization evidence lifts the severity: meaningful (+2), some (+1), none (0).
const miaBump = mia==null?0 : (mia>=0.60?2 : mia>=0.50?1 : 0);
const grade = GRADES[Math.min(present+miaBump,5)];
// The hero carries the score, the grade and the two summary lines -- nothing else.
// Badges here state *findings*, so only a positive memorization signal earns one.
// A "no clear memorization" badge derived from the mean also contradicted itself:
// the mean can sit below 0.50 while an individual model still reads MODERATE in
// the section below, so the hero was denying what the page then showed.
const MEMO = mia==null ? null
  : mia>=0.60 ? {t:'Memorization detected',line:'There is meaningful evidence that AI models have found and memorized parts of your work.',c:'#D14A3A',positive:true}
  : mia>=0.50 ? {t:'Early signs of memorization',line:'There is some evidence that AI models have begun to memorize your work.',c:'#E8622C',positive:true}
  : {t:'No clear memorization',line:'We found no clear evidence that AI models have memorized your work.',c:'#2E9E5B',positive:false};
const flagged = new Set();
for(const inf of [R.imageInference,R.audioInference,R.writingInference]){
  for(const w of (inf&&inf.works)||[]) for(const m of w.modelResults||[])
    if(m.riskLevel==='HIGH'||m.riskLevel==='MODERATE') flagged.add(m.model||m.imageModel);
}
const modelCount = (R.models||[]).length + flagged.size;
const noun = R.modality==='music'||R.modality==='podcast_radio' ? 'recordings'
  : R.modality==='writing' ? 'writing' : R.modality==='video'||R.modality==='animation' ? 'videos' : 'images';
const cor = s => '<span style="color:var(--coral)">'+s+'</span>';
// Big plain-language summary + a detailed line beneath it (numbers highlighted).
// The overall message unifies TWO signals: whether the work was found in
// training datasets, and whether directly probing the models shows memorization.
const memStrong = mia!=null && mia>=0.60, memSome = mia!=null && mia>=0.50;
let summary, detail;
if (present===0 && !memSome) {
  summary = mia==null
    ? 'No sign of your work in AI training data — for now.'
    : 'No clear sign AI models have used or memorized your work — for now.';
  detail = 'We searched '+cor(S.totalDatasets||0)+' AI training datasets and found no mention of your work'
    + (mia!=null ? ', and directly testing AI models turned up no clear memorization.' : '. New ones appear all the time, so it\'s worth re-checking.');
} else if (present===0 && memSome) {
  // The "clean datasets but the model clearly memorized it" case: never an A.
  summary = memStrong
    ? 'AI models appear to have memorized parts of your work.'
    : 'AI models are showing early signs of memorizing your work.';
  detail = 'Your work wasn\'t found in the '+cor(S.totalDatasets||0)+' datasets we searched, but directly testing the AI models turned up '
    + (memStrong?'meaningful':'some')+' evidence that they have memorized it.';
} else {
  summary = 'AI companies are using your '+noun+' to teach their AI software.';
  detail = 'Your work was found in at least '+cor(present)+' major AI training dataset'+(present===1?'':'s')
    + (modelCount>0 ? ' and was likely used to train at least '+cor(modelCount)+' AI models.' : '.')
    + (memSome ? ' Directly testing the AI models also shows '+(memStrong?'meaningful':'some')+' evidence of memorization.' : '');

// The hosted API renames monthlyActiveUsers -> monthlyDownloads (reportProcessor.js);
// croquis-local reads scanner.models directly, which keeps the original name. Accept both.
const mUsers = m => m.monthlyDownloads || m.monthlyActiveUsers || 0;
const models = (R.models||[]).slice().sort((a,b)=>(b.isMajor?1:0)-(a.isMajor?1:0)||mUsers(b)-mUsers(a));
const majorNames = models.filter(m=>m.isMajor).map(m=>m.name).slice(0,5);
const names = majorNames.length?majorNames:models.slice(0,3).map(m=>m.name);
const probes = ((R.imageInference&&R.imageInference.works&&R.imageInference.works[0]&&R.imageInference.works[0].modelResults)||[])
  .filter(r=>r.riskLevel&&r.riskLevel!=='SKIPPED'&&r.riskLevel!=='ERROR').sort((a,b)=>(b.score||0)-(a.score||0));

// section states a negative finding and nothing else, so it is dropped entirely —
// the report shows findings, not the absence of them.
const VERD = {HIGH:['Likely trained on your work','#fff','var(--coral)'],
  MODERATE:['Shows signs of being trained on your work','#856404','#fff3cd'],
  LOW:['Probably not trained on your work','#155724','#d4edda']};
// Evidence gallery. A caption match is not automatically showable: the same
// keywords pull back merchandise, storefront listings, photos of the creator and

// anything not cleared is counted but never rendered.
const probesShow = probes.some(r=>r.riskLevel && r.riskLevel!=='LOW') ? probes : [];

  if(!(row.imageUrl||row.text)) continue;
  const v=row.validation;
  if(v && v.displayable===false){ withheldBy[v.category]=(withheldBy[v.category]||0)+1; continue; }

// A pipeline may drop withheld rows before writing results.json rather than
// carrying them, in which case the tally above is empty and the real counts are
// on datasetSearch.evidenceWithheld. Prefer whichever actually has numbers.
const declaredWithheld=(R.datasetSearch||{}).evidenceWithheld||{};

// Cap what a single page renders. Peanuts and The Simpsons match hundreds of

// gallery nobody can scroll.
const EVIDENCE_CAP=200;
const shownEvidence=evidence.slice(0,EVIDENCE_CAP);
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.documentElement.style.setProperty('--grade',grade.c);
document.getElementById('app').innerHTML = `
  <div class="brand"><b>Croquis</b></div>
  <div class="tag">Was this work used to train AI?</div>
  <h1>${esc(R.reportName||R.artistName)}</h1>
  <div class="meta">Generated ${new Date(R.generatedAt||Date.now()).toLocaleString()}</div>
  <h2 class="score-heading">Croquis Score</h2>
  <div class="hero"><div class="chip">${grade.g}</div><div>
    <p class="hsum">${esc(summary)}</p>
    <p class="hdet">${detail}</p>
    ${MEMO&&MEMO.positive?`<div class="pills"><span class="badge" style="color:#fff;background:${MEMO.c}">${esc(MEMO.t)}</span><span style="color:var(--gray);font-size:14px">${esc(MEMO.line)}</span></div>`:''}
    ${names.length?`<div class="pills"><span class="hlabel" style="margin:0">Trained on your work:</span>${names.map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>`:''}
  </div></div>
  ${present>0?`<div class="nums">
    <div class="num"><b>${fmt(S.estimatedMonthlyUsers)}</b><span>people a month use AI trained on your work</span></div>
    <div class="num"><b>${fmt(S.estimatedTotalGenerations)}</b><span>${noun} made with those AI models</span></div>
    <div class="num"><b>${fmt(S.totalMentions)}</b><span>times your work was mentioned in training data</span></div>
  </div>`:''}
  <div class="next"><h2>What&rsquo;s next</h2><div class="steps">
    <div class="step"><div class="n">1</div><h3>Spread awareness</h3><p>Post your score. The more artists know, the harder it is to ignore.</p></div>
    <div class="step"><div class="n">2</div><h3>Protect your work</h3><p>Free tools can make new work much harder for AI companies to scrape.</p></div>
    <div class="step"><div class="n">3</div><h3>Seek counsel</h3><p>You may have legal options. A lawyer who knows artists' rights can tell you what they are.</p></div>
  </div></div>
  ${probesShow.length?`<section><h2>Evidence from models</h2>
    ${probesShow.map(r=>{const v=VERD[r.riskLevel]||VERD.LOW;return `<div class="row ${r.riskLevel==='HIGH'?'maj':''}"><span class="name">${esc(r.name||r.model)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${Math.round((r.score||0)*100)}% match</span><span class="badge" style="color:${v[2]};background:${v[1]==='#fff'?'rgba(225,90,74,.1)':v[1]}">${v[0]}</span></div>`;}).join('')}
  </section>`:''}
  ${models.length?`<section><h2>${models.length} AI model${models.length===1?'':'s'} trained on your work</h2>
    ${models.map(m=>`<div class="row ${m.isMajor?'maj':''}"><span class="name">${esc(m.name)}</span><span class="sp"></span>${mUsers(m)?`<span style="color:var(--gray);font-size:13px">${fmt(mUsers(m))} users/mo</span>`:''}</div>`).join('')}
  </section>`:''}
  ${evidence.length?`<section><h2>Examples of what we found in the datasets</h2>
    ${withheldTotal?`<p style="color:var(--gray);font-size:14px;margin:-6px 0 16px">
      A further ${withheldTotal.toLocaleString('en-US')} match${withheldTotal===1?' was':'es were'} found but withheld from this gallery (${
        Object.entries(withheldBy).map(([k,n])=>`${n.toLocaleString('en-US')} ${k.replace(/_/g,' ')}`).join(', ')}) — they are counted above but are not examples of your work.
    </p>`:''}
    <div class="grid">
    ${shownEvidence.map(e=>`<div class="card">${e.imageUrl?`<img src="${esc(e.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="cap">${esc(e.text||'')}</div></div>`).join('')}
  </div></section>`:''}
  <section><h2>Where we looked</h2>
    <p>Searched ${(R.datasets||[]).length} public AI training datasets. Your work appeared in <b>${present}</b> of them.</p>
    ${(R.datasets||[]).map(d=>`<div class="row"><span class="name">${esc(d.datasetName)}</span><span class="sp"></span><span style="color:var(--gray);font-size:13px">${mentions(d)}</span></div>`).join('')}
  </section>

`;
