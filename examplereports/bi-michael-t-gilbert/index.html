overageNote": "", "highConfidenceCount": 0, "nameMatchCount": 149, "thirdPartyCount": 361, "lowConfidenceCount": 0, "totalIncludingLowConfidence": 510, "rows": [{"text": "Out in January 2022 from Fantagraphics. Available for pre-order now from Amazon.\n\nFrom their inception in 1935, comic books \u2015 starring Superman, Batman, Captain Marvel \u2015 had been primarily written for and aimed at adolescents. There were always the occasional outlier artists who pushed back against ", "imageUrl": null, "keyword": "michael t. gilbert", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "G.I. Joe: The Cobra Files is the newest title in IDW\u2019s impressive line of G.I. Joe comics.  Written by Mike Costa and with art by Antonio Fuso, both of whom have worked with the Joes before, Cobra Files centers on an elite team of Joes tasked with hunting down and eliminating Cobra-centric schemes a", "imageUrl": null, "keyword": "michael t. gilbert", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "Zahra's Paradise: Your huge book publisher-released politically relevant comics choice for 9/21, a First Second print edition of a pseudonymous webcomic (by \"Amir\" & \"Khalil\") about a man's technology-powered search for his vanished brother in the wake of Iranian election protests, initially posted ", "imageUrl": null, "keyword": "michael t. gilbert", "tier": "namematch", "punsafe": null, "validation": {"category": "artwork", "reason": "", "displayable": true, "source": "heuristic", "confidence": 0.6}}, {"text": "The tragedy of the American comic book in the 20th century was its struggle for cultural recognition. Artists, writers, editors and publishers in this competitive, ultra-commercial market had to weather changes in public taste, to determine if a curre
