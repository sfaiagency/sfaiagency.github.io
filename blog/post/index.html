<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting&hellip; &mdash; SFAI.agency</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://sfai.agency/blog/">

    <!-- Posts used to be served from this one shell at /blog/post/?slug=<slug>,
         which is why they shared so badly: every post handed crawlers the same
         empty page. Each post now has a real page at /blog/<slug>/ with its own
         metadata, and this shell just forwards. It stays because links to the
         old URLs are already out on LinkedIn and in newsletters.

         The og: tags below are the best that can be done for those old links:
         the target depends on a query string, and a crawler will not run the
         redirect, so at least show the site card instead of nothing. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SFAI.agency">
    <meta property="og:title" content="SFAI.agency Blog">
    <meta property="og:description" content="News and notes from the Artificial Intelligence Agency of San Francisco.">
    <meta property="og:url" content="https://sfai.agency/blog/">
    <meta property="og:image" content="https://sfai.agency/assets/share/default.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SFAI.agency">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SFAI.agency Blog">
    <meta name="twitter:description" content="News and notes from the Artificial Intelligence Agency of San Francisco.">
    <meta name="twitter:image" content="https://sfai.agency/assets/share/default.jpg">

    <script>
    (function () {
        var slug = (new URLSearchParams(window.location.search).get('slug') || '')
            .replace(/[^a-zA-Z0-9_-]/g, '');
        // replace() rather than assign() so Back returns to where the reader
        // came from rather than bouncing through here again.
        window.location.replace(slug ? '../' + slug + '/' : '../');
    })();
    </script>
    <link rel="stylesheet" href="https://use.typekit.net/hhx2fen.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <article class="post-article">
        <div class="post-article-inner">
            <p>This post has moved. <a href="../">Go to the blog</a>.</p>
        </div>
    </article>
</body>
</html>
